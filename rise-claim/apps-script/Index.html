<!DOCTYPE html>

<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#14201A; --muted:#5A6A60; --line:#DAE2DB;
  --accent:#1D6A43; --accent-ink:#FFFFFF; --accent-soft:#E1EFE6;
  --warn:#9A6312; --warn-soft:#FAEFD8; --bad:#B03838; --bad-soft:#F8E3E1;
  --info:#2C5C8A; --info-soft:#E1EBF5; --scrim:rgba(12,22,16,.45);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1411; --surface:#161F1A; --ink:#E4EBE6; --muted:#93A399; --line:#26332B;
  --accent:#55B783; --accent-ink:#0B1910; --accent-soft:#1A3225;
  --warn:#E2AA4E; --warn-soft:#382C15; --bad:#E77B7B; --bad-soft:#3A1F1F;
  --info:#82B2E2; --info-soft:#18293A; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(24px,5vw,30px);font-weight:800}
h2{font-size:18px;font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.amt,.stat b,td.num{font-variant-numeric:tabular-nums}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;color:var(--accent)}
.brand .b1{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.04em;color:var(--ink)}
.brand .b2{font-size:14px;color:var(--muted);font-weight:500}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select,input,textarea{font:inherit;color:var(--ink)}
.pick select{font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
main{padding-block:20px 0;min-height:60vh}
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.rate-line{font-size:13.5px;color:var(--muted);margin-top:4px}
.rate-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.sync{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);line-height:1.3}
.sync small{font-size:12px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:none}
.pulse.off{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.steps{list-style:none;margin:0 0 16px;padding:0;display:flex;gap:6px}
.steps li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.steps .dot{height:5px;border-radius:3px;background:var(--line)}
.steps li.done .dot{background:var(--accent)}
.steps li.cur{color:var(--ink)}
.steps li.cur .dot{background:var(--accent);opacity:.55}
.notice{border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:14px}
.notice b{display:block;margin-bottom:2px}
.notice.bad{background:var(--bad-soft)} .notice.bad b{color:var(--bad)}
.notice.info{background:var(--info-soft)} .notice.info b{color:var(--info)}
.notice.ok{background:var(--accent-soft)} .notice.ok b{color:var(--accent)}
.notice.warn{background:var(--warn-soft)} .notice.warn b{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(17px,4.4vw,24px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.attn b{color:var(--warn)}
.stat.alarm b{color:var(--bad)}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}

.list{display:grid;gap:8px}
.sess{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.sess.s-batal{opacity:.75}
.when{text-align:center;border-radius:8px;background:var(--bg);padding:6px 2px;line-height:1.15}
.when b{display:block;font-family:var(--f-display);font-size:20px}
.when span,.when small{display:block;font-size:11px;color:var(--muted)}
.sess.s-pending .when{background:var(--warn-soft)}
.sess.s-pending .when span,.sess.s-pending .when small{color:var(--warn)}
.sess.s-upcoming .when{background:var(--info-soft)}
.who{font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.src{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:1.6;white-space:nowrap}
.src.manual{color:var(--info);border-color:var(--info)}
.src.over{color:var(--bad);border-color:var(--bad)}
.warnline{font-size:12.5px;font-weight:600;color:var(--bad);margin-top:2px}
.prompt{font-size:12.5px;font-weight:600;color:var(--info);margin-top:2px}
.remark{margin-top:6px;font-size:13px;background:var(--info-soft);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
.remark b{color:var(--info);font-weight:600}
.rmk{color:var(--info)}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.amt small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.exp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.empty{display:grid;gap:2px;text-align:center;padding:22px 16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:14px}
.empty b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.muted{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;min-height:38px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.btn.sm{font-size:13px;padding:5px 11px;min-height:34px}
.btn.xs{font-size:12px;padding:2px 9px;min-height:28px;border-radius:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.warnbtn{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.submitbar{position:sticky;bottom:0;margin-top:28px;background:var(--surface);border-top:1px solid var(--line);z-index:5}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in small{display:block;font-size:12px;color:var(--muted)}
.bar-in b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.bar-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hint{font-size:12.5px;color:var(--warn);font-weight:600;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
.tbl-wrap table{min-width:720px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tr.sel td{background:var(--accent-soft)}
.mini td,.mini th{padding:7px 4px;font-size:14px}
.mini td:first-child,.mini th:first-child{padding-left:0}
.mini td:last-child,.mini th:last-child{padding-right:0}
.mini th{font-size:11px}
.mini tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;padding-top:10px}
.mini-wrap{overflow-x:auto}
.admin-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:820px){.admin-grid{grid-template-columns:minmax(0,1fr)}}
.act-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.rate{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.rate small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rm-in{display:flex;align-items:center;gap:4px;flex:none}
.rm-in em{font-style:normal;font-size:12px;color:var(--muted)}
.rm-in input{width:84px;text-align:right;font-variant-numeric:tabular-nums;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sub-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks>li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}
.ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1}
.ic.ok{background:var(--accent-soft);color:var(--accent)}
.ic.warn{background:var(--warn-soft);color:var(--warn)}
.ic.bad{background:var(--bad-soft);color:var(--bad)}
.ck-t{font-size:14px;font-weight:600;padding-top:1px}
.ck-t span{font-weight:500;color:var(--muted)}
.issues{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.issues li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;font-size:13px;background:var(--bg);border-radius:6px;padding:6px 8px}
.verdict{display:flex;align-items:center;gap:10px;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:14px}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.bal-low{color:var(--warn);font-weight:700}
.bal-over{color:var(--bad);font-weight:700}
.connect{display:grid;gap:10px}
.connect ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.connect .row{display:flex;flex-wrap:wrap;gap:8px}
.connect input{flex:1;min-width:200px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:14px}}
.sheet form{display:grid;gap:12px}
.sheet label{display:grid;gap:4px;font-size:13px;font-weight:600}
.sheet input,.sheet select,.sheet textarea{width:100%;font-weight:400;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sheet textarea{resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-act{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:4px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.lbl{font-size:13px;font-weight:600;margin-bottom:6px}
.opts{display:flex;gap:8px}
.sheet label.opt{display:flex;align-items:center;gap:8px;flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;cursor:pointer}
.sheet label.opt input{width:auto;margin:0;accent-color:var(--accent)}
.sheet label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast.err{background:var(--bad);color:#fff}
.loading{display:grid;place-items:center;gap:10px;padding:80px 16px;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
body.busy main{opacity:.6;pointer-events:none}
@media (max-width:420px){
  .sess{grid-template-columns:48px minmax(0,1fr)}
  .sess .amt{grid-column:2;text-align:left;margin-top:-4px}
  .sess .amt:empty{display:none}
  .stat{padding:10px}
  .stats:not(.four){grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats:not(.four) .stat:last-child{grid-column:1 / -1}
}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v17" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M8 3.5l10 3.5-10 3.5z" fill="currentColor"/><ellipse cx="7" cy="20.5" rx="5" ry="1.5" fill="currentColor" opacity=".35"/></svg>
    <span class="b1">RISE</span><span class="b2">Coach Claim</span>
  </div>
  <div class="top-r" id="top-r"></div>
</div></header>
<main id="app"><div class="loading"><div class="spin"></div>Memuatkan…</div></main>
<div id="modal" class="overlay" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
const KUNCI = <?!= kunciJson ?>;
const BULAN = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const BLN = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const HARI = ['Ahd','Isn','Sel','Rab','Kha','Jum','Sab'];
const STATUS = {pending:{l:'Perlu disahkan',c:'warn'},done:{l:'Selesai',c:'ok'},noshow:{l:'Tak datang',c:'bad'},late:{l:'Batal lewat',c:'bad'},batal:{l:'Dibatalkan dalam TidyCal',c:'muted'}};
const CLAIM = {draft:{l:'Draf',c:'muted'},submitted:{l:'Menunggu semakan',c:'info'},returned:{l:'Dipulangkan',c:'bad'},approved:{l:'Diluluskan',c:'ok'},paid:{l:'Dibayar',c:'ok'}};
const KAT = {pvt:'Private (pakej)',jgroup:'Junior group',agroup:'Adult group'};
const QUICK = ['Walk-in, bayar di kaunter','Student datang lewat','Tukar tarikh dengan student','Hujan, sesi dipendekkan','Student maklum sakit','Pakej baru dah dibayar','Student batal tapi datang juga'];

const S = {vm:null, bulan:'', filter:'todo', sel:null, busy:false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = n => 'RM' + Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const rm0 = n => 'RM' + Number(n||0).toLocaleString('en-MY',{maximumFractionDigits:0});
const dObj = s => new Date(s + 'T00:00:00');
const dLabel = s => dObj(s).getDate() + ' ' + BLN[dObj(s).getMonth()];
const namaBulan = b => BULAN[Number(b.slice(5,7))-1] + ' ' + b.slice(0,4);
const chip = st => `<span class="chip ${(CLAIM[st]||CLAIM.draft).c}">${(CLAIM[st]||CLAIM.draft).l}</span>`;
const coach = () => S.vm.coaches[0];
const findCoach = id => S.vm.coaches.find(c => c.id === id);

/* ---------- Panggilan ke server ---------- */
function call(fn, args, ok){
  if (S.busy) return;
  S.busy = true; document.body.classList.add('busy');
  google.script.run
    .withSuccessHandler(vm => { S.busy = false; document.body.classList.remove('busy'); S.vm = vm; S.bulan = vm.bulan; closeModal(); render(); if (ok) toast(ok); })
    .withFailureHandler(err => { S.busy = false; document.body.classList.remove('busy'); if (!S.vm) showError(err); else toast((err && err.message) || String(err), true); })
    [fn](KUNCI, S.bulan, ...(args||[]));
}
function showError(err){
  $('#app').innerHTML = `<div class="wrap"><div class="notice bad" style="margin-top:24px"><b>Tak dapat buka sistem</b><p>${esc((err && err.message) || err)}</p></div></div>`;
}

/* ---------- Paparan coach ---------- */
function stepper(st){
  const steps = [['draft','Draf'],['submitted','Dihantar'],['approved','Diluluskan'],['paid','Dibayar']];
  const idx = st === 'returned' ? 0 : Math.max(0, steps.findIndex(x => x[0] === st));
  return `<ol class="steps" aria-label="Status claim">${steps.map(([k,l],i)=>`<li class="${i<idx||(st==='paid'&&i===idx)?'done':i===idx?'cur':''}"><span class="dot"></span>${i===0&&st==='returned'?'Dipulangkan':l}</li>`).join('')}</ol>`;
}
function row(s, editable){
  const d = dObj(s.tarikh);
  const st = s.upcoming && s.status === 'pending' ? {l:'Akan datang',c:'info'} : STATUS[s.status];
  const pk = s.pkg;
  const pkTag = pk && !pk.tiada ? `<span class="src ${pk.over?'over':''}">Pakej ${pk.n}/${pk.total}</span>` : '';
  let warn = '';
  if (pk && pk.tiada && s.status !== 'batal') warn += `<div class="warnline">Tiada pakej direkod untuk student ni.</div>`;
  else if (pk && pk.over) warn += `<div class="warnline">Pakej student dah habis. Admin akan semak pakej baru.</div>`;
  if (s.tc === 'dibatalkan' && s.status !== 'batal') warn += `<div class="warnline">Booking ni dibatalkan dalam TidyCal.</div>`;
  if (editable && !s.remark && (s.sumber === 'manual' || (s.tc === 'dibatalkan' && s.status === 'done') || (pk && pk.over && s.status === 'done')))
    warn += `<div class="prompt">Tambah remark supaya admin faham.</div>`;
  const rmk = s.remark ? `<div class="remark"><b>Remark:</b> ${esc(s.remark)}</div>` : '';
  const rbtn = editable ? `<button type="button" class="btn ghost sm" data-action="remark" data-id="${esc(s.id)}">${s.remark?'Ubah remark':'+ Remark'}</button>` : '';
  let act;
  if (editable && s.status === 'pending' && !s.upcoming){
    act = `<div class="actions"><button type="button" class="btn primary sm" data-action="mark" data-id="${esc(s.id)}" data-st="done">Selesai</button><button type="button" class="btn sm" data-action="noshow" data-id="${esc(s.id)}">Tak datang</button><button type="button" class="btn sm" data-action="mark" data-id="${esc(s.id)}" data-st="late">Batal lewat</button>${rbtn}</div>`;
  } else if (editable && s.status === 'batal'){
    act = `<div class="actions"><span class="chip ${st.c}">${st.l}</span>${s.upcoming?'':`<button type="button" class="btn ghost sm" data-action="mark" data-id="${esc(s.id)}" data-st="done">Student datang juga</button>`}</div>`;
  } else if (editable && s.status !== 'pending'){
    act = `<div class="actions"><span class="chip ${st.c}">${st.l}</span><button type="button" class="btn ghost sm" data-action="mark" data-id="${esc(s.id)}" data-st="pending">Ubah</button>${rbtn}${s.sumber==='manual'?`<button type="button" class="btn ghost sm" data-action="del-session" data-id="${esc(s.id)}">Buang</button>`:''}</div>`;
  } else {
    act = `<div class="actions"><span class="chip ${st.c}">${st.l}</span>${editable?rbtn:''}</div>`;
  }
  const showAmt = s.status !== 'pending' && s.status !== 'batal';
  return `<article class="sess s-${s.upcoming&&s.status==='pending'?'upcoming':s.status}">
    <div class="when"><b>${d.getDate()}</b><span>${HARI[d.getDay()]}</span><small>${esc(s.masa)}</small></div>
    <div class="what" style="min-width:0"><div class="who">${esc(s.student)}<span class="src ${s.sumber}">${s.sumber==='manual'?'Manual · '+esc(s.sebab):'TidyCal'}</span>${pkTag}</div>
      <div class="meta">${esc(s.label)}${s.lokasi?' · '+esc(s.lokasi):''}</div>${warn}${rmk}${act}</div>
    <div class="amt">${showAmt ? rm(s.amount) + `<small>${esc(s.sub)}</small>` : ''}</div>
  </article>`;
}
function expRow(e, editable){
  return `<article class="exp"><div style="min-width:0"><div class="who">${esc(e.perkara)}</div><div class="meta">${dLabel(e.tarikh)} · ${e.resit?'Resit dilampirkan':'<span style="color:var(--bad)">Tiada resit</span>'}</div></div>
    <div class="amt">${rm(e.jumlah)}</div>${editable?`<button type="button" class="btn ghost sm" data-action="del-exp" data-id="${esc(e.id)}">Buang</button>`:'<span></span>'}</article>`;
}
function connectCard(c){
  if (c.disambung) return '';
  return `<section class="card connect" style="margin-bottom:16px">
    <div><p class="eyebrow">Langkah pertama</p><h2>Sambung TidyCal kau</h2></div>
    <ol>
      <li>Buka TidyCal, pergi ke <b>Integrations → Advanced → Manage API keys</b>, kemudian tab <b>Personal tokens</b>.</li>
      <li>Tekan buat token baru, beri nama "RISE Claim", dan salin token tu.</li>
      <li>Tampal di bawah dan tekan <b>Sambung</b>. Token disimpan secara rahsia dan hanya digunakan untuk baca booking kau.</li>
    </ol>
    <form class="row" data-form="token"><input type="password" id="tc-token" name="token" placeholder="Tampal personal token TidyCal" autocomplete="off" required><button class="btn primary">Sambung</button></form>
  </section>`;
}
function renderCoach(){
  const c = coach(), cl = c.claim, t = c.totals, editable = c.editable;
  let list = c.sessions.slice();
  if (S.filter === 'todo') list = list.filter(s => s.status === 'pending' && !s.upcoming);
  else if (S.filter === 'upcoming') list = list.filter(s => s.upcoming && s.status !== 'batal');
  else list = list.slice().reverse();
  const empty = S.filter === 'todo'
    ? (c.sessions.length ? `<div class="empty"><b>Semua sesi dah ditanda.</b><span>Semak jumlah di bawah, kemudian hantar claim.</span></div>` : `<div class="empty">Tiada sesi untuk ${namaBulan(S.bulan)}.</div>`)
    : `<div class="empty">Tiada sesi di sini.</div>`;
  let notice = '';
  if (cl.status === 'returned') notice = `<div class="notice bad"><b>Admin pulangkan claim ni</b><p>${esc(cl.note)}</p></div>`;
  if (cl.status === 'submitted') notice = `<div class="notice info"><b>Claim dah dihantar</b><p>Dihantar ${esc(cl.at)}. Admin akan semak. Kau tak boleh ubah lagi kecuali admin pulangkan.</p>${cl.remark?`<p style="margin-top:6px"><b style="display:inline">Remark kau:</b> ${esc(cl.remark)}</p>`:''}</div>`;
  if (cl.status === 'approved') notice = `<div class="notice ok"><b>Claim diluluskan</b><p>Diluluskan ${esc(cl.approvedAt)}. Bayaran akan dibuat oleh admin.</p></div>`;
  if (cl.status === 'paid') notice = `<div class="notice ok"><b>Claim dah dibayar</b><p>${rm(t.total)} dibayar ${esc(cl.paidAt)}.</p></div>`;
  const syncLine = c.disambung
    ? `<div class="sync"><span class="pulse ${c.ralatSegerak?'off':''}"></span><span>${esc(c.akaunTc||'TidyCal disambung')}<br><small>${c.ralatSegerak?esc(c.ralatSegerak):c.segerak?'Disegerak '+esc(c.segerak):'Belum disegerak'}</small></span><button type="button" class="btn sm" data-action="sync">Segerak sekarang</button></div>`
    : `<div class="sync"><span class="pulse off"></span><span>TidyCal belum disambung</span></div>`;
  let bar;
  if (!editable) bar = chip(cl.status);
  else if (t.pending) bar = `<div class="bar-r"><span class="hint">Tanda ${t.pending} sesi lagi dulu</span><button type="button" class="btn primary" disabled>Hantar claim</button></div>`;
  else if (t.upcoming) bar = `<div class="bar-r"><span class="hint">Boleh hantar selepas sesi terakhir (${dLabel(c.akhirSesi)})</span><button type="button" class="btn primary" disabled>Hantar claim</button></div>`;
  else bar = `<button type="button" class="btn primary" data-action="submit">${cl.status==='returned'?'Hantar semula':'Hantar claim'}</button>`;
  return `<div class="wrap">
    <section class="hello">
      <div><p class="eyebrow">Claim · ${namaBulan(S.bulan)}</p><h1>Hai, ${esc(c.nama)}</h1>
        <p class="rate-line">Kadar private kau: <b>${rm0(c.hargaPakej)} / ${S.vm.cfg.sesi_setiap_pakej} sesi</b> · kau dapat <b>${rm(c.bahagianPvt)}</b> setiap sesi. Group: <b>${rm(c.bahagianGroup)}</b> setiap sesi.</p></div>
      ${syncLine}
    </section>
    ${connectCard(c)}
    ${stepper(cl.status)}
    ${notice}
    <div class="stats">
      <div class="stat ${t.pending?'attn':''}"><span>Perlu ditanda</span><b>${t.pending}</b></div>
      <div class="stat"><span>Sesi selesai</span><b>${t.done}</b></div>
      <div class="stat"><span>Jumlah claim</span><b>${rm(t.total)}</b></div>
    </div>
    <div class="sec-head"><h2>Sesi ${BULAN[Number(S.bulan.slice(5,7))-1]}</h2>
      <div class="tools"><div class="filters" role="group" aria-label="Tapis sesi">
        <button type="button" class="fchip" aria-pressed="${S.filter==='todo'}" data-action="filter" data-f="todo">Perlu tindakan (${t.pending})</button>
        ${t.upcoming?`<button type="button" class="fchip" aria-pressed="${S.filter==='upcoming'}" data-action="filter" data-f="upcoming">Akan datang (${t.upcoming})</button>`:''}
        <button type="button" class="fchip" aria-pressed="${S.filter==='all'}" data-action="filter" data-f="all">Semua (${c.sessions.length})</button></div>
        ${editable?'<button type="button" class="btn sm" data-action="add-session">+ Walk-in</button>':''}</div>
    </div>
    <div class="list">${list.length ? list.map(s => row(s, editable)).join('') : empty}</div>
    <div class="sec-head"><h2>Kos tambahan</h2>${editable?'<button type="button" class="btn sm" data-action="add-exp">+ Tambah kos</button>':''}</div>
    <div class="list">${c.expenses.length ? c.expenses.map(e => expRow(e, editable)).join('') : '<div class="empty">Tiada kos tambahan. Contoh: bola range, parking, peralatan.</div>'}</div>
  </div>
  <div class="submitbar"><div class="wrap bar-in"><div><small>Jumlah claim ${namaBulan(S.bulan)}</small><b>${rm(t.total)}</b></div>${bar}</div></div>`;
}

/* ---------- Paparan admin ---------- */
function renderAdmin(){

  const total = cs.reduce((a,c) => a + c.totals.total, 0);
  const waiting = cs.filter(c => c.claim.status === 'submitted').length;
  const issues = cs.reduce((a,c) => a + c.totals.issues, 0);
  const paid = cs.filter(c => c.claim.status === 'paid').reduce((a,c) => a + c.totals.total, 0);
  return `<div class="wrap">
    <section class="hello"><div><p class="eyebrow">Admin · ${namaBulan(S.bulan)}</p><h1>Semakan claim bulanan</h1></div>
      <div class="tools"><button type="button" class="btn sm" data-action="sync">Segerak semua TidyCal</button>${S.vm.sheetUrl?`<a class="btn sm" href="${esc(S.vm.sheetUrl)}" target="_blank" rel="noopener">Buka Google Sheet</a>`:''}</div></section>
    <div class="stats four">
      <div class="stat"><span>Jumlah semua claim</span><b>${rm(total)}</b></div>
      <div class="stat ${waiting?'attn':''}"><span>Menunggu semakan</span><b>${waiting} coach</b></div>
      <div class="stat ${issues?'alarm':''}"><span>Isu perlu disemak</span><b>${issues}</b></div>
      <div class="stat"><span>Dah dibayar</span><b>${rm(paid)}</b></div>
    </div>
    <div class="sec-head"><h2>Semua coach</h2></div>
    ${cs.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>Coach</th><th>TidyCal</th><th class="num">Kadar pakej</th><th class="num">Sesi selesai</th><th>Semakan</th><th class="num">Jumlah</th><th>Status</th><th></th></tr></thead>
      <tbody>${cs.map(c => `<tr class="${S.sel===c.id?'sel':''}">
        <td><b>${esc(c.nama)}</b>${c.totals.pending?`<div class="meta">${c.totals.pending} sesi belum ditanda</div>`:''}</td>
        <td>${c.disambung?(c.ralatSegerak?'<span class="chip bad">Ralat</span>':'<span class="chip ok">Disambung</span>'):'<span class="chip warn">Belum</span>'}</td>
        <td class="num">${rm0(c.hargaPakej)}<div class="meta">/ ${S.vm.cfg.sesi_setiap_pakej} sesi</div></td>
        <td class="num">${c.totals.done}</td>
        <td>${c.totals.issues?`<span class="chip ${c.audit.some(a=>a.kind==='bad'&&a.items.length)?'bad':'warn'}">${c.totals.issues} isu</span>`:'<span class="chip ok">Semua padan</span>'}</td>
        <td class="num"><b>${rm(c.totals.total)}</b></td><td>${chip(c.claim.status)}</td>
        <td class="num"><button type="button" class="btn sm" data-action="select" data-id="${esc(c.id)}">Semak</button></td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="empty">Belum ada coach. Isi tab Coach dalam Google Sheet.</div>`}
    <div class="admin-grid">${S.sel ? detail(findCoach(S.sel)) : '<div></div>'}${settings()}</div>
  </div>`;
}
function detail(c){
  const cl = c.claim, a = c.audit, n = c.totals.issues;
  const checkList = a.map(ch => {
    const k = ch.items.length, ic = k ? ch.kind : 'ok';
    return `<li><span class="ic ${ic}" aria-hidden="true">${k?'!':'✓'}</span><div style="min-width:0"><div class="ck-t">${esc(ch.label)}${k?` <span>· ${k}</span>`:''}</div>
      ${k?`<ul class="issues">${ch.items.map(it => `<li><span>${esc(it.line)}<br><span class="muted">${esc(it.why)}</span>${it.remark?`<br><span class="rmk">Remark coach: ${esc(it.remark)}</span>`:''}</span>${ch.fixable?`<button type="button" class="btn xs" data-action="check" data-jenis="${it.jenis}" data-id="${esc(it.id)}">Dah semak</button>`:''}</li>`).join('')}</ul>`:''}</div></li>`;
  }).join('');
  const rs = c.sessions.filter(s => s.remark);
  const remarks = (cl.remark?`<div class="remark" style="margin:0 0 8px"><b>Untuk claim ni:</b> ${esc(cl.remark)}</div>`:'')
    + (rs.length?`<ul class="issues">${rs.map(s=>`<li><span>${dLabel(s.tarikh)}, ${esc(s.masa)} · ${esc(s.student)} · ${STATUS[s.status].l}<br><span class="rmk">${esc(s.remark)}</span></span></li>`).join('')}</ul>`:'')
    + (!cl.remark && !rs.length ? '<p class="meta">Tiada remark.</p>' : '');
  let actions = '';
  if (cl.status === 'submitted') actions = `<button type="button" class="btn primary" data-action="approve" data-id="${esc(c.id)}">${n?`Luluskan (${n} isu belum semak)`:'Luluskan'}</button><button type="button" class="btn warnbtn" data-action="return" data-id="${esc(c.id)}">Pulangkan kepada coach</button>`;
  else if (cl.status === 'approved') actions = `<button type="button" class="btn primary" data-action="paid" data-id="${esc(c.id)}">Tandakan dah bayar</button><button type="button" class="btn warnbtn" data-action="return" data-id="${esc(c.id)}">Pulangkan</button>`;
  else if (cl.status === 'draft' || cl.status === 'returned') actions = `<span class="meta" style="align-self:center">${cl.status==='returned'?'Menunggu coach betulkan dan hantar semula.':'Coach belum hantar claim.'}</span>`;
  return `<section class="card">
    <div class="card-head"><div><p class="eyebrow">Cross-check</p><h3>${esc(c.nama)}</h3></div>${chip(cl.status)}</div>
    ${cl.at?`<p class="meta" style="margin:-6px 0 12px">Dihantar ${esc(cl.at)}</p>`:''}
    ${c.ralatSegerak?`<div class="notice bad"><b>Segerak TidyCal gagal</b><p>${esc(c.ralatSegerak)}</p></div>`:''}
    ${cl.status==='returned'?`<div class="notice bad"><b>Nota kepada coach</b><p>${esc(cl.note)}</p></div>`:''}
    <div class="verdict ${n?'warn':'ok'}"><span class="ic ${n?'warn':'ok'}" aria-hidden="true">${n?'!':'✓'}</span>${n?`${n} perkara perlu disemak sebelum lulus`:'Semua semakan padan.'}</div>
    <p class="sub-h" style="margin-top:0">Semakan automatik</p>
    <ul class="checks">${checkList}</ul>
    <p class="sub-h">Remark coach</p>
    ${remarks}
    <p class="sub-h">Pengiraan</p>
    <div class="mini-wrap"><table class="mini">
      <thead><tr><th>Perkara</th><th class="num">Bil</th><th class="num">Harga sesi</th><th class="num">Coach</th></tr></thead>
      <tbody>
        ${c.pecahan.map(r => `<tr><td>${r.kategori==='pvt'?`Private (${rm0(c.hargaPakej)} / ${S.vm.cfg.sesi_setiap_pakej})`:esc(r.label)}</td><td class="num">${r.bil}</td><td class="num">${r.harga===null?'–':rm(r.harga)}</td><td class="num">${rm(r.jumlah)}</td></tr>`).join('')}
        ${c.expenses.map(e => `<tr><td>${esc(e.perkara)}${e.resit_url?` · <a href="${esc(e.resit_url)}" target="_blank" rel="noopener">resit</a>`:''}</td><td class="num">1</td><td class="num">–</td><td class="num">${rm(e.jumlah)}</td></tr>`).join('')}
        ${!c.pecahan.length && !c.expenses.length ? '<tr><td colspan="4" class="muted">Belum ada sesi selesai.</td></tr>' : ''}
      </tbody>
      <tfoot><tr><td colspan="3">Jumlah claim</td><td class="num">${rm(c.totals.total)}</td></tr></tfoot>
    </table></div>
    <p class="sub-h">Baki pakej student (private)</p>
    ${c.pakej.length ? `<div class="mini-wrap"><table class="mini">
      <thead><tr><th>Student</th><th>Mula</th><th class="num">Digunakan</th><th class="num">Baki</th></tr></thead>
      <tbody>${c.pakej.map(p => `<tr><td>${esc(p.student)}</td><td>${esc(p.mula)}</td><td class="num">${p.digunakan} / ${p.total}</td><td class="num ${p.baki<0?'bal-over':p.baki<=2?'bal-low':''}">${p.baki<0?`Lebih ${-p.baki}`:p.baki}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="meta">Tiada pakej direkod. Pakej dikesan dari bayaran TidyCal, atau tambah sendiri dalam tab Pakej.</p>'}
    <div class="act-row">${actions}</div>
  </section>`;
}

/* ---------- Modal ---------- */
function openModal(html){ const m = $('#modal'); m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; const f = m.querySelector('textarea,input:not([type=radio]),select'); if (f) f.focus(); }
function closeModal(){ const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
let tt; function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, err ? 6000 : 2800); }
const sesi = id => coach().sessions.find(s => s.id === id);
const sLine = s => `${dLabel(s.tarikh)}, ${esc(s.masa)} · ${esc(s.student)} · ${esc(s.label)}`;
const maxTarikh = () => { const akhir = S.bulan + '-' + String(new Date(+S.bulan.slice(0,4), +S.bulan.slice(5,7), 0).getDate()).padStart(2,'0'); return akhir < S.vm.hariIni ? akhir : S.vm.hariIni; };

    <label>Jenis sesi<select name="kategori">${Object.entries(KAT).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    <div class="field-row"><label>Lokasi<input name="lokasi" maxlength="40" value="Bay 1"></label>
    <label>Sumber<select name="sebab"><option>Walk-in</option><option>WhatsApp</option><option>Lain-lain</option></select></label></div>
    <label>Remark tentang bayaran<textarea name="remark" rows="2" maxlength="500" placeholder="cth. Bayar tunai di kaunter, resit no. 0412."></textarea></label>
    <div class="m-act"><button type="button" class="btn" data-action="close">Batal</button><button class="btn primary">Tambah sesi</button></div></form>`);
}
function expForm(){
  openModal(`<form data-form="exp">
    <div><h3>Tambah kos</h3><p class="meta">Kos yang kau bayar dulu untuk academy. Lampirkan gambar resit (had 5MB).</p></div>
    <div class="field-row"><label>Tarikh<input type="date" name="tarikh" min="${S.bulan}-01" max="${maxTarikh()}" value="${maxTarikh()}" required></label>
    <label>Jumlah (RM)<input type="number" name="jumlah" min="0.01" step="0.01" inputmode="decimal" required placeholder="0.00"></label></div>
    <label>Perkara<input name="perkara" required maxlength="120" placeholder="cth. Bola range untuk group" autocomplete="off"></label>
    <label>Resit<input type="file" name="fail" accept="image/*,.pdf"></label>
    <div class="m-act"><button type="button" class="btn" data-action="close">Batal</button><button class="btn primary">Tambah kos</button></div></form>`);
}
function submitForm(){
  const c = coach();
  openModal(`<form data-form="submit">
    <div><h3>Hantar claim ${namaBulan(S.bulan)}</h3><p class="meta">${c.totals.done} sesi selesai · jumlah ${rm(c.totals.total)}. Lepas hantar, kau tak boleh ubah kecuali admin pulangkan.</p></div>
    <label>Remark untuk admin (pilihan)<textarea name="remark" rows="3" maxlength="500" placeholder="cth. Ada 1 walk-in pada 21 Nov, dah bayar di kaunter.">${esc(c.claim.remark)}</textarea></label>
    <div class="m-act"><button type="button" class="btn" data-action="close">Batal</button><button class="btn primary">Hantar claim</button></div></form>`);
}
function returnForm(id){
  const c = findCoach(id);
  const lines = c.audit.filter(a => a.items.length).map(a => a.items.map(it => `- ${it.line}: ${it.why}`).join('\n')).join('\n');
  openModal(`<form data-form="return" data-id="${esc(id)}">
    <div><h3>Pulangkan claim ${esc(c.nama)}</h3><p class="meta">Coach akan nampak nota ni dan boleh betulkan sebelum hantar semula.</p></div>
    <label>Apa yang perlu dibetulkan?<textarea name="note" rows="6" required maxlength="1500">${esc(lines)}</textarea></label>
    <div class="m-act"><button type="button" class="btn" data-action="close">Batal</button><button class="btn warnbtn">Pulangkan</button></div></form>`);
}

/* ---------- Peristiwa ---------- */
document.addEventListener('click', e => {
  const m = $('#modal'); if (e.target === m) { closeModal(); return; }
  const b = e.target.closest('[data-action]'); if (!b || b.disabled) return;
  const a = b.dataset.action, id = b.dataset.id;
  switch (a) {
    case 'filter': S.filter = b.dataset.f; render(); break;
    case 'mark': call('api_mark', [id, b.dataset.st, false, null]); break;
    case 'noshow': noshowForm(id); break;
    case 'remark': remarkForm(id); break;
    case 'clear-remark': { const t = $('#rm-text'); if (t) { t.value = ''; t.focus(); } break; }
    case 'quick': { const t = $('#rm-text'); if (t) { const v = t.value.trim(); t.value = v ? v.replace(/\.?$/, '. ') + b.dataset.text : b.dataset.text; t.focus(); } break; }
    case 'del-session': call('api_deleteSession', [id], 'Sesi dibuang'); break;
    case 'del-exp': call('api_deleteExpense', [id], 'Kos dibuang'); break;
    case 'add-session': walkinForm(); break;
    case 'add-exp': expForm(); break;
    case 'submit': submitForm(); break;
    case 'sync': call('api_sync', [], 'Segerak selesai'); break;
    case 'close': closeModal(); break;
    case 'select': S.sel = id; render(); break;
    case 'check': call('api_check', [b.dataset.jenis, id], 'Ditandakan dah semak'); break;
    case 'approve': call('api_approve', [id], 'Claim diluluskan'); break;
    case 'return': returnForm(id); break;
    case 'paid': call('api_paid', [id], 'Ditandakan dah bayar'); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'bulan-sel') { S.bulan = e.target.value; S.filter = 'todo'; call('api_load', []); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fd = new FormData(f), kind = f.dataset.form, val = k => String(fd.get(k) || '').trim();
  if (kind === 'remark') call('api_remark', [f.dataset.id, val('remark')], val('remark') ? 'Remark disimpan' : 'Remark dikosongkan');
  else if (kind === 'noshow') call('api_mark', [f.dataset.id, 'noshow', fd.get('deduct') === 'ya', val('remark')], 'Ditanda tak datang');
  else if (kind === 'walkin') call('api_addWalkin', [{tarikh: val('tarikh'), masa: val('masa'), student: val('student'), kategori: val('kategori'), lokasi: val('lokasi'), sebab: val('sebab'), remark: val('remark')}], 'Walk-in ditambah');
  else if (kind === 'submit') call('api_submit', [val('remark')], 'Claim dihantar kepada admin');
  else if (kind === 'return') call('api_return', [f.dataset.id, val('note')], 'Claim dipulangkan');
  else if (kind === 'token') call('api_saveToken', [val('token')], 'TidyCal disambung');
  else if (kind === 'settings') {
    const cfg = {}; ['bahagian_coach','harga_group','sesi_setiap_pakej','bayar_tak_datang','bayar_batal_lewat'].forEach(k => cfg[k] = val(k));
    const pakej = {}; S.vm.coaches.forEach(c => pakej[c.id] = val('pkg-' + c.id));
    call('api_saveSettings', [{cfg, pakej}], 'Tetapan disimpan');
  }
  else if (kind === 'exp') {
    const o = {tarikh: val('tarikh'), jumlah: val('jumlah'), perkara: val('perkara')};
    const file = fd.get('fail');
    if (file && file.size) {
      if (file.size > 5 * 1024 * 1024) { toast('Gambar resit terlalu besar. Had 5MB.', true); return; }
      const r = new FileReader();
      r.onload = () => { o.fail = {name: file.name, mime: file.type, data: String(r.result).split(',')[1]}; call('api_addExpense', [o], 'Kos ditambah'); };
      r.onerror = () => toast('Tak dapat baca fail resit.', true);
      r.readAsDataURL(file);
    } else call('api_addExpense', [o], 'Kos ditambah');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

function render(){
  const vm = S.vm;
  $('#top-r').innerHTML = `<label class="pick"><span>Bulan</span><select id="bulan-sel">${vm.bulanPilihan.map(b => `<option value="${b}" ${b===vm.bulan?'selected':''}>${namaBulan(b)}</option>`).join('')}</select></label>${vm.role==='admin'?'<span class="chip info">Admin</span>':''}`;
  $('#app').innerHTML = vm.role === 'admin' ? renderAdmin() : renderCoach();
}
call('api_load', []);
</script>
</body>
</html>
