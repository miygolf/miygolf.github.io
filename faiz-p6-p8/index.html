<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* "Lab / telestrator" look: graphite, grid, red = before, lime = after */
      :root {
        --bg: #0a0c0f;
        --ink: #f2f2f2;
        --mute: #8a94a6;
        --before: #ff4d5e;
        --after: #b6ff3b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      #grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      #panels {
        position: absolute;
        left: 0;
        top: 330px;
        width: 1080px;
        height: 960px;
      }
      #stack {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 960px;
        object-fit: cover;
      }
      .frame {
        position: absolute;
        top: 330px;
        width: 537px;
        height: 960px;
        border: 3px solid;
        pointer-events: none;
      }
      #frame-b {
        left: 0;
        border-color: var(--before);
      }
      #frame-a {
        left: 543px;
        border-color: var(--after);
      }
      #divider {
        position: absolute;
        left: 537px;
        top: 330px;
        width: 6px;
        height: 960px;
        background: var(--bg);
      }
      .tick {
        position: absolute;
        width: 26px;
        height: 26px;
        border-color: rgba(242, 242, 242, 0.55);
        border-style: solid;
        border-width: 0;
      }
      #wm {
        position: absolute;
        left: 0;
        top: 1440px;
        width: 1080px;
        text-align: center;
        font-family: "Archivo Black", sans-serif;
        font-size: 210px;
        line-height: 1;
        color: transparent;
        -webkit-text-stroke: 2px rgba(242, 242, 242, 0.07);
        letter-spacing: 0.02em;
      }
      #ruler {
        position: absolute;
        left: 40px;
        top: 1400px;
        width: 1000px;
        height: 18px;
        background-image: linear-gradient(90deg, rgba(242, 242, 242, 0.18) 2px, transparent 2px);
        background-size: 20px 18px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16.27"
      data-width="1080"
      data-height="1920"
    >
      <div id="grid"></div>
      <div id="ruler" data-layout-ignore></div>
      <div id="wm" data-layout-ignore>P6·P8</div>
      <!-- Before (clip B, first swing) | After (clip C, 60 min later), frame-locked at P7 -->
      <div id="panels">
        <video
          id="stack"
          class="clip"
          src="assets/video/stack.mp4"
          data-start="0"
          data-duration="16.27"
          data-track-index="0"
          muted
          playsinline
        ></video>
      </div>
      <div id="divider"></div>
      <div id="frame-b" class="frame"></div>
      <div id="frame-a" class="frame"></div>
      <div class="tick" style="left: 40px; top: 1320px; border-left-width: 2px; border-bottom-width: 2px"></div>
      <div class="tick" style="left: 1014px; top: 1320px; border-right-width: 2px; border-bottom-width: 2px"></div>

      <div
        id="tele"
        data-composition-id="tele"
        data-composition-src="compositions/tele.html"
        data-start="0"
        data-duration="13.07"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="hud"
        data-composition-id="hud"
        data-composition-src="compositions/hud.html"
        data-start="0"
        data-duration="13.07"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="13.07"
        data-duration="3.2"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>


      <audio id="sfx-rt-impact" class="clip" src="assets/sfx/whoosh.mp3" data-start="1.44" data-duration="0.57" data-track-index="11" data-volume="0.36"></audio>
      <audio id="sfx-rewind" class="clip" src="assets/sfx/glitch-3.mp3" data-start="2.6" data-duration="0.6" data-track-index="12" data-volume="0.34"></audio>
      <audio id="sfx-slomo" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="4.23" data-duration="5.54" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-p6" class="clip" src="assets/sfx/click.mp3" data-start="5.03" data-duration="0.36" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-p7" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="6.65" data-duration="2.11" data-track-index="15" data-volume="0.44"></audio>
      <audio id="sfx-p8" class="clip" src="assets/sfx/click.mp3" data-start="8.76" data-duration="0.36" data-track-index="16" data-volume="0.5"></audio>
      <audio id="sfx-go" class="clip" src="assets/sfx/whoosh-hi.mp3" data-start="10.38" data-duration="0.48" data-track-index="17" data-volume="0.26"></audio>
      <audio id="sfx-outro" class="clip" src="assets/sfx/impact-lo.mp3" data-start="12.92" data-duration="2.35" data-track-index="18" data-volume="0.4"></audio>
      <audio id="sfx-outro-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="13.42" data-duration="0.72" data-track-index="19" data-volume="0.26"></audio>
      <audio id="sfx-outro-pop2" class="clip" src="assets/sfx/click-soft.mp3" data-start="13.7" data-duration="0.36" data-track-index="20" data-volume="0.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // panel frames flash to white on each hold
      [5.067, 6.767, 8.8].forEach((t) => {
        tl.fromTo(".frame", { borderColor: (i) => (i ? "#b6ff3b" : "#ff4d5e") }, { borderColor: "#f2f2f2", duration: 0.05, ease: "none", immediateRender: false }, t);
        tl.to(".frame", { borderColor: (i) => (i ? "#b6ff3b" : "#ff4d5e"), duration: 0.3, ease: "power2.out" }, t + 0.06);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
