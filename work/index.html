<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* "Fairway notes": dark fairway glass deck, cream yardage cards, alignment-stick lime */
      :root {
        --ink: #0b2b1e;
        --cream: #f5f0e1;
        --lime: #d4ff3a;
        --signal: #e8361f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #06140e;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 560px 300px;
        z-index: 1;
      }
      #plate {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27.0" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="plate" class="clip" src="assets/edit.mp4" data-start="0" data-duration="27.0" data-track-index="0"
          data-has-audio="true" data-volume="1" playsinline></video>
      </div>
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0.0" data-duration="1.5" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="problem" class="clip" data-composition-id="problem" data-composition-src="compositions/problem.html"
        data-start="4.6" data-duration="5.6" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>

    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const ZOOMS = [[0, 1.12], [1.5, 1.0], [2.267, 1.06], [3.567, 1.0], [4.867, 1.08], [5.633, 1.0], [8.233, 1.08], [9.833, 1.0], [12.133, 1.06], [13.933, 1.1], [14.867, 1.0], [16.533, 1.04], [19.033, 1.0], [20.333, 1.06], [21.133, 1.0], [23.167, 1.06], [23.933, 1.0]];
        ZOOMS.forEach(([t, s]) => tl.set("#cam", { scale: s }, t));
        // slam shake on the hook stamp
        [[0.0, 7, -5], [0.04, -6, 4], [0.08, 4, -3], [0.12, -2, 2], [0.16, 0, 0]].forEach(([t, x, y]) =>
          tl.set("#cam", { x, y }, t));
        // small kick when "sangat tinggi" lands
        [[9.52, 0, 5], [9.56, 0, -4], [9.6, 0, 2], [9.64, 0, 0]].forEach(([t, x, y]) => tl.set("#cam", { x, y }, t));
        window.__timelines["main"] = tl;
      })();
    </script>

</html>
