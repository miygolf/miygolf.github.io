  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">

        <div id="cap-cta" class="cap-group"><div class="cap-line"><span class="cap-w emph">Save</span> <span class="cap-w">&amp; cuba masa</span> <span class="cap-w emph">latihan.</span></div></div>

  <script>
    (function () {
      const DUR = 27.0;
      const TIMING = /*TIMING*/[];
      const tl = gsap.timeline({ paused: true });

      // deck is on screen from frame 0 (the thumbnail); progress runs the whole film
      tl.fromTo("#cap-progress", { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);

      // chapter tags: blur swap on one stage
      const chapters = [0, 1.5, 8.23, 16.53, 23.17, 25.2, DUR];
      for (let i = 0; i < 6; i++) {
        const a = chapters[i], b = chapters[i + 1];
        ["#cap-tag" + i, "#cap-count" + i].forEach((sel) => {
          if (i === 0) tl.set(sel, { opacity: 1, filter: "blur(0px)" }, 0);
          else tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, a);
          if (b < DUR) {
            tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, b - 0.12);
            tl.set(sel, { opacity: 0 }, b);
          }
        });
      }

      // caption groups: line blurs in, words go from dim to full as spoken
      TIMING.forEach((g, gi) => {
        const sel = "#" + g.id;
        if (gi === 0) tl.set(sel, { opacity: 1, filter: "blur(0px)" }, 0);
        else tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, g.show);
        if (gi === 0) return hold(g);  // the thumbnail frame reads in full
        g.w.forEach((w, wi) => {
          tl.fromTo(sel + "-w" + wi, { opacity: 0.32 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, Math.max(0, w[0] - 0.03));
        });
        hold(g);
      });
      function hold(g) {
        tl.to("#" + g.id, { opacity: 0, duration: 0.1, ease: "power2.in" }, g.hide - 0.1);
        tl.set("#" + g.id, { opacity: 0, visibility: "hidden" }, g.hide);
      }

      // closing line
      tl.fromTo("#cap-cta", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 25.25);
      tl.fromTo("#cap-cta .cap-w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, 25.25);
      tl.fromTo("#cap-deck", { borderColor: "rgba(212,255,58,0.22)" }, { borderColor: "rgba(212,255,58,0.9)", duration: 0.4, ease: "power2.inOut" }, 25.2);

      window.__timelines["captions"] = tl;
    })();
  </script>
