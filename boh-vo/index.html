<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <!-- Original BOH ad picture, unchanged; its own audio muted -->
      <video id="v-ad" class="clip shot" src="assets/video/boh.mp4" data-start="0" data-duration="20" data-media-start="0" muted data-track-index="0"></video>

      <!-- New voiceover: creator's own recording, each line placed on the original line's timing
           (Boh as one word, kafein, 'Malam pun rasa lebih santai.' instead of 'Tidur pasti makin lena.') -->
      <audio id="a-vo" class="clip" src="assets/audio/vo-new.m4a" data-start="0" data-duration="20" data-media-start="0" data-volume="1" data-track-index="1"></audio>

      <!-- Original sound effects (water pour etc.) with the old voice muted -->
      <audio id="a-sfx" class="clip" src="assets/audio/sfx-bed.m4a" data-start="0" data-duration="20" data-media-start="0" data-volume="0.8" data-track-index="2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
