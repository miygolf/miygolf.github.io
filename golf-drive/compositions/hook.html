  <script>
    // Scene clock: impact (club meets ball) lands at 0.806 s.
    const IMPACT = 0.806;
    const tl = gsap.timeline({ paused: true });

    // Frame 0 is the thumbnail: chip, old number and sub-line are already on screen.
    tl.set("#hook-chip", { opacity: 1, rotation: -3 }, 0);
    tl.set("#hook-chip-now", { rotation: -3 }, 0);
    tl.set("#hook-new", { scale: 0.55, rotation: -2 }, 0);
    tl.set("#hook-sticker", { scale: 0.2, rotation: -24 }, 0);
    tl.set("#hook-burst", { scale: 0.4, transformOrigin: "50% 50%" }, 0);
    tl.fromTo("#hook-old", { rotation: -2, scale: 1 }, { rotation: -2, scale: 1, duration: 0.01 }, 0);
    tl.fromTo("#hook-sub", { opacity: 1, x: 0 }, { opacity: 1, x: 0, duration: 0.01 }, 0);
    tl.fromTo("#hook-strike", { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);

    // Impact: white flash + burst on the ball.
    tl.fromTo("#hook-flash", { opacity: 0 }, { opacity: 0.55, duration: 0.04, ease: "none" }, IMPACT);
    tl.to("#hook-flash", { opacity: 0, duration: 0.16, ease: "power2.out" }, IMPACT + 0.04);
    tl.fromTo("#hook-burst", { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, IMPACT);
    tl.fromTo("#hook-burst", { scale: 0.4 }, { scale: 1.25, duration: 0.3, ease: "expo.out" }, IMPACT);
    tl.to("#hook-burst", { opacity: 0, duration: 0.18, ease: "power2.in" }, IMPACT + 0.2);

    // Marker strike through the old number, right after the hit.
    tl.to("#hook-strike", { scaleX: 1, duration: 0.14, ease: "power3.out" }, IMPACT + 0.03);
    tl.to("#hook-sub", { opacity: 0, x: 40, duration: 0.14, ease: "power3.in" }, IMPACT + 0.2);

    // Old card drops away, new card slams in.
    tl.to("#hook-old", { y: 70, rotation: 6, opacity: 0, duration: 0.16, ease: "power3.in" }, IMPACT + 0.17);
    tl.to("#hook-chip", { opacity: 0, duration: 0.08 }, IMPACT + 0.17);
    tl.to("#hook-chip-now", { opacity: 1, duration: 0.08 }, IMPACT + 0.2);
    tl.to(
      "#hook-new",
      { opacity: 1, scale: 1, rotation: -2, duration: 0.42, ease: "back.out(1.7)" },
      IMPACT + 0.22,
    );
    tl.to(
      "#hook-sticker",
      { opacity: 1, scale: 1, rotation: 10, duration: 0.36, ease: "back.out(2)" },
      IMPACT + 0.4,
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["hook"] = tl;
