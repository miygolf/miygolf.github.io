<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"cream","type":"color","label":"Sticker cream","default":"#FFF6E9"},
    {"id":"ink","type":"color","label":"Ink navy","default":"#1D2A6B"},
    {"id":"butter","type":"color","label":"Butter yellow","default":"#FFD45E"},
    {"id":"bubblegum","type":"color","label":"Bubblegum pink","default":"#FF8FB8"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* "Blueberry Cloud": cream sticker labels, navy ink, butter + bubblegum doodles. */
      :root {
        --cream: #fff6e9;
        --ink: #1d2a6b;
        --butter: #ffd45e;
        --bubblegum: #ff8fb8;
        --font-display: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .cam video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .ovl {
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30.9"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <!-- Footage: long takes from the three source clips, always full frame. -->
      <div class="cam" id="cam-s1" style="z-index: 1">
        <video id="s1" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="0.0" data-duration="7.8" data-media-start="2.0" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s2" style="z-index: 2">
        <video id="s2" class="clip" src="assets/footage/clip3.mp4" muted playsinline
          data-start="7.8" data-duration="4.0" data-media-start="4.0" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s3" style="z-index: 3">
        <video id="s3" class="clip" src="assets/footage/clip3.mp4" muted playsinline
          data-start="11.8" data-duration="3.2" data-media-start="12.4" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s4" style="z-index: 4">
        <video id="s4" class="clip" src="assets/footage/clip3.mp4" muted playsinline
          data-start="15.0" data-duration="2.3" data-media-start="17.2" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s5" style="z-index: 5">
        <video id="s5" class="clip" src="assets/footage/clip1.mp4" muted playsinline
          data-start="17.3" data-duration="5.0" data-media-start="5.2" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s6" style="z-index: 6">
        <video id="s6" class="clip" src="assets/footage/clip1.mp4" muted playsinline
          data-start="22.3" data-duration="4.0" data-media-start="10.5" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s7" style="z-index: 7">
        <video id="s7" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="26.3" data-duration="4.6" data-media-start="14.0" data-track-index="0"></video>
      </div>

      <!-- Graphics: one overlay scene per chapter. -->
      <div id="hook" class="ovl" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="7.8" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="feel" class="ovl" data-composition-id="feel" data-composition-src="compositions/feel.html"
        data-start="7.8" data-duration="9.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="fits" class="ovl" data-composition-id="fits" data-composition-src="compositions/fits.html"
        data-start="17.3" data-duration="9.0" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="outro" class="ovl" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="26.3" data-duration="4.6" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- No music: the footage's own (cleaned) sound runs under every shot. -->
      <audio id="foley-s1" class="clip" src="assets/foley/clip2.m4a" data-start="0.0" data-duration="7.8" data-media-start="2.0" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s2" class="clip" src="assets/foley/clip3.m4a" data-start="7.8" data-duration="4.0" data-media-start="4.0" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s3" class="clip" src="assets/foley/clip3.m4a" data-start="11.8" data-duration="3.2" data-media-start="12.4" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s4" class="clip" src="assets/foley/clip3.m4a" data-start="15.0" data-duration="2.3" data-media-start="17.2" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s5" class="clip" src="assets/foley/clip1.m4a" data-start="17.3" data-duration="5.0" data-media-start="5.2" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s6" class="clip" src="assets/foley/clip1.m4a" data-start="22.3" data-duration="4.0" data-media-start="10.5" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s7" class="clip" src="assets/foley/clip2.m4a" data-start="26.3" data-duration="4.42" data-media-start="14.0" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>

      <!-- Sound effects: each one has a cause on screen. -->
      <audio id="sfx-hook-pop" class="clip" src="assets/sfx/pop.mp3" data-start="0.04" data-duration="0.72" data-volume="0.6" data-track-index="6"></audio>
      <audio id="sfx-hook-sub" class="clip" src="assets/sfx/click-soft.mp3" data-start="0.73" data-duration="0.37" data-volume="0.8" data-track-index="7"></audio>
      <audio id="sfx-squeeze-pop" class="clip" src="assets/sfx/pop.mp3" data-start="3.3" data-duration="0.72" data-volume="0.6" data-track-index="8"></audio>
      <audio id="sfx-round-pop" class="clip" src="assets/sfx/pop.mp3" data-start="5.5" data-duration="0.72" data-volume="0.6" data-track-index="9"></audio>
      <audio id="sfx-texture-pop" class="clip" src="assets/sfx/pop.mp3" data-start="7.88" data-duration="0.72" data-volume="0.6" data-track-index="10"></audio>
      <audio id="sfx-secret-pop" class="clip" src="assets/sfx/pop.mp3" data-start="11.73" data-duration="0.72" data-volume="0.6" data-track-index="11"></audio>
      <audio id="sfx-hole-label" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.93" data-duration="0.37" data-volume="0.8" data-track-index="12"></audio>
      <audio id="sfx-hole-pill" class="clip" src="assets/sfx/pop.mp3" data-start="13.2" data-duration="0.72" data-volume="0.6" data-track-index="13"></audio>
      <audio id="sfx-edge-tap" class="clip" src="assets/sfx/click-soft.mp3" data-start="15.01" data-duration="0.37" data-volume="0.8" data-track-index="14"></audio>
      <audio id="sfx-fit-head" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="17.45" data-duration="0.57" data-volume="0.5" data-track-index="15"></audio>
      <audio id="sfx-fit-1" class="clip" src="assets/sfx/pop.mp3" data-start="17.78" data-duration="0.72" data-volume="0.6" data-track-index="16"></audio>
      <audio id="sfx-fit-2" class="clip" src="assets/sfx/pop.mp3" data-start="18.58" data-duration="0.72" data-volume="0.6" data-track-index="17"></audio>
      <audio id="sfx-fit-3" class="clip" src="assets/sfx/pop.mp3" data-start="19.38" data-duration="0.72" data-volume="0.6" data-track-index="18"></audio>
      <audio id="sfx-chair-click" class="clip" src="assets/sfx/click-soft.mp3" data-start="22.68" data-duration="0.37" data-volume="0.8" data-track-index="19"></audio>
      <audio id="sfx-title-pop" class="clip" src="assets/sfx/pop.mp3" data-start="27.03" data-duration="0.72" data-volume="0.6" data-track-index="21"></audio>
      <audio id="sfx-cta-pop" class="clip" src="assets/sfx/pop.mp3" data-start="28.33" data-duration="0.72" data-volume="0.6" data-track-index="22"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Gentle camera moves only; cuts are straight cuts so it plays as one video.
      tl.fromTo("#cam-s1", { scale: 1.08 }, { scale: 1.0, duration: 7.8, ease: "sine.inOut" }, 0);
      tl.fromTo("#cam-s2", { scale: 1.0 }, { scale: 1.06, duration: 4.0, ease: "sine.inOut" }, 7.8);
      tl.fromTo("#cam-s3", { scale: 1.1 }, { scale: 1.0, duration: 0.8, ease: "expo.out" }, 11.8);
      tl.fromTo("#cam-s4", { scale: 1.08 }, { scale: 1.0, duration: 0.6, ease: "expo.out" }, 15.0);
      tl.fromTo("#cam-s5", { scale: 1.0 }, { scale: 1.05, duration: 5.0, ease: "sine.inOut" }, 17.3);
      tl.fromTo("#cam-s6", { scale: 1.05 }, { scale: 1.0, duration: 4.0, ease: "sine.inOut" }, 22.3);
      tl.fromTo("#cam-s7", { scale: 1.06 }, { scale: 1.0, duration: 4.6, ease: "sine.out" }, 26.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
