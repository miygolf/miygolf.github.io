<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"cream","type":"color","label":"Sticker cream","default":"#FFF6E9"},
    {"id":"ink","type":"color","label":"Ink navy","default":"#1D2A6B"},
    {"id":"butter","type":"color","label":"Butter yellow","default":"#FFD45E"},
    {"id":"bubblegum","type":"color","label":"Bubblegum pink","default":"#FF8FB8"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* "Blueberry Cloud": cream sticker labels, navy ink, butter + bubblegum doodles. */
      :root {
        --cream: #fff6e9;
        --ink: #1d2a6b;
        --butter: #ffd45e;
        --bubblegum: #ff8fb8;
        --font-display: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .cam video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #cam-s9 {
        z-index: 10;
      }
      .ovl {
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.5"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <!-- Footage: each shot is a trimmed, muted clip inside an untimed camera wrapper. -->
      <div class="cam" id="cam-s1" style="z-index: 1">
        <video id="s1" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="0.0" data-duration="2.6" data-media-start="4.0" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s2" style="z-index: 2">
        <video id="s2" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="2.6" data-duration="1.8" data-media-start="7.7" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s3" style="z-index: 3">
        <video id="s3" class="clip" src="assets/footage/clip3.mp4" muted playsinline
          data-start="4.4" data-duration="2.0" data-media-start="5.8" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s4" style="z-index: 4">
        <video id="s4" class="clip" src="assets/footage/clip3.mp4" muted playsinline
          data-start="6.4" data-duration="1.8" data-media-start="17.4" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s5" style="z-index: 5">
        <video id="s5" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="8.2" data-duration="2.4" data-media-start="9.3" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s6" style="z-index: 6">
        <video id="s6" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="10.6" data-duration="1.4" data-media-start="12.6" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s7" style="z-index: 7">
        <video id="s7" class="clip" src="assets/footage/clip1.mp4" muted playsinline
          data-start="12.0" data-duration="2.0" data-media-start="0.2" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s8" style="z-index: 8">
        <video id="s8" class="clip" src="assets/footage/clip1.mp4" muted playsinline
          data-start="14.0" data-duration="2.2" data-media-start="11.6" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s9">
        <video id="s9" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="15.9" data-duration="4.6" data-media-start="14.0" data-playback-rate="0.75" data-track-index="0"></video>
      </div>

      <!-- Graphics: one overlay scene per chapter. -->
      <div id="hook" class="ovl" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="4.4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="feel" class="ovl" data-composition-id="feel" data-composition-src="compositions/feel.html"
        data-start="4.4" data-duration="6.2" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="chair" class="ovl" data-composition-id="chair" data-composition-src="compositions/chair.html"
        data-start="12.0" data-duration="3.9" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="outro" class="ovl" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="15.9" data-duration="4.6" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- No music: the footage's own (cleaned) sound under each shot, so hands on fabric are heard. -->
      <audio id="foley-s1" class="clip" src="assets/foley/clip2.m4a" data-start="0.0" data-duration="2.6" data-media-start="4.0" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s2" class="clip" src="assets/foley/clip2.m4a" data-start="2.6" data-duration="1.8" data-media-start="7.7" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s3" class="clip" src="assets/foley/clip3.m4a" data-start="4.4" data-duration="2.0" data-media-start="5.8" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s4" class="clip" src="assets/foley/clip3.m4a" data-start="6.4" data-duration="1.8" data-media-start="17.4" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s5" class="clip" src="assets/foley/clip2.m4a" data-start="8.2" data-duration="2.4" data-media-start="9.3" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s6" class="clip" src="assets/foley/clip2.m4a" data-start="10.6" data-duration="1.4" data-media-start="12.6" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s7" class="clip" src="assets/foley/clip1.m4a" data-start="12.0" data-duration="2.0" data-media-start="0.2" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s8" class="clip" src="assets/foley/clip1.m4a" data-start="14.0" data-duration="2.2" data-media-start="11.6" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s9" class="clip" src="assets/foley/clip2.m4a" data-start="15.9" data-duration="4.6" data-media-start="14.0" data-playback-rate="0.75" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>

      <!-- Sound effects: each one has a cause on screen. -->
      <audio id="sfx-pop-hook" class="clip" src="assets/sfx/pop.mp3" data-start="0.04" data-duration="0.72" data-volume="0.6" data-track-index="6"></audio>
      <audio id="sfx-pop-back" class="clip" src="assets/sfx/pop.mp3" data-start="2.52" data-duration="0.72" data-volume="0.68" data-track-index="7"></audio>
      <audio id="sfx-sparkle-back" class="clip" src="assets/sfx/sparkle.mp3" data-start="2.7" data-duration="1.8" data-volume="0.33" data-track-index="8"></audio>
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.22" data-duration="0.57" data-volume="0.57" data-track-index="9"></audio>
      <audio id="sfx-pop-soft" class="clip" src="assets/sfx/pop.mp3" data-start="4.54" data-duration="0.72" data-volume="0.52" data-track-index="10"></audio>
      <audio id="sfx-pop-edge" class="clip" src="assets/sfx/click-soft.mp3" data-start="6.47" data-duration="0.37" data-volume="0.83" data-track-index="11"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.04" data-duration="0.57" data-volume="0.52" data-track-index="12"></audio>
      <audio id="sfx-click-label" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.36" data-duration="0.37" data-volume="0.83" data-track-index="13"></audio>
      <audio id="sfx-sparkle-arrow" class="clip" src="assets/sfx/sparkle.mp3" data-start="8.92" data-duration="1.8" data-volume="0.33" data-track-index="14"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="11.84" data-duration="0.57" data-volume="0.57" data-track-index="15"></audio>
      <audio id="sfx-pop-chair" class="clip" src="assets/sfx/pop.mp3" data-start="12.2" data-duration="0.72" data-volume="0.52" data-track-index="16"></audio>
      <audio id="sfx-click-tick" class="clip" src="assets/sfx/click-soft.mp3" data-start="14.48" data-duration="0.37" data-volume="0.83" data-track-index="17"></audio>
      <audio id="sfx-chime-iris" class="clip" src="assets/sfx/chime.mp3" data-start="15.5" data-duration="2.5" data-volume="0.27" data-track-index="18"></audio>
      <audio id="sfx-pop-title" class="clip" src="assets/sfx/pop.mp3" data-start="16.65" data-duration="0.72" data-volume="0.6" data-track-index="19"></audio>
      <audio id="sfx-sparkle-chips" class="clip" src="assets/sfx/sparkle.mp3" data-start="17.48" data-duration="1.8" data-volume="0.3" data-track-index="20"></audio>
      <audio id="sfx-pop-cta" class="clip" src="assets/sfx/pop.mp3" data-start="17.96" data-duration="0.72" data-volume="0.6" data-track-index="21"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // S1 hook: a slow push while the hands squash it.
      tl.fromTo("#cam-s1", { scale: 1.12 }, { scale: 1.02, duration: 2.6, ease: "power1.out" }, 0);
      // S2 release: lands slightly large, settles (continuous action, hard cut).
      tl.fromTo("#cam-s2", { scale: 1.1 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 2.6);
      // S2 -> S3 whip left.
      tl.to("#cam-s2", { x: -1080, duration: 0.22, ease: "power3.in" }, 4.18);
      tl.fromTo("#cam-s3", { x: 1080 }, { x: 0, duration: 0.3, ease: "power3.out" }, 4.4);
      // S3 -> S4 punch-in on the hand pressing the edge.
      tl.fromTo("#cam-s4", { scale: 1.16 }, { scale: 1.02, duration: 0.55, ease: "expo.out" }, 6.4);
      // S4 -> S5 vertical whip.
      tl.to("#cam-s4", { y: -1920, duration: 0.2, ease: "power3.in" }, 8.0);
      tl.fromTo("#cam-s5", { y: 1920 }, { y: 0, duration: 0.3, ease: "power3.out" }, 8.2);
      // S6 the lift: small push with the hand.
      tl.fromTo("#cam-s6", { scale: 1 }, { scale: 1.08, duration: 1.4, ease: "power1.inOut" }, 10.6);
      // S6 -> S7 whip left onto the chair.
      tl.to("#cam-s6", { x: -1080, duration: 0.2, ease: "power3.in" }, 11.8);
      tl.fromTo("#cam-s7", { x: 1080 }, { x: 0, duration: 0.3, ease: "power3.out" }, 12.0);
      // S8 settles on the chair.
      tl.fromTo("#cam-s8", { scale: 1.1 }, { scale: 1, duration: 0.9, ease: "expo.out" }, 14.0);
      // S8 -> S9 iris from the centre of the cushion.
      tl.fromTo(
        "#cam-s9",
        { clipPath: "circle(0% at 50% 62%)" },
        { clipPath: "circle(130% at 50% 62%)", duration: 0.55, ease: "power2.inOut" },
        15.9,
      );
      tl.fromTo("#cam-s9", { scale: 1.06 }, { scale: 1, duration: 1.4, ease: "power2.out" }, 15.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
