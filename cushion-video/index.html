<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"cream","type":"color","label":"Sticker cream","default":"#FFF6E9"},
    {"id":"ink","type":"color","label":"Ink navy","default":"#1D2A6B"},
    {"id":"butter","type":"color","label":"Butter yellow","default":"#FFD45E"},
    {"id":"bubblegum","type":"color","label":"Bubblegum pink","default":"#FF8FB8"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* "Blueberry Cloud": cream sticker labels, navy ink, butter + bubblegum doodles. */
      :root {
        --cream: #fff6e9;
        --ink: #1d2a6b;
        --butter: #ffd45e;
        --bubblegum: #ff8fb8;
        --font-display: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .cam video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #cam-s10 {
        z-index: 11;
      }
      .ovl {
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.6"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <!-- Footage: each shot is a trimmed, muted clip inside an untimed camera wrapper.
           ref_* shots are crops of the earlier edit (fetch-footage.sh notes how they were made). -->
      <div class="cam" id="cam-s1" style="z-index: 1">
        <video id="s1" class="clip" src="assets/footage/clip1.mp4" muted playsinline
          data-start="0.0" data-duration="2.4" data-media-start="0.2" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s2" style="z-index: 2">
        <video id="s2" class="clip" src="assets/footage/clip1.mp4" muted playsinline
          data-start="2.4" data-duration="1.6" data-media-start="11.6" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s3" style="z-index: 3">
        <video id="s3" class="clip" src="assets/footage/ref_grab.mp4" muted playsinline
          data-start="4.0" data-duration="1.7" data-media-start="0.0" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s4" style="z-index: 4">
        <video id="s4" class="clip" src="assets/footage/ref_sew.mp4" muted playsinline
          data-start="5.7" data-duration="1.7" data-media-start="0.0" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s5" style="z-index: 5">
        <video id="s5" class="clip" src="assets/footage/clip3.mp4" muted playsinline
          data-start="7.4" data-duration="1.2" data-media-start="12.6" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s6" style="z-index: 6">
        <video id="s6" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="8.6" data-duration="2.2" data-media-start="9.3" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s7" style="z-index: 7">
        <video id="s7" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="10.8" data-duration="2.6" data-media-start="4.0" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s8" style="z-index: 8">
        <video id="s8" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="13.4" data-duration="1.55" data-media-start="7.7" data-track-index="1"></video>
      </div>
      <div class="cam" id="cam-s9" style="z-index: 9">
        <video id="s9" class="clip" src="assets/footage/ref_press.mp4" muted playsinline
          data-start="14.95" data-duration="1.15" data-media-start="0.0" data-track-index="0"></video>
      </div>
      <div class="cam" id="cam-s10">
        <video id="s10" class="clip" src="assets/footage/clip2.mp4" muted playsinline
          data-start="15.75" data-duration="4.85" data-media-start="14.0" data-playback-rate="0.75" data-track-index="1"></video>
      </div>

      <!-- Graphics: one overlay scene per chapter. -->
      <div id="hook" class="ovl" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="fits" class="ovl" data-composition-id="fits" data-composition-src="compositions/fits.html"
        data-start="2.4" data-duration="5.0" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="secret" class="ovl" data-composition-id="secret" data-composition-src="compositions/secret.html"
        data-start="7.4" data-duration="3.4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="squish" class="ovl" data-composition-id="squish" data-composition-src="compositions/squish.html"
        data-start="10.8" data-duration="5.3" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="outro" class="ovl" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="16.1" data-duration="4.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- No music: the footage's own (cleaned) sound under each shot, so hands on fabric are heard. -->
      <audio id="foley-s1" class="clip" src="assets/foley/clip1.m4a" data-start="0.0" data-duration="2.4" data-media-start="0.2" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s2" class="clip" src="assets/foley/clip1.m4a" data-start="2.4" data-duration="1.6" data-media-start="11.6" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s5" class="clip" src="assets/foley/clip3.m4a" data-start="7.4" data-duration="1.2" data-media-start="12.6" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s6" class="clip" src="assets/foley/clip2.m4a" data-start="8.6" data-duration="2.2" data-media-start="9.3" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s7" class="clip" src="assets/foley/clip2.m4a" data-start="10.8" data-duration="2.6" data-media-start="4.0" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>
      <audio id="foley-s8" class="clip" src="assets/foley/clip2.m4a" data-start="13.4" data-duration="1.55" data-media-start="7.7" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="4"></audio>
      <audio id="foley-s10" class="clip" src="assets/foley/clip2.m4a" data-start="15.75" data-duration="4.85" data-media-start="14.0" data-playback-rate="0.75" data-volume="1" data-fade-in="0.04" data-fade-out="0.06" data-track-index="3"></audio>

      <!-- Sound effects: each one has a cause on screen. -->
      <audio id="sfx-hook-pop" class="clip" src="assets/sfx/pop.mp3" data-start="0.04" data-duration="0.72" data-volume="0.6" data-track-index="6"></audio>
      <audio id="sfx-hook-sub" class="clip" src="assets/sfx/click-soft.mp3" data-start="0.78" data-duration="0.37" data-volume="0.8" data-track-index="7"></audio>
      <audio id="sfx-whip-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.22" data-duration="0.57" data-volume="0.55" data-track-index="8"></audio>
      <audio id="sfx-fit-1" class="clip" src="assets/sfx/pop.mp3" data-start="2.42" data-duration="0.72" data-volume="0.6" data-track-index="9"></audio>
      <audio id="sfx-fit-2" class="clip" src="assets/sfx/click-soft.mp3" data-start="3.95" data-duration="0.37" data-volume="0.8" data-track-index="10"></audio>
      <audio id="sfx-fit-3" class="clip" src="assets/sfx/pop.mp3" data-start="5.62" data-duration="0.72" data-volume="0.6" data-track-index="11"></audio>
      <audio id="sfx-push-hole" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.24" data-duration="0.57" data-volume="0.55" data-track-index="12"></audio>
      <audio id="sfx-secret-pop" class="clip" src="assets/sfx/pop.mp3" data-start="7.42" data-duration="0.72" data-volume="0.6" data-track-index="13"></audio>
      <audio id="sfx-whip-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.42" data-duration="0.57" data-volume="0.55" data-track-index="14"></audio>
      <audio id="sfx-hole-label" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.7" data-duration="0.37" data-volume="0.8" data-track-index="15"></audio>
      <audio id="sfx-hole-pill" class="clip" src="assets/sfx/pop.mp3" data-start="9.07" data-duration="0.72" data-volume="0.6" data-track-index="16"></audio>
      <audio id="sfx-whip-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.62" data-duration="0.57" data-volume="0.55" data-track-index="18"></audio>
      <audio id="sfx-round-pop" class="clip" src="assets/sfx/pop.mp3" data-start="13.32" data-duration="0.72" data-volume="0.6" data-track-index="19"></audio>
      <audio id="sfx-press-tap" class="clip" src="assets/sfx/click-soft.mp3" data-start="14.97" data-duration="0.37" data-volume="0.8" data-track-index="21"></audio>
      <audio id="sfx-iris" class="clip" src="assets/sfx/whoosh.mp3" data-start="15.86" data-duration="0.57" data-volume="0.45" data-track-index="22"></audio>
      <audio id="sfx-title-pop" class="clip" src="assets/sfx/pop.mp3" data-start="16.85" data-duration="0.72" data-volume="0.6" data-track-index="23"></audio>
      <audio id="sfx-cta-pop" class="clip" src="assets/sfx/pop.mp3" data-start="18.28" data-duration="0.72" data-volume="0.6" data-track-index="25"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // S1 hook: slow push on the chair.
      tl.fromTo("#cam-s1", { scale: 1.1 }, { scale: 1.0, duration: 2.4, ease: "power1.out" }, 0);
      // S1 -> S2 whip left.
      tl.to("#cam-s1", { x: -1080, duration: 0.2, ease: "power3.in" }, 2.2);
      tl.fromTo("#cam-s2", { x: 1080 }, { x: 0, duration: 0.3, ease: "power3.out" }, 2.4);
      // Job montage: each new shot lands slightly large and settles, with the card flip.
      tl.fromTo("#cam-s3", { scale: 1.12 }, { scale: 1, duration: 0.45, ease: "expo.out" }, 4.0);
      tl.fromTo("#cam-s4", { scale: 1.12 }, { scale: 1, duration: 0.45, ease: "expo.out" }, 5.7);
      // S4 -> S5 push into the hole.
      tl.to("#cam-s4", { scale: 1.45, duration: 0.25, ease: "power3.in" }, 7.15);
      tl.fromTo("#cam-s5", { scale: 1.25 }, { scale: 1, duration: 0.6, ease: "expo.out" }, 7.4);
      // S5 -> S6 vertical whip.
      tl.to("#cam-s5", { y: -1920, duration: 0.2, ease: "power3.in" }, 8.4);
      tl.fromTo("#cam-s6", { y: 1920 }, { y: 0, duration: 0.3, ease: "power3.out" }, 8.6);
      // S6 -> S7 whip left into the squeeze.
      tl.to("#cam-s6", { x: -1080, duration: 0.2, ease: "power3.in" }, 10.6);
      tl.fromTo("#cam-s7", { x: 1080 }, { x: 0, duration: 0.3, ease: "power3.out" }, 10.8);
      tl.fromTo("#cam-s7", { scale: 1.1 }, { scale: 1.02, duration: 2.6, ease: "power1.out" }, 10.8);
      // S8 release: lands slightly large, settles (continuous action, hard cut).
      tl.fromTo("#cam-s8", { scale: 1.1 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 13.4);
      // S9 the press on the sofa.
      tl.fromTo("#cam-s9", { scale: 1.12 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 14.95);
      // S9 -> S10 iris from the centre of the cushion.
      tl.fromTo(
        "#cam-s10",
        { clipPath: "circle(0% at 50% 62%)" },
        { clipPath: "circle(130% at 50% 62%)", duration: 0.55, ease: "power2.inOut" },
        15.75,
      );
      tl.fromTo("#cam-s10", { scale: 1.06 }, { scale: 1, duration: 1.4, ease: "power2.out" }, 15.75);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
