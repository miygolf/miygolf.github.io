<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* "Yardage book" look: fairway green, paper cream, alignment-stick yellow, flag red. */
      :root {
        --green: #0e3b2e;
        --cream: #f4ede0;
        --yellow: #ffc21a;
        --red: #e5392b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b2e23;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #end-paper {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-color: var(--cream);
        background-image: url("assets/contours.svg");
        background-size: 1080px 1920px;
      }
      #end-shadow {
        position: absolute;
        left: 332px;
        top: 252px;
        width: 448px;
        height: 560px;
        border-radius: 44px;
        background: var(--green);
        z-index: 0;
      }
      #cam-move {
        position: absolute;
        inset: 0;
        z-index: 1;
        transform-origin: 540px 600px;
      }
      #cam-crop {
        position: absolute;
        inset: 0;
        clip-path: inset(0px 0px 0px 0px round 0px);
      }
      #aroll {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .layer {
        z-index: 5;
      }
      #captions {
        z-index: 8;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="42"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- paper backdrop revealed only when the footage shrinks into the end card -->
      <div id="end-paper" class="clip" data-start="38.2" data-duration="3.8" data-track-index="0"></div>

      <div id="end-shadow" class="clip" data-start="39.2" data-duration="2.8" data-track-index="0"></div>

      <!-- A-roll: pre-cut footage (pauses and repeats removed). Punch-ins live on #cam-move. -->
      <div id="cam-move">
        <div id="cam-crop">
          <video
            id="aroll"
            class="clip"
            src="assets/aroll.mp4"
            data-start="0"
            data-duration="42"
            data-track-index="1"
            muted
            playsinline
          ></video>
        </div>
      </div>

      <!-- graphics scenes: sky band (wide shots) / right column (close-ups); never over the face -->
      <div id="hook" class="layer" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.3" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="why" class="layer" data-composition-id="why" data-composition-src="compositions/why.html"
        data-start="3" data-duration="9.25" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="fix" class="layer" data-composition-id="fix" data-composition-src="compositions/fix.html"
        data-start="12.2" data-duration="11.05" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="tip" class="layer" data-composition-id="tip" data-composition-src="compositions/tip.html"
        data-start="23.15" data-duration="9.8" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="recap" class="layer" data-composition-id="recap" data-composition-src="compositions/recap.html"
        data-start="32.9" data-duration="5.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="endcard" class="layer" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="38.2" data-duration="3.8" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="38.7" data-track-index="4" data-track-kind="captions"
        data-width="1080" data-height="1920"></div>

      <!-- voice: RNNoise-cleaned, EQ'd and compressed dialogue (separate track so the bed can duck under it) -->
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="42"
        data-track-index="10" data-volume="1" data-audio-group="voiceover"></audio>

      <!-- music bed: "Sax Beat" by Infraction (CC BY), entered at a strong bar; ~-30 LUFS under the -16.5 LUFS voice (14 LU gap) -->
      <audio id="bgm" class="clip" src="assets/music/sax-beat-infraction.mp3" data-start="0" data-duration="42"
        data-media-start="8.585" data-track-index="11" data-volume="1" data-timeline-role="music" data-audio-group="music"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;highpass&quot;,&quot;id&quot;:&quot;hp&quot;,&quot;label&quot;:&quot;Clear the low mud&quot;,&quot;params&quot;:{&quot;frequency&quot;:70}},{&quot;type&quot;:&quot;peaking&quot;,&quot;id&quot;:&quot;carve&quot;,&quot;label&quot;:&quot;Pocket for the voice&quot;,&quot;params&quot;:{&quot;frequency&quot;:2500,&quot;gain&quot;:-5,&quot;q&quot;:0.8}}]}"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.09},{&quot;t&quot;:17.4,&quot;v&quot;:0.09},{&quot;t&quot;:17.6,&quot;v&quot;:0.2},{&quot;t&quot;:19.15,&quot;v&quot;:0.2},{&quot;t&quot;:19.35,&quot;v&quot;:0.09},{&quot;t&quot;:38.3,&quot;v&quot;:0.09},{&quot;t&quot;:38.8,&quot;v&quot;:0.32},{&quot;t&quot;:40.6,&quot;v&quot;:0.32},{&quot;t&quot;:41.95,&quot;v&quot;:0}]}]}"></audio>

      <!-- sound design: each hit has a cause on screen; start = picture time - file peak -->
      <audio id="sfx-open" class="clip" src="assets/sfx/whoosh-low.mp3" data-start="0" data-duration="0.72" data-track-index="12" data-volume="0.4" data-audio-group="sfx"></audio>
      <audio id="sfx-wrist-slash" class="clip" src="assets/sfx/whoosh-high.mp3" data-start="2.48" data-duration="0.54" data-track-index="13" data-volume="0.4" data-audio-group="sfx"></audio>
      <audio id="sfx-wrist-stamp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.63" data-duration="2.11" data-track-index="12" data-volume="0.28" data-audio-group="sfx"></audio>
      <audio id="sfx-malas" class="clip" src="assets/sfx/pop.mp3" data-start="3.38" data-duration="0.71" data-track-index="13" data-volume="0.5" data-audio-group="sfx"></audio>
      <audio id="sfx-meter-1" class="clip" src="assets/sfx/click-soft.mp3" data-start="5.05" data-duration="0.36" data-track-index="12" data-volume="0.8" data-audio-group="sfx"></audio>
      <audio id="sfx-meter-2" class="clip" src="assets/sfx/pop.mp3" data-start="6.62" data-duration="0.71" data-track-index="13" data-volume="0.45" data-audio-group="sfx"></audio>
      <audio id="sfx-alert-in" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.95" data-duration="0.56" data-track-index="12" data-volume="0.4" data-audio-group="sfx"></audio>
      <audio id="sfx-alert-wrist" class="clip" src="assets/sfx/error.mp3" data-start="10.56" data-duration="1.61" data-track-index="13" data-volume="1" data-audio-group="sfx"></audio>
      <audio id="sfx-fix-banner" class="clip" src="assets/sfx/whoosh-low.mp3" data-start="12.12" data-duration="0.72" data-track-index="12" data-volume="0.45" data-audio-group="sfx"></audio>
      <audio id="sfx-sticks" class="clip" src="assets/sfx/sparkle.mp3" data-start="13.1" data-duration="1.82" data-track-index="13" data-volume="0.3" data-audio-group="sfx"></audio>
      <audio id="sfx-back" class="clip" src="assets/sfx/whoosh-high.mp3" data-start="17.2" data-duration="0.54" data-track-index="12" data-volume="0.4" data-audio-group="sfx"></audio>
      <audio id="sfx-through" class="clip" src="assets/sfx/whoosh.mp3" data-start="19.56" data-duration="0.56" data-track-index="13" data-volume="0.4" data-audio-group="sfx"></audio>
      <audio id="sfx-gauge" class="clip" src="assets/sfx/ping.mp3" data-start="22.3" data-duration="1.31" data-track-index="12" data-volume="0.6" data-audio-group="sfx"></audio>
      <audio id="sfx-tip" class="clip" src="assets/sfx/pop.mp3" data-start="23.2" data-duration="0.71" data-track-index="13" data-volume="0.5" data-audio-group="sfx"></audio>
      <audio id="sfx-palm" class="clip" src="assets/sfx/click-soft.mp3" data-start="25.5" data-duration="0.36" data-track-index="12" data-volume="0.8" data-audio-group="sfx"></audio>
      <audio id="sfx-target" class="clip" src="assets/sfx/whoosh-high.mp3" data-start="27.95" data-duration="0.54" data-track-index="13" data-volume="0.35" data-audio-group="sfx"></audio>
      <audio id="sfx-salah" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="30.06" data-duration="2.11" data-track-index="12" data-volume="0.28" data-audio-group="sfx"></audio>
      <audio id="sfx-kipas" class="clip" src="assets/sfx/pop.mp3" data-start="30.98" data-duration="0.71" data-track-index="13" data-volume="0.5" data-audio-group="sfx"></audio>
      <audio id="sfx-lock" class="clip" src="assets/sfx/click-soft.mp3" data-start="33.38" data-duration="0.36" data-track-index="12" data-volume="0.8" data-audio-group="sfx"></audio>
      <audio id="sfx-move" class="clip" src="assets/sfx/pop.mp3" data-start="35.78" data-duration="0.71" data-track-index="14" data-volume="0.45" data-audio-group="sfx"></audio>
      <audio id="sfx-bahu" class="clip" src="assets/sfx/sparkle.mp3" data-start="36.98" data-duration="1.82" data-track-index="12" data-volume="0.25" data-audio-group="sfx"></audio>
      <audio id="sfx-endcard" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="36.1" data-duration="5.53" data-track-index="13" data-volume="0.3" data-audio-group="sfx"></audio>
      <audio id="sfx-end-pop" class="clip" src="assets/sfx/pop.mp3" data-start="39.3" data-duration="0.71" data-track-index="12" data-volume="0.45" data-audio-group="sfx"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = "#cam-move";
      // punch-ins hide the jump cuts left by removed pauses (cut times from the edit list)
      const punches = [
        [0, 1], [1.8334, 1.12], [3.0667, 1], [6.5667, 1.1], [9.1334, 1],
        [12.2667, 1], [13.0667, 1.1], [13.4, 1], [23.2, 1], [25.5668, 1.1],
        [26.2334, 1], [30.0, 1], [32.9335, 1], [35.0335, 1.1], [37.4, 1],
      ];
      punches.forEach(([t, s]) => tl.set(cam, { scale: s, x: 0, y: 0 }, t));
      // demo: push in on the wrist flick, then hold through the cut
      tl.to(cam, { scale: 1.2, duration: 0.5, ease: "power3.out" }, 9.2);
      // "Nampak": push in to show how little the wrists move
      tl.to(cam, { scale: 1.12, duration: 0.35, ease: "power3.out" }, 20.25);
      // end card: the footage shrinks into a framed card, face kept in view, cropped above the hand in frame
      tl.fromTo("#cam-crop", { clipPath: "inset(0px 0px 0px 0px round 0px)" },
        { clipPath: "inset(40px 140px 880px 140px round 44px)", duration: 0.7, ease: "power3.inOut" }, 38.55);
      tl.to(cam, { scale: 0.56, y: -50, duration: 0.7, ease: "power3.inOut" }, 38.55);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
