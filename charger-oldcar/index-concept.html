<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #0b0906; --amber: #ffb547; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.1" data-width="1080" data-height="1920">
      <!-- FOOTAGE: IMG_0283 / IMG_0285 / IMG_0286, no voice. Head unit and phone notifications kept out of frame by cropping (no blur) -->
      <video id="v-hook" class="clip shot" src="assets/video/product.mp4" data-start="0" data-duration="2.6" data-media-start="0" muted data-track-index="0"></video>
      <video id="v-socket" class="clip shot" src="assets/video/socket.mp4" data-start="2.6" data-duration="2.4" data-media-start="0.6" muted data-track-index="0"></video>
      <video id="v-plug" class="clip shot" src="assets/video/plug.mp4" data-start="5" data-duration="1.5" data-media-start="0.6" muted data-track-index="0"></video>
      <video id="v-volt" class="clip shot" src="assets/video/dev.mp4" data-start="6.5" data-duration="4.2" data-media-start="4" muted data-track-index="0"></video>
      <video id="v-cables" class="clip shot" src="assets/video/dev.mp4" data-start="10.7" data-duration="3.4" data-media-start="13.2" muted data-track-index="0"></video>
      <video id="v-phone" class="clip shot" src="assets/video/phone.mp4" data-start="14.1" data-duration="2.8" data-media-start="0" muted data-track-index="0"></video>
      <video id="v-tidy1" class="clip shot" src="assets/video/tidy.mp4" data-start="16.9" data-duration="1.4" data-media-start="2.1" muted data-track-index="0"></video>
      <video id="v-tidy2" class="clip shot" src="assets/video/tidy.mp4" data-start="18.3" data-duration="3" data-media-start="6.1" muted data-track-index="0"></video>
      <video id="v-cta" class="clip shot" src="assets/video/cta.mp4" data-start="21.3" data-duration="2.8" data-media-start="0.1" muted data-track-index="0"></video>

      <!-- OVERLAYS (concept version): corner label, TikTok-style title card, karaoke captions -->
      <div id="c-title" class="clip" data-composition-id="c-title" data-composition-src="compositions/c-title.html" data-start="0" data-duration="24.1" data-track-index="2" data-track-kind="graphics"></div>
      <div id="c-captions" class="clip" data-composition-id="c-captions" data-composition-src="compositions/c-captions.html" data-start="0" data-duration="24.1" data-track-index="1" data-track-kind="captions"></div>
      <!-- (old overlays: plain outlined text (semi-bold, no boxes); masked line reveals; amber step meter, not used here) -->

      <!-- SFX -->
      <audio id="sfx-sub" class="clip" src="assets/sfx/pop.mp3" data-start="2.82" data-duration="0.5" data-volume="0.35" data-track-index="7"></audio>
      <audio id="sfx-cut0" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.57" data-duration="0.57" data-volume="0.3" data-track-index="8"></audio>
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.97" data-duration="0.57" data-volume="0.3" data-track-index="8"></audio>
      <audio id="sfx-cut2" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.46" data-duration="0.63" data-volume="0.3" data-playback-rate="0.9" data-track-index="8"></audio>
      <audio id="sfx-cut3" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.67" data-duration="0.51" data-volume="0.3" data-playback-rate="1.12" data-track-index="8"></audio>
      <audio id="sfx-cut4" class="clip" src="assets/sfx/whoosh.mp3" data-start="14.06" data-duration="0.67" data-volume="0.3" data-playback-rate="0.85" data-track-index="8"></audio>
      <audio id="sfx-cut5" class="clip" src="assets/sfx/whoosh.mp3" data-start="16.88" data-duration="0.47" data-volume="0.3" data-playback-rate="1.2" data-track-index="8"></audio>
      <audio id="sfx-cut6" class="clip" src="assets/sfx/whoosh.mp3" data-start="21.27" data-duration="0.57" data-volume="0.3" data-track-index="8"></audio>
      <audio id="sfx-lit" class="clip" src="assets/sfx/ping.mp3" data-start="5.55" data-duration="1" data-volume="0.3" data-track-index="6"></audio>

      <audio id="sfx-retract" class="clip" src="assets/sfx/whoosh.mp3" data-start="19.9" data-duration="0.48" data-playback-rate="1.2" data-volume="0.35" data-track-index="9"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="21.29" data-duration="2" data-volume="0.16" data-fade-out="0.9" data-track-index="5"></audio>
      <audio id="sfx-pop" class="clip" src="assets/sfx/pop.mp3" data-start="21.56" data-duration="0.5" data-volume="0.4" data-track-index="9"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
