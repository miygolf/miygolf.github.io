<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.6" data-width="1080" data-height="1920">
      <!-- BEFORE / AFTER version after the reference: empty 12V socket -> installed charger, then the features -->
      <video id="bv-before" class="clip shot" src="assets/video/socket.mp4" data-start="0" data-duration="1.5" data-media-start="0.6" muted data-track-index="0"></video>
      <video id="bv-after" class="clip shot" src="assets/video/cta.mp4" data-start="1.5" data-duration="1.5" data-media-start="0.1" muted data-track-index="0"></video>
      <video id="bv-title" class="clip shot" src="assets/video/product.mp4" data-start="3" data-duration="2.2" data-media-start="0" muted data-track-index="0"></video>
      <video id="bv-pull1" class="clip shot" src="assets/video/tidy.mp4" data-start="9.8" data-duration="1.2" data-media-start="2.1" muted data-track-index="0"></video>
      <video id="bv-pull2" class="clip shot" src="assets/video/tidy.mp4" data-start="11" data-duration="2" data-media-start="6.9" muted data-track-index="0"></video>
      <video id="bv-fast" class="clip shot" src="assets/video/phone.mp4" data-start="13" data-duration="2.2" data-media-start="0.6" muted data-track-index="0"></video>
      <video id="bv-volt" class="clip shot" src="assets/video/dev.mp4" data-start="15.2" data-duration="2.4" data-media-start="4" muted data-track-index="0"></video>
      <video id="bv-end" class="clip shot" src="assets/video/cta.mp4" data-start="17.6" data-duration="3" data-media-start="0.1" data-playback-rate="0.9" muted data-track-index="0"></video>

      <!-- OVERLAYS: big centred bold-italic words with drop shadow, as in the reference; no boxes -->
      <div id="b-before" class="clip" data-composition-id="b-before" data-composition-src="compositions/b-before.html" data-start="0" data-duration="1.5" data-track-index="2" data-track-kind="graphics"></div>
      <div id="b-after" class="clip" data-composition-id="b-after" data-composition-src="compositions/b-after.html" data-start="1.5" data-duration="1.5" data-track-index="2" data-track-kind="graphics"></div>
      <div id="b-title" class="clip" data-composition-id="b-title" data-composition-src="compositions/b-title.html" data-start="3" data-duration="2.2" data-track-index="2" data-track-kind="graphics"></div>
      <div id="b-cables" class="clip" data-composition-id="b-cables" data-composition-src="compositions/b-cables.html" data-start="5.2" data-duration="2.2" data-track-index="2" data-track-kind="graphics"></div>
      <div id="b-slots" class="clip" data-composition-id="b-slots" data-composition-src="compositions/b-slots.html" data-start="7.4" data-duration="2.4" data-track-index="2" data-track-kind="graphics"></div>
      <div id="b-pull" class="clip" data-composition-id="b-pull" data-composition-src="compositions/b-pull.html" data-start="9.8" data-duration="3.2" data-track-index="2" data-track-kind="graphics"></div>
      <div id="b-fast" class="clip" data-composition-id="b-fast" data-composition-src="compositions/b-fast.html" data-start="13" data-duration="2.2" data-track-index="2" data-track-kind="graphics"></div>
      <div id="b-volt" class="clip" data-composition-id="b-volt" data-composition-src="compositions/b-volt.html" data-start="15.2" data-duration="2.4" data-track-index="2" data-track-kind="graphics"></div>
      <div id="b-end" class="clip" data-composition-id="b-end" data-composition-src="compositions/b-end.html" data-start="17.6" data-duration="3" data-track-index="2" data-track-kind="graphics"></div>
      <div id="b-flash" class="clip" data-composition-id="b-flash" data-composition-src="compositions/b-flash.html" data-start="0" data-duration="20.6" data-track-index="3" data-track-kind="graphics"></div>

      <!-- SFX -->
      <audio id="bsfx-before" class="clip" src="assets/sfx/pop.mp3" data-start="0" data-duration="0.5" data-volume="0.35" data-track-index="7"></audio>
      <audio id="bsfx-cut1" class="clip" src="assets/sfx/whoosh.mp3" data-start="1.47" data-duration="0.57" data-volume="0.3" data-track-index="6"></audio>
      <audio id="bsfx-cut2" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.96" data-duration="0.63" data-volume="0.3" data-playback-rate="0.9" data-track-index="6"></audio>
      <audio id="bsfx-cut3" class="clip" src="assets/sfx/whoosh.mp3" data-start="5.17" data-duration="0.51" data-volume="0.3" data-playback-rate="1.12" data-track-index="6"></audio>
      <audio id="bsfx-cut4" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.36" data-duration="0.67" data-volume="0.3" data-playback-rate="0.85" data-track-index="6"></audio>
      <audio id="bsfx-cut5" class="clip" src="assets/sfx/whoosh.mp3" data-start="9.78" data-duration="0.47" data-volume="0.3" data-playback-rate="1.2" data-track-index="6"></audio>
      <audio id="bsfx-cut6" class="clip" src="assets/sfx/whoosh.mp3" data-start="12.97" data-duration="0.57" data-volume="0.3" data-track-index="6"></audio>
      <audio id="bsfx-cut7" class="clip" src="assets/sfx/whoosh.mp3" data-start="15.16" data-duration="0.63" data-volume="0.3" data-playback-rate="0.9" data-track-index="6"></audio>
      <audio id="bsfx-cut8" class="clip" src="assets/sfx/whoosh.mp3" data-start="17.57" data-duration="0.51" data-volume="0.3" data-playback-rate="1.12" data-track-index="6"></audio>
      <audio id="bsfx-after" class="clip" src="assets/sfx/sparkle.mp3" data-start="1.52" data-duration="1.4" data-volume="0.22" data-fade-out="0.5" data-track-index="8"></audio>
      <audio id="bsfx-title" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="3.08" data-duration="2" data-volume="0.16" data-fade-out="0.8" data-track-index="5"></audio>
      <audio id="bsfx-slots" class="clip" src="assets/sfx/pop.mp3" data-start="7.66" data-duration="0.5" data-volume="0.35" data-track-index="7"></audio>
      <audio id="bsfx-slots2" class="clip" src="assets/sfx/pop.mp3" data-start="7.78" data-duration="0.5" data-volume="0.3" data-track-index="9"></audio>
      <audio id="bsfx-release" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.6" data-duration="0.37" data-volume="0.5" data-track-index="7"></audio>
      <audio id="bsfx-end" class="clip" src="assets/sfx/chime.mp3" data-start="18.3" data-duration="2.2" data-volume="0.18" data-fade-out="0.8" data-track-index="8"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
