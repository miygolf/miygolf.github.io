<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #0b0906; --amber: #ffb547; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-width="1080" data-height="1920">
      <!-- PHOTOS + VIDEO: product photos (IMG_0297-0306) introduce the product, the clips prove it -->
      <video id="pv-socket" class="clip shot" src="assets/video/socket.mp4" data-start="10.8" data-duration="2" data-media-start="0.6" muted data-track-index="0"></video>
      <video id="pv-plug" class="clip shot" src="assets/video/plug.mp4" data-start="12.8" data-duration="1.5" data-media-start="0.6" muted data-track-index="0"></video>

      <!-- OVERLAYS: photo scenes carry their own picture; plain outlined semi-bold text, no boxes -->

      <div id="p-ports" class="clip" data-composition-id="p-ports" data-composition-src="compositions/p-ports.html" data-start="2.4" data-duration="3.6" data-track-index="2" data-track-kind="graphics"></div>
      <div id="p-cables" class="clip" data-composition-id="p-cables" data-composition-src="compositions/p-cables.html" data-start="6" data-duration="2.4" data-track-index="2" data-track-kind="graphics"></div>
