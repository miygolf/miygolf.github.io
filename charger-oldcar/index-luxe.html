<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1080" data-height="1920">
      <!-- LUXURY-AD VERSION: same footage, slowed on the light-up and the retract; add a classical track in the app -->
      <video id="lv-hero" class="clip shot" src="assets/video/product.mp4" data-start="0" data-duration="3" data-media-start="0" data-playback-rate="0.75" muted data-track-index="0"></video>
      <video id="lv-socket" class="clip shot" src="assets/video/socket.mp4" data-start="3" data-duration="2.6" data-media-start="0.6" data-playback-rate="0.85" muted data-track-index="0"></video>
      <video id="lv-plug" class="clip shot" src="assets/video/plug.mp4" data-start="5.6" data-duration="2.4" data-media-start="0.6" data-playback-rate="0.6" muted data-track-index="0"></video>
      <video id="lv-volt" class="clip shot" src="assets/video/dev.mp4" data-start="8" data-duration="3.6" data-media-start="4" muted data-track-index="0"></video>
      <video id="lv-ports" class="clip shot" src="assets/video/dev.mp4" data-start="11.6" data-duration="3" data-media-start="13.2" muted data-track-index="0"></video>
      <video id="lv-phone" class="clip shot" src="assets/video/phone.mp4" data-start="14.6" data-duration="2.8" data-media-start="0" muted data-track-index="0"></video>
      <video id="lv-retract" class="clip shot" src="assets/video/tidy.mp4" data-start="17.4" data-duration="3.2" data-media-start="6.9" data-playback-rate="0.7" muted data-track-index="0"></video>
      <video id="lv-end" class="clip shot" src="assets/video/cta.mp4" data-start="20.6" data-duration="3.4" data-media-start="0.1" data-playback-rate="0.85" muted data-track-index="0"></video>

      <!-- OVERLAYS: serif, regular weight, centred, no boxes; letterbox + fade-through-black between shots -->
      <div id="l-hero" class="clip" data-composition-id="l-hero" data-composition-src="compositions/l-hero.html" data-start="0" data-duration="3" data-track-index="2" data-track-kind="graphics"></div>
      <div id="l-socket" class="clip" data-composition-id="l-socket" data-composition-src="compositions/l-socket.html" data-start="3" data-duration="2.6" data-track-index="2" data-track-kind="graphics"></div>
      <div id="l-plug" class="clip" data-composition-id="l-plug" data-composition-src="compositions/l-plug.html" data-start="5.6" data-duration="2.4" data-track-index="2" data-track-kind="graphics"></div>
      <div id="l-volt" class="clip" data-composition-id="l-volt" data-composition-src="compositions/l-volt.html" data-start="8" data-duration="3.6" data-track-index="2" data-track-kind="graphics"></div>
      <div id="l-ports" class="clip" data-composition-id="l-ports" data-composition-src="compositions/l-ports.html" data-start="11.6" data-duration="3" data-track-index="2" data-track-kind="graphics"></div>
      <div id="l-phone" class="clip" data-composition-id="l-phone" data-composition-src="compositions/l-phone.html" data-start="14.6" data-duration="2.8" data-track-index="2" data-track-kind="graphics"></div>
      <div id="l-retract" class="clip" data-composition-id="l-retract" data-composition-src="compositions/l-retract.html" data-start="17.4" data-duration="3.2" data-track-index="2" data-track-kind="graphics"></div>
      <div id="l-end" class="clip" data-composition-id="l-end" data-composition-src="compositions/l-end.html" data-start="20.6" data-duration="3.4" data-track-index="2" data-track-kind="graphics"></div>
      <div id="l-frame" class="clip" data-composition-id="l-frame" data-composition-src="compositions/l-frame.html" data-start="0" data-duration="24" data-track-index="3" data-track-kind="graphics"></div>

      <!-- SFX: sparse and soft so a classical track can sit on top -->
      <audio id="lsfx-lit" class="clip" src="assets/sfx/sparkle.mp3" data-start="6.91" data-duration="1.8" data-volume="0.22" data-fade-out="0.6" data-track-index="5"></audio>
      <audio id="lsfx-retract" class="clip" src="assets/sfx/click-soft.mp3" data-start="18.39" data-duration="0.37" data-volume="0.4" data-track-index="6"></audio>
      <audio id="lsfx-end" class="clip" src="assets/sfx/chime.mp3" data-start="20.9" data-duration="2.5" data-volume="0.16" data-fade-out="0.8" data-track-index="7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
