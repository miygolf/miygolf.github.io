<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* "Label Maker": the owner's bunker script as embossed label-maker tape. Each tip prints out of the machine letter by letter
         (stepped reveal), sticks on the frame with a small tilt and a hard shadow, and peels off when the section ends.
         Tapes: black (the steps), yellow (the key cue), red (the mistake / the penalty), white (the detail). Spoken words as a plain caption pill.
         Type: Oswald 600 (tape, uppercase, wide tracking) + Gabarito 700 (captions) + Noto Color Emoji.
         Palette: tape black #1c1c1e, tape yellow #f6c514, tape red #d3262e, tape white #f1efe8, emboss white #f7f7f2, emboss ink #17171a.
         Safe band x 60-930, y 168-1330. Faces (contact sheets): full-body shots head y 280-460; the close talk (rahsia) face y 0-600;
         IMG_0418 talking head y 420-800 -> tapes from y 860 (760 on full-body shots), captions at y 1218. */
      @font-face { font-family: "Oswald"; font-weight: 200 700; src: url("assets/fonts/Oswald-VF.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Gabarito"; font-weight: 400 900; src: url("assets/fonts/Gabarito-VF.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Noto Color Emoji"; font-weight: 400; src: url("assets/fonts/NotoColorEmoji.ttf") format("truetype"); font-display: block; }
      :root { --black: #1c1c1e; --yellow: #f6c514; --red: #d3262e; --white: #f1efe8; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #aroll { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; }
      .ov { position: absolute; opacity: 0; z-index: 6; pointer-events: none; }
      .emo { font-family: "Noto Color Emoji", sans-serif; font-weight: 400; letter-spacing: 0; }

      .tape { left: 60px; height: 96px; padding: 0 30px 2px; display: flex; align-items: center; white-space: nowrap; border-radius: 5px;
              font-family: "Oswald"; font-weight: 600; font-size: 58px; letter-spacing: 0.09em; text-transform: uppercase;
              color: #f7f7f2; text-shadow: 0 2px 0 rgba(0,0,0,0.55), 0 -1px 0 rgba(255,255,255,0.28);
              box-shadow: 0 12px 24px rgba(0,0,0,0.38); transform-origin: 0 50%; }
      .tape::before { content: ""; position: absolute; inset: 0; border-radius: 5px; pointer-events: none;
                      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 38%, rgba(0,0,0,0.18)); }
      .tape.k { background: var(--black); }
      .tape.y { background: var(--yellow); color: #17171a; text-shadow: 0 1px 0 rgba(255,255,255,0.55), 0 -1px 0 rgba(0,0,0,0.25); }
      .tape.r { background: var(--red); }
      .tape.w { background: var(--white); color: #17171a; text-shadow: 0 1px 0 rgba(255,255,255,0.8), 0 -1px 0 rgba(0,0,0,0.2); }
      .tape.big { height: 120px; font-size: 76px; }
      .tape .n { margin-right: 22px; padding-right: 22px; border-right: 3px dashed currentColor; opacity: 0.85; }

      .cap { left: 60px; top: 1218px; max-width: 870px; padding: 12px 22px 15px; border-radius: 12px; background: rgba(10,10,12,0.62);
             font-family: "Gabarito"; font-weight: 700; font-size: 44px; line-height: 1.16; color: #fff; z-index: 7; }
      #aroll { transform-origin: 700px 978px; }   /* the landed ball, right of the middle pin (IMG_0413 frame) */
      #ring { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 5; opacity: 0; pointer-events: none; overflow: visible; }
      #flash { position: absolute; inset: 0; z-index: 8; background: #fff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-root" id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920" data-fps="30">
      <video data-hf-id="hf-aroll" id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="{{TOTAL}}" data-track-index="1" muted playsinline></video>
      <svg id="ring" viewBox="0 0 1080 1920"><ellipse id="ringc" cx="620" cy="1002" rx="92" ry="64" fill="none" stroke="#f6c514" stroke-width="9" stroke-linecap="round" transform="rotate(-4 620 1002)" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45))"/></svg>
      {{TAPES}}
      {{CAPS}}
      <div id="flash"></div>
{{AUDIO}}
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const K = {{CONSTS}};
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        // tapes: print out letter by letter (stepped), settle with a tilt, peel off at the end of their section
        K.TAPES.forEach((t) => {
          const el = $("#" + t.id);
          if (t.t0 < 0.2) {
            // frame 0: visible from the markup (inline style), no zero-time set
          } else {
            tl.set(el, { opacity: 0 }, 0);
            tl.fromTo(el, { opacity: 1, rotation: 0, x: -10, clipPath: "inset(0 100% 0 0)" },
                          { clipPath: "inset(0 0% 0 0)", x: 0, duration: t.print, ease: `steps(${t.steps})`, immediateRender: false }, t.t0);
            tl.to(el, { rotation: t.r, duration: 0.18, ease: "back.out(3)" }, t.t0 + t.print);
          }
          (t.pulse || []).forEach((p) => tl.fromTo(el, { scale: 1 }, { scale: 1.1, duration: 0.14, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, p));
          if (t.t1 < K.TOTAL - 0.05) tl.to(el, { rotation: t.r + 7, y: -16, opacity: 0, duration: 0.18, ease: "power2.in" }, t.t1 - 0.18);   // the ending tapes stay to the last frame
        });
        K.CAP.forEach((c) => {
          const el = $("#" + c.id);
          tl.set(el, { opacity: 0 }, 0);
          tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.12, immediateRender: false }, Math.max(c.t0, 0.001));
          tl.set(el, { opacity: 0 }, c.t1);
        });
        K.FLASH.forEach((t) => tl.fromTo("#flash", { opacity: 0.45 }, { opacity: 0, duration: 0.2, immediateRender: false }, t));
        // landing: punch in on the flag once the phone settles on the green, draw a ring round the landing area, back to 1x on the cut
        // owner v5/v6: "zoom in dekat bola land tu", "pin tengah belah kanan" -> 3x on that ball, following the tracked balls (keys from build_index.py)
        tl.set("#aroll", { scale: 1, x: 0, y: 0 }, Math.max(K.LAND - 0.05, 0));
        K.ZOOM.forEach((k, i) => { if (i + 1 < K.ZOOM.length) { const n = K.ZOOM[i + 1];
          tl.fromTo("#aroll", { scale: k[1], x: k[2], y: k[3] }, { scale: n[1], x: n[2], y: n[3], duration: n[0] - k[0], ease: "none", immediateRender: false }, k[0]); } });
        tl.set("#aroll", { scale: 1, x: 0, y: 0 }, K.LAND_END);
        const rc = document.querySelector("#ringc"), L = rc.getTotalLength();
        tl.set("#ring", { opacity: 1 }, K.LAND + 0.75);
        tl.fromTo(rc, { attr: { "stroke-dasharray": `${L} ${L}`, "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut", immediateRender: false }, K.LAND + 0.75);
        tl.set("#ring", { opacity: 0 }, K.LAND_END);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
