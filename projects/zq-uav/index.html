<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* "Sectional": aeronautical-chart look. Ink, white, airspace magenta. Michroma + IBM Plex Sans Condensed. */
      :root {
        --ink: #0b0c10;
        --paper: #f4f6f8;
        --magenta: #ff2e88;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #cam { position: absolute; inset: 0; transform-origin: 540px 900px; z-index: 1; }
      #plate { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* legibility band behind the top text block only */
      #scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 820px; z-index: 2;
        background: linear-gradient(to bottom, rgba(11,12,16,0.55) 0%, rgba(11,12,16,0.38) 45%, rgba(11,12,16,0) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.5" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="plate" class="clip" src="assets/footage/edit.mp4" data-start="0" data-duration="21.5"
          data-track-index="0" muted playsinline></video>
      </div>
      <div id="scrim" class="clip" data-start="0" data-duration="21.5" data-track-index="1" data-layout-ignore></div>

      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="tegak" class="clip" data-composition-id="tegak" data-composition-src="compositions/tegak.html"
        data-start="2" data-duration="3" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 11"></div>
      <div id="jauh" class="clip" data-composition-id="jauh" data-composition-src="compositions/jauh.html"
        data-start="5" data-duration="4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 12"></div>
      <div id="anatomi" class="clip" data-composition-id="anatomi" data-composition-src="compositions/anatomi.html"
        data-start="9" data-duration="4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 13"></div>
      <div id="kawalan" class="clip" data-composition-id="kawalan" data-composition-src="compositions/kawalan.html"
        data-start="13" data-duration="4.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 14"></div>
      <div id="outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="17.5" data-duration="4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 15"></div>

      <div id="badge" class="clip" data-composition-id="badge" data-composition-src="compositions/badge.html"
        data-start="2" data-duration="15.45" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 30"></div>

      <!-- music: MusicGen bed, trimmed so its drop lands on the logo at 17.5 s -->
      <audio id="bgm" class="clip" src="assets/bgm/bed.wav" data-start="0" data-duration="21.5" data-volume="0.6"
        data-fade-out="0.6" data-track-index="10" data-audio-group="music"></audio>

      <!-- SFX: start = hit - peak offset in file -->
      <audio id="sfx-boom" class="clip" src="assets/sfx/boom-deep.mp3" data-start="0" data-duration="2" data-volume="0.75" data-track-index="20" data-audio-group="sfx"></audio>
      <audio id="sfx-sw1" class="clip" src="assets/sfx/swoosh-air.mp3" data-start="0.82" data-duration="0.49" data-volume="0.55" data-track-index="21" data-audio-group="sfx"></audio>
      <audio id="sfx-wh1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="1.87" data-duration="0.57" data-volume="0.45" data-track-index="22" data-audio-group="sfx"></audio>
      <audio id="sfx-quad" class="clip" src="assets/sfx/quad-hover.mp3" data-start="2.1" data-duration="2.9" data-media-start="1.0" data-volume="0.4" data-fade-in="0.5" data-fade-out="0.5" data-track-index="23" data-audio-group="sfx"></audio>
      <audio id="sfx-sw2" class="clip" src="assets/sfx/swoosh-space.mp3" data-start="4.72" data-duration="1.01" data-volume="0.8" data-track-index="20" data-audio-group="sfx"></audio>
      <audio id="sfx-fly" class="clip" src="assets/sfx/flyby.mp3" data-start="5.05" data-duration="3.9" data-media-start="3.4" data-volume="0.45" data-fade-in="0.4" data-fade-out="0.8" data-track-index="21" data-audio-group="sfx"></audio>
      <audio id="sfx-sw3" class="clip" src="assets/sfx/swoosh-air.mp3" data-start="8.96" data-duration="0.49" data-volume="0.5" data-track-index="22" data-audio-group="sfx"></audio>
      <audio id="sfx-bp1" class="clip" src="assets/sfx/beep4.mp3" data-start="10.30" data-duration="0.8" data-volume="0.3" data-fade-out="0.3" data-track-index="23" data-audio-group="sfx"></audio>
      <audio id="sfx-bp2" class="clip" src="assets/sfx/beep5.mp3" data-start="10.20" data-duration="0.9" data-volume="0.3" data-fade-out="0.3" data-track-index="20" data-audio-group="sfx"></audio>
      <audio id="sfx-sw4" class="clip" src="assets/sfx/swoosh-processed.mp3" data-start="12.06" data-duration="1.6" data-volume="0.7" data-fade-out="0.4" data-track-index="21" data-audio-group="sfx"></audio>
      <audio id="sfx-hud" class="clip" src="assets/sfx/hud-open2.mp3" data-start="12.88" data-duration="2.88" data-volume="0.35" data-track-index="22" data-audio-group="sfx"></audio>
      <audio id="sfx-ck1" class="clip" src="assets/sfx/click.mp3" data-start="13.92" data-duration="0.37" data-volume="0.8" data-track-index="23" data-audio-group="sfx"></audio>
      <audio id="sfx-ck2" class="clip" src="assets/sfx/click.mp3" data-start="14.72" data-duration="0.37" data-volume="0.8" data-track-index="20" data-audio-group="sfx"></audio>
      <audio id="sfx-rise" class="clip" src="assets/sfx/riser.mp3" data-start="15.52" data-duration="2.0" data-volume="0.6" data-track-index="21" data-audio-group="sfx"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-logo.mp3" data-start="17.14" data-duration="4.0" data-volume="0.85" data-track-index="22" data-audio-group="sfx"></audio>
      <audio id="sfx-hud2" class="clip" src="assets/sfx/hud-open1.mp3" data-start="17.97" data-duration="2.0" data-volume="0.35" data-track-index="23" data-audio-group="sfx"></audio>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        // hook: boom shake, then punch-in when the question lands
        [[0.0, 8, -6], [0.033, -7, 5], [0.067, 5, -3], [0.1, -3, 2], [0.133, 0, 0]].forEach(([t, x, y]) => tl.set("#cam", { x, y }, t));
        tl.set("#cam", { scale: 1.0 }, 0);
        tl.set("#cam", { scale: 1.07 }, 0.85);
        tl.set("#cam", { scale: 1.0 }, 2.0);
        tl.set("#cam", { scale: 1.05 }, 13.0);
        tl.set("#cam", { scale: 1.0 }, 15.0);
        // the drop: kick in and settle
        tl.fromTo("#cam", { scale: 1.12 }, { scale: 1.0, duration: 0.7, ease: "expo.out" }, 17.5);
        [[17.5, 0, 9], [17.533, 0, -7], [17.567, 0, 4], [17.6, 0, -2], [17.633, 0, 0]].forEach(([t, x, y]) => tl.set("#cam", { x, y }, t));
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
