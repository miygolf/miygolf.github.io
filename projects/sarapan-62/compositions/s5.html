  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var DRUM = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-.,'=";
      var N = DRUM.length;
      var DEG = Math.PI / 180;
      // Split-flap row (same mechanism as s1).
      function flapRow(row, o) {
        var cells = [];
        var k = 0;
        for (var i = 0; i < o.text.length; i++) {
          var ch = o.text.charAt(i);
          if (ch === " ") {
            var gap = document.createElement("div");
            gap.className = "sf-gap";
            gap.style.width = o.space + "px";
            row.appendChild(gap);
            continue;
          }
          var cell = document.createElement("div");
          cell.className = "sf-cell";
          cell.style.width = o.cw + "px";
          cell.style.height = o.ch + "px";
          cell.style.marginRight = o.gap + "px";
          // the mechanism is stacked half-glyphs under a falling leaf: overlap is the design
          cell.setAttribute("data-layout-allow-overlap", "");
          cell.setAttribute("data-layout-allow-occlusion", "");
          cell.setAttribute("data-layout-allow-overflow", "");
          var faces = ["sf-top", "sf-bot", "sf-leaf-a", "sf-leaf-b"].map(function (cls, n) {
            var f = document.createElement("div");
            f.className = "sf-face " + cls;
            var g = document.createElement("span");
            g.className = "sf-glyph";
            g.setAttribute("data-layout-allow-occlusion", "");
            g.style.height = o.ch + "px";
            g.style.lineHeight = o.ch + "px";
            g.style.fontSize = o.fs + "px";
            g.style.top = (n % 2 ? -Math.round(o.ch / 2) : 0) + "px";
            f.appendChild(g);
            cell.appendChild(f);
            return f;
          });
          var seam = document.createElement("div");
          seam.className = "sf-seam";
          seam.setAttribute("data-layout-ignore", "");
          cell.appendChild(seam);
          row.appendChild(cell);
          var target = Math.max(0, DRUM.indexOf(ch));
          var steps = o.walk(k);
          cells.push({ k: k, steps: steps, from: (target - steps + N * 4) % N,
            top: faces[0].firstChild, bot: faces[1].firstChild, la: faces[2], lb: faces[3] });
          k++;
        }
        function leaf(l, ch, ang, shade) {
          if (ch === null) {
            l.firstChild.textContent = "";
            l.style.opacity = "0";
            l.style.transform = "";
            l.style.filter = "";
            return;
          }
          l.firstChild.textContent = ch;
          l.style.opacity = "1";
          l.style.transform = "rotateX(" + ang.toFixed(2) + "deg)";
          l.style.filter = "brightness(" + shade + ")";
        }
        return function paint(t) {
          for (var i = 0; i < cells.length; i++) {
            var c = cells[i];
            var local = t - o.start - c.k * o.stagger;
            var raw = local <= 0 ? 0 : local / o.flip;
            var count = Math.floor(raw);
            var p = raw - count;
            if (count >= c.steps) { count = c.steps; p = 0; }
            // a cell shows blank until its first flap falls, so no stray letters sit on screen
            var out = count === 0 && c.steps > 0 ? " " : DRUM.charAt((c.from + count) % N);
            var inc = DRUM.charAt((c.from + count + 1) % N);
            if (!(count < c.steps && p > 0)) {
              c.top.textContent = out;
              c.bot.textContent = out;
              leaf(c.la, null);
              leaf(c.lb, null);
              continue;
            }
            c.top.textContent = inc;
            c.bot.textContent = out;
            var th = 180 * p * p;
            var sh = (1 - 0.5 * Math.sin(th * DEG)).toFixed(3);
            if (th < 90) { leaf(c.la, out, -th, sh); leaf(c.lb, null); }
            else { leaf(c.la, null); leaf(c.lb, inc, 180 - th, sh); }
          }
        };
      }

      var p = flapRow(document.getElementById("s5-row"), {
        text: "08:00 - 11:00", cw: 50, ch: 76, fs: 52, gap: 5, space: 20,
        start: 2.0, flip: 0.05, stagger: 0.03, walk: function (k) { return 8 + ((k * 3) % 6); },
      });

      var tl = gsap.timeline({ paused: true });
      var drv = { _t: 0 };
      Object.defineProperty(drv, "t", {
        configurable: true,
        get: function () { return this._t; },
        set: function (v) { this._t = v; p(v); },

      tl.to(drv, { t: 6.69, duration: 6.69, ease: "none" }, 0);

      tl.fromTo("#s5-rays", { rotation: 0 }, { rotation: 20, duration: 6.69, ease: "none" }, 0);
      tl.fromTo("#s5-rays", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
      // the ticket is handed up into frame and lands still
      tl.fromTo("#s5-ticket", { y: 1500, rotation: 5 }, { y: 0, rotation: 0, duration: 0.78, ease: "expo.out" }, 0.05);
      tl.fromTo("#s5-from", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" }, 0.55);
      tl.fromTo("#s5-to", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" }, 0.66);
      tl.fromTo("#s5-loc1 span, #s5-loc2 span", { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.075 }, 0.9);
      tl.fromTo(".s5-day", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.36, ease: "back.out(1.7)", stagger: 0.05 }, 1.48);
      tl.fromTo(".s5-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power2.out", stagger: 0.08 }, 1.9);
      tl.fromTo("#s5-pagi", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 2.75);
      // the stamp: the film's one impact
      tl.fromTo("#s5-stamp", { scale: 2.4, rotation: -22, autoAlpha: 0 }, { scale: 1, rotation: -8, autoAlpha: 1, duration: 0.17, ease: "power3.in" }, 3.03);
      tl.fromTo("#s5-paper", { y: 0 }, { y: 7, duration: 0.05, ease: "power2.out", yoyo: true, repeat: 1 }, 3.2);
      // the stub turns into the ask
      tl.fromTo("#s5-stub-a", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.14, ease: "power2.in" }, 4.06);
      tl.fromTo("#s5-stub-b", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 4.2);
      tl.fromTo("#s5-stub", { rotation: 0, y: 0 }, { rotation: 2.2, y: 10, duration: 0.3, ease: "back.out(2)" }, 4.2);
      p(0);
      window.__timelines["s5"] = tl;
    })();
  </script>
