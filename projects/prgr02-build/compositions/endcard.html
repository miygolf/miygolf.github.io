<template>
  <link rel="stylesheet" href="assets/camera.css" />
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #111214; }
  </style>
  <div id="root" data-composition-id="endcard" data-width="1080" data-height="1920">
    <div id="ec-cam" class="cam"><img src="assets/stills/closeup.jpg" alt="PRGR 02 iron head badge" /></div>
  </div>
  <script>
    // camera: photo point (cx, cy) at frame centre, zoom z (photo is 960 x 1280 css px)
    const cam = (z, cx, cy) => ({ scale: z, x: 540 - cx * z, y: 960 - cy * z });
    const tl = gsap.timeline({ paused: true });
    // out of the dip: settle on the badge of the second head, then a slow track across it
    tl.fromTo("#ec-cam", cam(1.95, 600, 600), { ...cam(1.7, 600, 565), duration: 0.8, ease: "expo.out" }, 0);
    tl.to("#ec-cam", { ...cam(1.75, 560, 575), duration: 2.1, ease: "power1.inOut" }, 0.8);
    window.__timelines["endcard"] = tl;
  </script>
