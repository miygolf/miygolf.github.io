<template>
  <link rel="stylesheet" href="assets/plate.css" />
  <style>
    @font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/BarlowCondensed-800.woff2") format("woff2"); font-weight: 800; }
    @font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/BarlowCondensed-600.woff2") format("woff2"); font-weight: 600; }
    @font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/BarlowCondensed-500.woff2") format("woff2"); font-weight: 500; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #d7191f; }
    #sh-view { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; clip-path: circle(0px at 474px 982px); }
  </style>
  <div id="root" data-composition-id="shaft" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"shTag","type":"string","label":"Tag","default":"Shaft"},{"id":"shBig","type":"string","label":"Name","default":"KBS TGI 60"},{"id":"shLine","type":"string","label":"Line","default":"Graphite tour. Ringan di tangan."}]'>
    <div id="sh-view">
      <div id="sh-rot" class="rot">
        <div id="sh-cam" class="cam"><img src="assets/stills/shaft.jpg" alt="KBS TGI 60 graphite iron shaft" /></div>
      </div>
    </div>
    <div id="sh-plate" class="plate-sh">
      <div class="plate">
        <div class="p-head"><span class="p-tag" data-var-text="shTag">Shaft</span><span class="p-slot"></span></div>
        <div class="p-big"><span id="sh-ink" class="ink" data-var-text="shBig">KBS TGI 60</span><span id="sh-cut" class="cutw"><i class="cutter"></i></span></div>
        <div class="p-line" data-var-text="shLine">Graphite tour. Ringan di tangan.</div>
      </div>
    </div>
  </div>
  <script>
    const cam = (z, cx, cy) => ({ scale: z, x: 540 - cx * z, y: 960 - cy * z });
    // a plate slots in from the left like a part and seats 4 px in two frames
    const plateIn = (tl, sel, t) => {
      tl.fromTo(sel, { x: -860 }, { x: 0, duration: 0.45, ease: "expo.out" }, t);
      tl.fromTo(sel, { y: 0 }, { y: 4, duration: 0.033, ease: "none", immediateRender: false }, t + 0.36);
      tl.to(sel, { y: 0, duration: 0.033, ease: "none" }, t + 0.393);
    };
    // engrave: the word is cut in left to right behind a red cutter line
    const engrave = (tl, ink, cutw, t, d = 0.3) => {
      tl.fromTo(ink, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "power2.inOut" }, t);
      tl.fromTo(cutw, { xPercent: 0, opacity: 1 }, { xPercent: 100, duration: d, ease: "power2.inOut" }, t);
      tl.to(cutw, { opacity: 0, duration: 0.08 }, t + d);
    };
    const tl = gsap.timeline({ paused: true });
    // the photo is turned 8.3 degrees so the shaft lies level
    tl.set("#sh-rot", { rotation: 8.3 }, 0);
    tl.set("#sh-cam", cam(2.2, 330, 785), 0);
    // red world closes onto the red KBS label: the picture irises open from the label
    tl.fromTo("#sh-view", { clipPath: "circle(0px at 474px 982px)" }, { clipPath: "circle(2300px at 474px 982px)", duration: 0.45, ease: "power3.out" }, 0);
    tl.fromTo("#sh-cam", cam(2.2, 330, 785), { ...cam(2.2, 640, 742), duration: 3.2, ease: "power2.inOut", immediateRender: false }, 0.35);
    plateIn(tl, "#sh-plate", 0.35);
    engrave(tl, "#sh-ink", "#sh-cut", 0.6, 0.36);
    // exit: zoom through the TGI 60 print
    tl.to("#sh-cam", { ...cam(3.4, 720, 742), duration: 0.27, ease: "power3.in" }, 3.6);
    tl.to("#sh-plate", { x: -380, opacity: 0, duration: 0.2, ease: "power3.in" }, 3.62);
    window.__timelines["shaft"] = tl;
  </script>
</template>
