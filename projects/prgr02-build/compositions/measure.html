<template>
  <link rel="stylesheet" href="assets/camera.css" />
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #111214; }
  </style>
  <div id="root" data-composition-id="measure" data-width="1080" data-height="1920">
    <div id="ms-cam" class="cam"><img src="assets/stills/flatlay.jpg" alt="Shafts on the bench over length marks" /></div>
  </div>
  <script>
    // camera: photo point (cx, cy) at frame centre, zoom z (photo is 960 x 1280 css px)
    const cam = (z, cx, cy) => ({ scale: z, x: 540 - cx * z, y: 960 - cy * z });
    const tl = gsap.timeline({ paused: true });
    // the bench runs right to left along the length marks, fast first, then settles
    tl.fromTo("#ms-cam", cam(2.3, 240, 640), { ...cam(2.3, 560, 612), duration: 2.9, ease: "power2.out" }, 0);
    window.__timelines["measure"] = tl;
  </script>
</template>
