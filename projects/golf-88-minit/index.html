<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Look: "Contact Sheet" — film-lab proof sheet. Film black, photo-paper white,
         edge-code amber; grease-pencil marks; loupe; film-advance cuts. */
      :root {
        --ground: #0e0c0a;
        --paper: #f6f2e9;
        --amber: #ff8a1f;
        --ink: #14110e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); }
      .full {
        position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover;
      }
      .still-wrap { position: absolute; inset: 0; overflow: hidden; }
      .still-wrap img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #grain {
        position: absolute; inset: 0; z-index: 90; pointer-events: none; overflow: hidden;
      }
      #grain-tex {
        position: absolute; left: -10%; top: -10%; width: 120%; height: 120%; opacity: 0.07;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
      }
    </style>
  </head>
  <body>

      <audio id="nat-b2" class="clip" src="assets/footage/b2.mp4" data-start="9.4333" data-duration="0.6" data-media-start="0.2" data-track-index="11" data-volume="1.4" data-fade-out="0.15"></audio>

      <!-- SFX (Mixkit). Each placed so its peak lands one frame after its picture. -->

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Slow push-in on every freeze (child of the timed wrapper, never the clip itself)
      tl.fromTo("#s-hook-img", { scale: 1.0 }, { scale: 1.035, duration: 1.6, ease: "sine.out", transformOrigin: "50% 45%" }, 0.8);
      tl.fromTo("#s-a-img", { scale: 1.0 }, { scale: 1.03, duration: 3.3, ease: "sine.out", transformOrigin: "50% 60%" }, 5.3);
      tl.fromTo("#s-b-img", { scale: 1.0 }, { scale: 1.03, duration: 3.3, ease: "sine.out", transformOrigin: "50% 55%" }, 11.1);
      tl.fromTo("#s-out-img", { scale: 1.0 }, { scale: 1.02, duration: 1.0333, ease: "sine.out" }, 20.9667);
      // Film grain: re-positioned every frame from a fixed table (deterministic)
      for (let i = 0; i < 22 * 15; i++) {
        const x = ((i * 37) % 17) - 8, y = ((i * 53) % 19) - 9;
        tl.set("#grain-tex", { xPercent: x * 0.5, yPercent: y * 0.5 }, i / 15);
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
