<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* "Papan Tanda Lebuhraya" — Malaysian highway signage.
         sign green / reflective white / warning amber; Overpass + Barlow Condensed italic.
         Every word lives in the sky band (y 220–1000) and inside x 60–960:
         clear of TikTok/IG top bar, bottom caption area and the right action rail. */
      @font-face {
        font-family: "Overpass";
        src: url("assets/fonts/Overpass-var.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Barlow Condensed";
        src: url("assets/fonts/BarlowCondensed-900i.woff2") format("woff2");
        font-weight: 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Barlow Condensed";
        src: url("assets/fonts/BarlowCondensed-800i.woff2") format("woff2");
        font-weight: 800;
        font-style: italic;
      }
      :root {
        --green: #0b6a43;
        --green-deep: #08502f;
        --white: #f7f7f2;
        --amber: #ffc21c;
        --ink: #101010;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      body {
        font-family: "Overpass", sans-serif;
      }
      .plate {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .cam {
        position: absolute;
        inset: 0;
      }
      .cam video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      /* sky scrim so white type reads on the overcast sky */
      .sky {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 900px;
        background: linear-gradient(180deg, rgba(6, 22, 14, 0.5) 0%, rgba(6, 22, 14, 0.22) 55%, rgba(6, 22, 14, 0) 100%);
      }
      /* green highway sign: green body, inset reflective white border */
      .sign {
        position: absolute;
        background: var(--green);
        border-radius: 28px;
        padding: 11px;
        box-shadow: 0 22px 44px rgba(0, 0, 0, 0.38);
      }
      .sign-in {
        border: 7px solid var(--white);
        border-radius: 19px;
        color: var(--white);
        display: flex;
        align-items: center;
      }
      .sign .big {
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -1px;
        white-space: nowrap;
      }
      .sign .small {
        font-weight: 700;
        line-height: 1;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      /* speed type */
      .kin {
        position: absolute;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 900;
        font-style: italic;
        line-height: 0.86;
        white-space: nowrap;
        color: var(--white);
        text-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
      }
      /* amber type sits on an ink sticker so it holds on the bright overcast sky */
      .kin.amber {
        color: var(--amber);
        background: rgba(16, 16, 16, 0.9);
        padding: 22px 34px 0 26px;
        border-radius: 14px;
        text-shadow: none;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      }
      .chip {
        position: absolute;
        font-weight: 800;
        white-space: nowrap;
        border-radius: 999px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
