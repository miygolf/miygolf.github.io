    <style>
      /* "Laporan Polis: Kes Remote Hilang" — case-file look.
         ink / paper / signal red; League Gothic + Space Mono + Archivo Black. */
      :root {
        --ink: #121212;
        --paper: #f2eadb;
        --red: #e5322d;
        --basket: #ffc21a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      body {
        font-family: "Space Mono", monospace;
      }
      .foot {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .foot-rig {
        position: absolute;
        inset: 0;
      }
      .foot-rig video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      /* label-maker strip */
      .strip {
        position: absolute;
        left: 64px;
        font-family: "League Gothic", sans-serif;
        font-size: 118px;
        line-height: 1;
        padding: 10px 24px 2px;
        color: var(--paper);
        background: var(--ink);
        letter-spacing: 1px;
        white-space: nowrap;
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.18);
      }
      .strip.red {
        background: var(--red);
      }
      .mono {
        font-family: "Space Mono", monospace;
        font-weight: 700;
      }
      .stamp {
        position: absolute;
        font-family: "Archivo Black", sans-serif;
        color: var(--red);
        border: 8px solid var(--red);
        border-radius: 10px;
        padding: 4px 22px 0;
        line-height: 1.05;
        white-space: nowrap;
        letter-spacing: 2px;
      }
      .type {
        white-space: pre;
      }
    </style>
  </head>
