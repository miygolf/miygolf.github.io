<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* "Casual": the Kinrara recap told like a friend's phone story. Small lowercase Lexend in white with a soft shadow, no panels, no badges,
         a thin underline under each name, simple fades. Hard cuts, real sound, one SFX. No music.
         Type: Lexend 600/400 + Noto Color Emoji. Palette: white #ffffff, soft shadow, one accent (pale lime #e6ff7a) for "masuk".
         Safe band: x 60-930, y 168-1330. Faces: name labels top-left (top-right on the approach, golfer on the left); "masuk" low by the cup. */
      @font-face { font-family: "Lexend"; font-weight: 100 900; src: url("assets/fonts/Lexend-VF.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Noto Color Emoji"; font-weight: 400; src: url("assets/fonts/NotoColorEmoji.ttf") format("truetype"); font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #aroll { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; }
      .ov { position: absolute; z-index: 6; opacity: 0; pointer-events: none; color: #fff; font-family: "Lexend", sans-serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.55), 0 1px 2px rgba(0,0,0,0.5);
            -webkit-text-stroke: 7px rgba(10,12,14,0.62); paint-order: stroke fill; }
      .emo { -webkit-text-stroke: 0; }
      #scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 640px; z-index: 5; pointer-events: none; opacity: 0;
               background: linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.26) 55%, rgba(0,0,0,0) 100%); }
      .emo { font-family: "Noto Color Emoji", sans-serif; text-shadow: none; }
      .lab { top: 210px; }
      .lab .nm { font-weight: 600; font-size: 64px; line-height: 1; display: inline-block; padding-bottom: 8px; border-bottom: 4px solid rgba(255,255,255,0.9); box-shadow: 0 3px 0 rgba(0,0,0,0.35); }
      .lab .nt { font-weight: 400; font-size: 34px; margin-top: 10px; opacity: 0.92; }
      #title { left: 70px; top: 186px; }
      #title .a { font-weight: 600; font-size: 76px; line-height: 1.05; }
      #title .b { font-weight: 400; font-size: 38px; margin-top: 10px; opacity: 0.92; }
      .masuk { font-weight: 700; font-size: 96px; color: #e6ff7a; }
      #end { left: 70px; top: 210px; }
      #end .a { font-weight: 600; font-size: 64px; line-height: 1.15; }
      #end .b { font-weight: 400; font-size: 38px; margin-top: 12px; opacity: 0.92; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-root" id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920" data-fps="30">
      <video data-hf-id="hf-aroll" id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="{{TOTAL}}" data-track-index="1" muted playsinline></video>
      <div id="scrim"></div>
      <div id="title" class="ov"><div class="a">kinrara, petang tadi <span class="emo" style="font-size:60px">☁️</span></div><div class="b">19.11 · recap santai</div></div>
      <div id="m1" class="ov masuk" style="left:140px; top:1200px;">masuk <span class="emo" style="font-size:78px">🙌</span></div>
      {{LABELS}}
      <div id="m2" class="ov masuk" style="left:470px; top:830px;">masuk <span class="emo" style="font-size:78px">🙌</span></div>
      <div id="end" class="ov"><div class="a">coach reza · kimi<br>taza · saya <span class="emo" style="font-size:52px">🤝</span></div><div class="b">jumpa round depan</div></div>
{{AUDIO}}
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const K = {{CONSTS}};
        const T = K.T, B = K.B;
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        function fade(sel, t0, t1) {
          const el = $(sel); tl.set(el, { opacity: 0 }, 0);
          tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t0);
          if (t1 != null) tl.to(el, { opacity: 0, duration: 0.2 }, t1);
        }
        tl.set("#title", { opacity: 1 }, 0);
        tl.set("#scrim", { opacity: 1 }, 0);
        tl.to("#title", { opacity: 0, duration: 0.2 }, T.appr.start - 0.2);
        fade("#m1", B.hook_drop + 0.05, T.appr.start - 0.1);
        K.LAB.forEach((l) => fade("#" + l.id, l.t0, l.t1));
        fade("#m2", B.putt_drop + 0.08, T.putt.end - 0.1);
        fade("#end", T.end_freeze.start + 0.15, null);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
