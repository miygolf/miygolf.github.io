         a thin underline under each name, simple fades. Hard cuts, real sound, one SFX. No music.
         Type: Lexend 600/400 + Noto Color Emoji. Palette: white #ffffff, soft shadow, one accent (pale lime #e6ff7a) for "masuk".
         Safe band: x 60-930, y 168-1330. Faces: name labels top-left (top-right on the approach, golfer on the left); "masuk" low by the cup. */

      @font-face { font-family: "Noto Color Emoji"; font-weight: 400; src: url("assets/fonts/NotoColorEmoji.ttf") format("truetype"); font-display: block; }

      #aroll { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; }
      .ov { position: absolute; z-index: 6; opacity: 0; pointer-events: none; color: #fff; font-family: "Lexend", sans-serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.55), 0 1px 2px rgba(0,0,0,0.5);
            -webkit-text-stroke: 7px rgba(10,12,14,0.62); paint-order: stroke fill; }
      .emo { -webkit-text-stroke: 0; }
      #scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 640px; z-index: 5; pointer-events: none; opacity: 0;
               background: linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.26) 55%, rgba(0,0,0,0) 100%); }
      .emo { font-family: "Noto Color Emoji", sans-serif; text-shadow: none; }
      .lab { top: 210px; }
      .lab .nm { font-weight: 600; font-size: 64px; line-height: 1; display: inline-block; padding-bottom: 8px; border-bottom: 4px solid rgba(255,255,255,0.9); box-shadow: 0 3px 0 rgba(0,0,0,0.35); }

        const T = K.T, B = K.B;
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        function fade(sel, t0, t1) {
          const el = $(sel); tl.set(el, { opacity: 0 }, 0);
          tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, t0);
          if (t1 != null) tl.to(el, { opacity: 0, duration: 0.2 }, t1);
        }
        tl.set("#title", { opacity: 1 }, 0);
        tl.set("#scrim", { opacity: 1 }, 0);
        tl.to("#title", { opacity: 0, duration: 0.2 }, T.appr.start - 0.2);
        fade("#m1", B.hook_drop + 0.05, T.appr.start - 0.1);
        K.LAB.forEach((l) => fade("#" + l.id, l.t0, l.t1));
        fade("#m2", B.putt_drop + 0.08, T.putt.end - 0.1);
        fade("#end", T.end_freeze.start + 0.15, null);
        window.__timelines["main"] = tl;
