<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* "Neon Clubhouse": the shot told in the 19th-hole bar's neon signs. Tube lettering on smoked-glass plates with a glowing
         aqua tube frame, signs flicker on (and buzz) when they light, a neon scan line wipes between scenes, a neon tracker ring
         locks on the ball and a pink ring pulses as it passes the cup. Captions are smoked plates, the spoken key word lit in aqua.
         Type: Tilt Neon (signs) + Sora 700/800 (captions, kicker) + Noto Color Emoji.
         Palette: tube pink #ff3d8b, tube aqua #39f3ff, tube core #fff4fa, smoked glass rgba(9,7,20,0.74).
         Safe band: x 60-930, y 168-1330. Faces (EDIT_NOTES.md): walk-in face x 480-680 / y 560-720, plan face x 340-510 / y 890-930,
         shot face x 320-480 / y 750-830, replay face top x 550-650 / y 300-400 -> signs in the sky band, captions low; on the green the
         ball sits at y 1170-1340, so the roll caption goes up into the trees. */
      @font-face { font-family: "Tilt Neon"; font-weight: 400; src: url("assets/fonts/TiltNeon-VF.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Sora"; font-weight: 100 800; src: url("assets/fonts/Sora-VF.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Noto Color Emoji"; font-weight: 400; src: url("assets/fonts/NotoColorEmoji.ttf") format("truetype"); font-display: block; }
      :root { --pink: #ff3d8b; --aqua: #39f3ff; --core: #fff4fa; --glass: rgba(9,7,20,0.74); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #aroll { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; transform-origin: 50% 50%; }
      .ov { position: absolute; z-index: 6; opacity: 0; pointer-events: none; }
      .emo { font-family: "Noto Color Emoji", sans-serif; font-weight: 400; text-shadow: none; }

      /* ---- neon sign ---- */
      .sign { background: var(--glass); border-radius: 26px; padding: 22px 34px 28px; border: 4px solid rgba(57,243,255,0.95);
              box-shadow: 0 0 10px rgba(57,243,255,0.9), 0 0 26px rgba(57,243,255,0.45), inset 0 0 14px rgba(57,243,255,0.45), 0 14px 40px rgba(0,0,0,0.35); }
      .sign.pk { border-color: rgba(255,61,139,0.95); box-shadow: 0 0 10px rgba(255,61,139,0.9), 0 0 26px rgba(255,61,139,0.45), inset 0 0 14px rgba(255,61,139,0.45), 0 14px 40px rgba(0,0,0,0.35); }
      .tube { font-family: "Tilt Neon", sans-serif; line-height: 0.92; color: var(--core); white-space: nowrap; }
      .tube.p { text-shadow: 0 0 3px #fff, 0 0 9px var(--pink), 0 0 20px var(--pink), 0 0 42px var(--pink), 0 0 80px rgba(255,61,139,0.55); }
      .tube.a { text-shadow: 0 0 3px #fff, 0 0 9px var(--aqua), 0 0 20px var(--aqua), 0 0 42px var(--aqua), 0 0 80px rgba(57,243,255,0.5); }
      .kick { font-family: "Sora"; font-weight: 800; font-size: 30px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--aqua);
              text-shadow: 0 0 8px rgba(57,243,255,0.8); display: flex; align-items: center; gap: 14px; }
      .kick::before { content: ""; width: 40px; height: 4px; border-radius: 4px; background: var(--aqua); box-shadow: 0 0 10px var(--aqua); }
      .kick.p { color: var(--pink); text-shadow: 0 0 8px rgba(255,61,139,0.8); }
      .kick.p::before { background: var(--pink); box-shadow: 0 0 10px var(--pink); }

      /* ---- caption plate ---- */
      .cap { left: 540px; top: 1170px; transform: translateX(-50%); max-width: 870px; padding: 16px 30px 20px; background: var(--glass);
             border-radius: 18px; color: #fff; font-family: "Sora"; font-weight: 700; font-size: 50px; line-height: 1.16; text-align: center; white-space: nowrap;
             box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
      .cap .w { opacity: 0.38; }
      .cap .w.on { opacity: 1; }
      .cap .w.hot.on { color: var(--aqua); text-shadow: 0 0 10px rgba(57,243,255,0.9), 0 0 24px rgba(57,243,255,0.5); }
      #cap3 { top: 780px; }

      /* ---- rings / tracker ---- */
      #fx { left: 0; top: 0; width: 1080px; height: 1920px; opacity: 1; z-index: 5; overflow: visible; }
      #fx circle, #fx path { fill: none; stroke-linecap: round; }
      .ra { stroke: var(--aqua); filter: drop-shadow(0 0 6px #39f3ff) drop-shadow(0 0 14px #39f3ff); }
      .rp { stroke: var(--pink); filter: drop-shadow(0 0 6px #ff3d8b) drop-shadow(0 0 14px #ff3d8b); }

      /* ---- neon scan wipe ---- */
      #scan { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 9; pointer-events: none; opacity: 0; }
      #scan .ln { position: absolute; left: -20px; right: -20px; top: 0; height: 12px; border-radius: 12px; background: #fff;
                  box-shadow: 0 0 10px #fff, 0 0 24px var(--aqua), 0 0 60px var(--aqua), 0 0 120px rgba(57,243,255,0.6); }
      #scan .tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(57,243,255,0.0), rgba(255,61,139,0.22)); }
      #flash { position: absolute; inset: 0; z-index: 8; background: var(--pink); opacity: 0; pointer-events: none; mix-blend-mode: screen; }
      #flashw { position: absolute; inset: 0; z-index: 8; background: #fff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-root" id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920" data-fps="30">
      <video data-hf-id="hf-aroll" id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="{{TOTAL}}" data-track-index="1" muted playsinline></video>

      <svg id="fx" class="ov" viewBox="0 0 1080 1920">
        <g id="hookring"><circle class="rp" id="hr1" r="70" stroke-width="9"/><circle class="ra" id="hr2" r="104" stroke-width="5" stroke-dasharray="14 18"/></g>
        <g id="trk"><circle class="ra" r="44" stroke-width="6"/>
          <path class="ra" stroke-width="6" d="M 0 -62 V -50 M 0 50 V 62 M -62 0 H -50 M 50 0 H 62"/></g>
        <g id="cupring"><circle class="rp" id="cr1" r="40" stroke-width="8"/><circle class="rp" id="cr2" r="40" stroke-width="5"/></g>
      </svg>

      <!-- HOOK sign, frame 0 -->
      <div id="hook" class="ov sign pk" style="left:60px; top:214px; width:870px;">
        <div class="kick">Dari bunker</div>
        <div class="tube p" style="font-size:170px; margin-top:12px;"><span id="h1">NYARIS</span><br><span id="h2">MASUK</span> <span id="hemo" class="emo" style="font-size:120px;">😱</span></div>
      </div>

      <!-- plan signs -->
      <div id="s20" class="ov sign" style="left:640px; top:236px;"><div class="tube a" style="font-size:96px;">≈20 ft</div></div>
      <div id="sstop" class="ov sign pk" style="left:60px; top:236px;"><div class="kick p">Plan coach</div><div class="tube p" style="font-size:118px; margin-top:8px;">STOP SHOT</div></div>

      <!-- roll -->
      <div id="snyaris" class="ov sign pk" style="left:60px; top:236px; width:870px; text-align:center;"><div class="tube p" style="font-size:180px;">NYARIS!</div></div>
      <div id="rep" class="ov sign" style="left:60px; top:1180px; padding:14px 24px 18px;"><div class="tube a" style="font-size:64px;">REPLAY ½×</div></div>

      <!-- end -->
      <div id="endsign" class="ov sign pk" style="left:60px; top:214px; width:870px;">
        <div class="kick">Bunker → tepi lubang</div>
        <div class="tube p" style="font-size:150px; margin-top:12px;">SIKIT LAGI!</div>
        <div class="tube a" style="font-size:62px; margin-top:16px;">stop shot · ≈20 ft</div>
      </div>
      <div id="cta" class="ov cap" style="top:1236px; font-size:44px;">Korang pernah nyaris hole-out? <span class="emo">👇</span></div>

      <!-- captions -->
      {{CAPS}}
      <div id="scan"><div class="tint"></div><div class="ln"></div></div>
      <div id="flash"></div><div id="flashw"></div>
{{AUDIO}}
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const K = {{CONSTS}};
        const T = K.T, B = K.B;
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        const hide0 = (el) => tl.set(el, { opacity: 0 }, 0);
        // a neon sign lights: dark glass first, then the tube stutters on (steps), then holds
        function light(sel, t0, t1) {
          const el = $(sel); hide0(el);
          tl.fromTo(el, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, t0);
          el.querySelectorAll(".tube").forEach((tb) => {
            tl.fromTo(tb, { opacity: 0.12 }, { opacity: 1, duration: 0.05, immediateRender: false }, t0 + 0.06);
            tl.to(tb, { opacity: 0.25, duration: 0.03 }, t0 + 0.13);
            tl.to(tb, { opacity: 1, duration: 0.03 }, t0 + 0.18);
            tl.to(tb, { opacity: 0.5, duration: 0.02 }, t0 + 0.27);
            tl.to(tb, { opacity: 1, duration: 0.03 }, t0 + 0.30);
          });
          if (t1 != null) {
            tl.to(el, { opacity: 0.3, duration: 0.04 }, t1);
            tl.to(el, { opacity: 0, duration: 0.12 }, t1 + 0.06);
          }
          return el;
        }
        function scan(tc) {   // neon line sweeps top -> bottom across the cut
          tl.set("#scan", { opacity: 1 }, tc - 0.16);
          tl.fromTo("#scan .ln", { y: -40 }, { y: 1960, duration: 0.34, ease: "power2.inOut", immediateRender: false }, tc - 0.16);
          tl.fromTo("#scan .tint", { opacity: 0.9 }, { opacity: 0, duration: 0.34, ease: "power2.out", immediateRender: false }, tc - 0.02);
          tl.set("#scan", { opacity: 0 }, tc + 0.2);
        }
        function flash(t, a, w) { tl.fromTo(w ? "#flashw" : "#flash", { opacity: a || 0.5 }, { opacity: 0, duration: 0.26, ease: "power2.out", immediateRender: false }, t); }
        function punch(t, s) { tl.fromTo("#aroll", { scale: s || 1.04 }, { scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, t); }
        function ring(el, t, r0, r1, dur) { tl.fromTo(el, { attr: { r: r0 }, opacity: 1 }, { attr: { r: r1 }, duration: dur || 0.32, ease: "back.out(2)", immediateRender: false }, t); }

        // ---------- captions ----------
        K.CAP.forEach((c, i) => {
          const el = $("#cap" + i); hide0(el);
          tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, Math.max(c.t0, 0));
          tl.to(el, { opacity: 0, duration: 0.12 }, c.t1);
          el.querySelectorAll(".w").forEach((w) => tl.set(w, { className: w.className + " on" }, Math.max(parseFloat(w.dataset.t), 0)));
        });

        // ---------- HOOK ----------
        const hk = $("#hook");
        tl.set(hk, { opacity: 1 }, 0);                                    // text on frame 0
        tl.fromTo("#h1", { opacity: 0.15 }, { opacity: 1, duration: 0.04, immediateRender: false }, 0.04);
        tl.to("#h1", { opacity: 0.3, duration: 0.03 }, 0.12); tl.to("#h1", { opacity: 1, duration: 0.03 }, 0.17);
        tl.set("#h2", { opacity: 0.12 }, 0);
        tl.to("#h2", { opacity: 1, duration: 0.04 }, 0.30); tl.to("#h2", { opacity: 0.35, duration: 0.03 }, 0.38); tl.to("#h2", { opacity: 1, duration: 0.03 }, 0.43);
        tl.set("#hemo", { opacity: 0 }, 0);
        tl.fromTo("#hemo", { opacity: 1, scale: 0.2, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.6)", immediateRender: false }, B.hook_cup + 0.42);
        tl.set("#hookring", { x: K.HOOK_CUP[0], y: K.HOOK_CUP[1] }, 0);
        tl.set(["#hr1", "#hr2"], { opacity: 0 }, 0);
        ring("#hr1", B.hook_cup, 10, 70); ring("#hr2", B.hook_cup + 0.06, 20, 104, 0.4);
        tl.fromTo("#hr2", { rotation: 0, svgOrigin: "0 0" }, { rotation: 90, duration: 1.5, ease: "none", immediateRender: false }, B.hook_cup);
        flash(B.hook_cup, 0.35); punch(B.hook_cup, 1.03);
        tl.to(["#hr1", "#hr2"], { opacity: 0, duration: 0.1 }, T.walk.start - 0.1);
        tl.to(hk, { opacity: 0, duration: 0.1 }, T.walk.start - 0.1);
        scan(T.walk.start);

        // ---------- PLAN ----------
        light("#s20", B.w_20 + 0.14, B.w_stop + 0.02);
        light("#sstop", B.w_stop + 0.12, B.shot_impact - 0.45);

        // ---------- SHOT ----------
        flash(B.shot_impact, 0.4); punch(B.shot_impact, 1.035);
        scan(T.whip.start + 0.32);

        // ---------- ROLL: tracker ring rides the ball, pink ring pulses at the cup ----------
        const tr = K.TRACK;
        tl.set("#trk", { opacity: 0, x: tr[0][1], y: tr[0][2] }, 0);
        tl.fromTo("#trk", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)", immediateRender: false }, T.roll.start + 0.12);
        for (let i = 1; i < tr.length; i++) {
          tl.to("#trk", { x: tr[i][1], y: tr[i][2], duration: Math.max(0.01, tr[i][0] - tr[i - 1][0]), ease: "none" }, tr[i - 1][0]);
        }
        tl.to("#trk", { opacity: 0, duration: 0.12 }, T.roll.end - 0.12);
        tl.set("#cupring", { x: K.ROLL_CUP[0], y: K.ROLL_CUP[1] }, 0);
        tl.set(["#cr1", "#cr2"], { opacity: 0 }, 0);
        ring("#cr1", B.roll_cup, 10, 52);
        tl.fromTo("#cr2", { attr: { r: 40 }, opacity: 0.9 }, { attr: { r: 150 }, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, B.roll_cup + 0.05);
        tl.to("#cr1", { opacity: 0, duration: 0.2 }, B.roll_cup + 0.9);
        light("#snyaris", B.roll_cup + 0.08, T.replay.start - 0.1);

        // ---------- REPLAY ----------
        scan(T.replay.start);
        light("#rep", T.replay.start + 0.08, T.end_a.start - 0.06);
        flash(B.replay_impact, 0.35); punch(B.replay_impact, 1.05);

        // ---------- END ----------
        flash(T.end_freeze.start, 0.6, true);
        light("#endsign", T.end_freeze.start + 0.02, null);
        const cta = $("#cta"); hide0(cta);
        tl.fromTo(cta, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, T.end_freeze.start + 0.98);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
