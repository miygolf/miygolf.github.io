<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
    @font-face { font-family: "Plus Jakarta Sans"; font-style: normal; font-weight: 600 700; src: url("assets/fonts/PlusJakartaSans-var.woff2") format("woff2"); }
    @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 500; src: url("assets/fonts/Fraunces-Italic-500.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.95" data-width="1080" data-height="1920">
      <!-- Re-cut of the hanger video: dead air removed (wardrobe pan 4.4s→3s, spec shot), 720p→1080p, voice kept on its own track -->
      <video id="v1" class="clip shot" src="assets/video/s1.mp4" data-start="0" data-duration="8.95" data-media-start="0" muted data-track-index="0"></video>
      <video id="v2" class="clip shot" src="assets/video/s2.mp4" data-start="8.95" data-duration="3" data-media-start="0" muted data-track-index="0"></video>
      <video id="v3" class="clip shot" src="assets/video/s3.mp4" data-start="11.95" data-duration="1.45" data-media-start="0" muted data-track-index="0"></video>
      <video id="v4" class="clip shot" src="assets/video/s4.mp4" data-start="13.4" data-duration="2.9" data-media-start="0" muted data-track-index="0"></video>
      <video id="v5" class="clip shot" src="assets/video/s5.mp4" data-start="16.3" data-duration="3.65" data-media-start="0" muted data-track-index="0"></video>

      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="19.95" data-track-index="1" data-track-kind="graphics"></div>
      <div id="broll" class="clip" data-composition-id="broll" data-composition-src="compositions/broll.html" data-start="8.95" data-duration="3" data-track-index="2" data-track-kind="graphics"></div>
      <div id="spec" class="clip" data-composition-id="spec" data-composition-src="compositions/spec.html" data-start="13.4" data-duration="2.9" data-track-index="2" data-track-kind="graphics"></div>
      <div id="cta" class="clip" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="17.42" data-duration="2.53" data-track-index="3" data-track-kind="graphics"></div>

      <audio id="voice" class="clip" src="assets/audio/voice.m4a" data-start="0" data-duration="19.95" data-volume="1" data-track-index="4"></audio>
      <!-- SFX kept well under the voice -->
      <audio id="sfx-sp1" class="clip" src="assets/sfx/sparkle.mp3" data-start="6.1" data-duration="1.2" data-volume="0.22" data-fade-out="0.4" data-track-index="5"></audio>
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.82" data-duration="0.57" data-volume="0.3" data-track-index="6"></audio>
      <audio id="sfx-sp2" class="clip" src="assets/sfx/sparkle.mp3" data-start="9.5" data-duration="1.4" data-volume="0.2" data-fade-out="0.5" data-track-index="5"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="11.84" data-duration="0.57" data-volume="0.28" data-playback-rate="1.1" data-track-index="6"></audio>
      <audio id="sfx-w3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="13.28" data-duration="0.57" data-volume="0.28" data-playback-rate="0.92" data-track-index="7"></audio>
      <audio id="sfx-p0" class="clip" src="assets/sfx/pop.mp3" data-start="13.65" data-duration="0.5" data-volume="0.42" data-track-index="8"></audio>
      <audio id="sfx-p1" class="clip" src="assets/sfx/pop.mp3" data-start="14.55" data-duration="0.5" data-volume="0.42" data-playback-rate="1.1" data-track-index="9"></audio>
      <audio id="sfx-p2" class="clip" src="assets/sfx/pop.mp3" data-start="15.45" data-duration="0.5" data-volume="0.42" data-playback-rate="1.2" data-track-index="8"></audio>
      <audio id="sfx-w4" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="16.18" data-duration="0.57" data-volume="0.28" data-track-index="6"></audio>
      <audio id="sfx-chime" class="clip" src="assets/sfx/chime.mp3" data-start="17.42" data-duration="2.5" data-volume="0.16" data-fade-out="0.8" data-track-index="10"></audio>
      <audio id="sfx-click" class="clip" src="assets/sfx/click-soft.mp3" data-start="17.74" data-duration="0.36" data-volume="0.5" data-track-index="11"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // slow push-in on the talking shot, small punch-in on every cut
      tl.fromTo("#v1", { scale: 1 }, { scale: 1.05, duration: 8.95, ease: "none" }, 0);
      [["#v2", 8.95], ["#v3", 11.95], ["#v4", 13.4], ["#v5", 16.3]].forEach(([id, t]) => {
        tl.fromTo(id, { scale: 1.07 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, t);
      });
      tl.fromTo("#v2", { y: 0 }, { y: -20, duration: 2.6, ease: "none", immediateRender: false }, 9.35);
      tl.set({}, {}, 19.95);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
