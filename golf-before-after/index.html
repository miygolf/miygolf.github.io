    <script>
      // Root timeline: camera punch-ins on the footage wrappers (never on the timed <video>).
      const tl = gsap.timeline({ paused: true });

      // Cold open: punch toward the ball on the strike (1.04 s)
      gsap.set("#cam-hook", { transformOrigin: "72% 80%" });
      tl.fromTo("#cam-hook", { scale: 1.04 }, { scale: 1.0, duration: 1.0, ease: "power2.out" }, 0);
      tl.to("#cam-hook", { scale: 1.1, duration: 0.12, ease: "power3.out" }, 1.02);
      tl.to("#cam-hook", { scale: 1.07, duration: 0.45, ease: "power2.out" }, 1.14);

      // BEFORE swing: a slow, honest look — tiny drift only
      gsap.set("#cam-before", { transformOrigin: "45% 50%" });
      tl.fromTo("#cam-before", { scale: 1.0 }, { scale: 1.04, duration: 1.9, ease: "none" }, 4.0);

      // AFTER: punch-in on the strike (8.97 s)
      gsap.set("#cam-after", { transformOrigin: "72% 81%" });
      tl.fromTo("#cam-after", { scale: 1.0 }, { scale: 1.0, duration: 0.01 }, 6.0);
      tl.to("#cam-after", { scale: 1.09, duration: 0.12, ease: "power3.out" }, 8.95);
      tl.to("#cam-after", { scale: 1.05, duration: 0.5, ease: "power2.out" }, 9.07);

      // Replay panels slide in from opposite sides, then the AFTER panel takes the win
      tl.fromTo("#pw-before", { x: -560, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 9.62);
      tl.fromTo("#pw-after", { x: 560, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 9.68);
      tl.to("#pw-before", { opacity: 0.5, scale: 0.97, duration: 0.4, ease: "power2.out" }, 13.95);
      tl.to("#pw-after", { scale: 1.03, duration: 0.45, ease: "expo.out" }, 13.95);
      tl.to(["#pw-before", "#pw-after"], { opacity: 0, duration: 0.2, ease: "power3.in" }, 15.35);

      // Outro: hold steady (title carries the motion)
      gsap.set("#cam-outro", { transformOrigin: "40% 40%" });
      tl.fromTo("#cam-outro", { scale: 1.08 }, { scale: 1.0, duration: 0.7, ease: "expo.out" }, 15.5);
      tl.fromTo("#rep-bg", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 9.62);
