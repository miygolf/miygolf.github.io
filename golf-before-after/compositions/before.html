  <div id="root" data-composition-id="before" data-width="1080" data-height="1920">
    <div id="bf-scrim" class="clip" data-start="0" data-duration="4.2" data-layout-ignore></div>

    <div id="bf-tags" class="clip bf-tagrow" data-start="0" data-duration="4.2">
      <div id="bf-tag" class="bf-tag"><span class="rec"></span><span>BEFORE</span></div>
      <div id="bf-ff" class="bf-tag"><span>▶▶ 3.6×</span></div>

    <div id="bf-head" class="clip" data-start="0" data-duration="2.6">
      <span class="w">OVERTHINK</span><br />
      <span class="w dim">ATAS</span><span class="w dim">BOLA…</span>

    <div id="bf-watch" class="clip" data-start="0" data-duration="4.2">
      <div class="lbl">MASA ATAS BOLA</div>
      <div id="bf-digits">0.2s</div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Tags + headline: per-word blur-in
    tl.fromTo("#bf-tags", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 0.02);
    tl.fromTo(
      "#bf-head .w",
      { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.09 },
      0.14,
    );
    tl.fromTo("#bf-watch", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.22);

    // Stopwatch: source seconds over the ball (FF ×3.65 until 2.40, then real time to takeaway at 9.1 s)
    const digits = document.getElementById("bf-digits");
    const counter = { t: 0 };
    tl.fromTo(
      counter,
      { t: 0 },
      {
        t: 4.2,
        duration: 4.2,
        ease: "none",
        onUpdate: () => {
          const t = counter.t;
          let v = t <= 2.4 ? 0.2 + t * 3.65 : 8.96 + (t - 2.4);
          v = Math.min(v, 9.1);
          digits.textContent = v.toFixed(1) + "s";
        },
      },
      0,
    );

    // FF chip leaves when real time resumes
    tl.to("#bf-ff", { opacity: 0, x: -20, duration: 0.15, ease: "power3.in" }, 2.38);

    // Takeaway (local 2.50): watch stops — border snaps red, note drops in
    tl.to("#bf-watch", { borderColor: "rgba(255,68,56,1)", duration: 0.08, ease: "none" }, 2.48);
    tl.fromTo("#bf-digits", { scale: 1 }, { scale: 1.07, duration: 0.08, ease: "power3.out", transformOrigin: "0% 50%" }, 2.48);
    tl.to("#bf-digits", { scale: 1, duration: 0.3, ease: "power2.out" }, 2.56);
    tl.fromTo("#bf-note", { opacity: 0, y: -16, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 2.52);

    // Headline clears before the head rises into the backswing
    tl.to("#bf-head .w", { opacity: 0, filter: "blur(8px)", duration: 0.14, ease: "power3.in", stagger: 0.03 }, 2.3);
    tl.to("#bf-scrim", { opacity: 0.4, duration: 0.3, ease: "power2.out" }, 2.55);

    window.__timelines["before"] = tl;
  </script>
