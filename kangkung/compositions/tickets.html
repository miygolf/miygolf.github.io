    const tl = gsap.timeline({ paused: true });

    // Slot: drops in before the first ticket, hides for the plate hero, returns for the CTA.

    tl.to("#tk-slot-bar", { y: -60, opacity: 0, duration: 0.2, ease: "power3.in" }, 24.35);
    tl.to("#tk-slot-bar", { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 30.4);

    // Each ticket prints in mechanical steps, then is torn off to the left.

      ["#tk1", 3.35, 8.41],
      ["#tk2", 8.5, 12.03],
      ["#tk3", 12.17, 15.71],
      ["#tk4", 15.8, 18.78],
      ["#tk5", 18.92, 22.64],
      ["#tk6", 22.72, 24.41],
    ];
    tickets.forEach(([sel, inT, outT]) => {
      tl.fromTo(`${sel} .tk`, { yPercent: -101, rotation: 0 },
        { yPercent: 0, duration: 0.85, ease: "steps(9)" }, inT);
      tl.to(`${sel} .tk`, { rotation: -1.4, duration: 0.5, ease: "power2.out" }, inT + 0.85);
      tl.to(`${sel} .tk`, { x: -720, y: 90, rotation: -14, duration: 0.3, ease: "power3.in" }, outT - 0.22);
    });
    // CTA ticket stays.
    tl.fromTo("#tk7 .tk", { yPercent: -101 }, { yPercent: 0, duration: 0.95, ease: "steps(10)" }, 30.64);
