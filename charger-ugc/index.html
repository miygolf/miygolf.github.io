<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="29.97" data-width="1080" data-height="1920">
      <!-- UGC AD (no voice): clips muted, cut to masalah > cuba > hasil > CTA; jump cuts alternate framing; leave room for a platform sound -->
      <video id="vs01" class="clip shot" src="assets/video/s01.mp4" data-start="0" data-duration="4.55" data-media-start="0" muted data-track-index="0"></video>
      <video id="vs02" class="clip shot" src="assets/video/s02.mp4" data-start="4.55" data-duration="4.92" data-media-start="0" muted data-track-index="0"></video>
      <video id="vs04" class="clip shot" src="assets/video/s04.mp4" data-start="13.07" data-duration="3.83" data-media-start="0" muted data-track-index="0"></video>
      <video id="vs05" class="clip shot" src="assets/video/s05.mp4" data-start="16.9" data-duration="1.04" data-media-start="0" muted data-track-index="0"></video>
      <video id="vs06" class="clip shot" src="assets/video/s06.mp4" data-start="17.94" data-duration="1.15" data-media-start="0" muted data-track-index="0"></video>
      <video id="vs07" class="clip shot" src="assets/video/s07.mp4" data-start="19.09" data-duration="4.44" data-media-start="0" muted data-track-index="0"></video>
      <video id="vs08" class="clip shot" src="assets/video/s08.mp4" data-start="23.53" data-duration="2.06" data-media-start="0" muted data-track-index="0"></video>
      <video id="vs09" class="clip shot" src="assets/video/s09.mp4" data-start="25.59" data-duration="2.6" data-media-start="0" muted data-track-index="0"></video>
      <video id="vs10" class="clip shot" src="assets/video/s10.mp4" data-start="28.19" data-duration="1.78" data-media-start="0" muted data-track-index="0"></video>

      <!-- OVERLAYS: big word-by-word captions, keywords yellow; one small hook line -->
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.55" data-track-index="2" data-track-kind="graphics"></div>
      <div id="spec" class="clip" data-composition-id="spec" data-composition-src="compositions/spec.html" data-start="9.47" data-duration="3.6" data-track-index="2" data-track-kind="graphics"></div>
      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="29.97" data-track-index="1" data-track-kind="captions"></div>

      <!-- SFX (no voice): quiet ticks on the spec list, plug click, CTA pop -->
      <audio id="sfx-spec" class="clip" src="assets/sfx/whoosh.mp3" data-start="9.44" data-duration="0.57" data-volume="0.3" data-track-index="5"></audio>
      <audio id="sfx-sp0" class="clip" src="assets/sfx/key-press.mp3" data-start="9.83" data-duration="0.4" data-volume="1.2" data-track-index="6"></audio>
      <audio id="sfx-sp1" class="clip" src="assets/sfx/key-press.mp3" data-start="10.17" data-duration="0.4" data-volume="1.2" data-track-index="7"></audio>
      <audio id="sfx-sp2" class="clip" src="assets/sfx/key-press.mp3" data-start="10.51" data-duration="0.4" data-volume="1.2" data-track-index="6"></audio>
      <audio id="sfx-sp3" class="clip" src="assets/sfx/key-press.mp3" data-start="10.85" data-duration="0.4" data-volume="1.2" data-track-index="7"></audio>
      <audio id="sfx-sp4" class="clip" src="assets/sfx/key-press.mp3" data-start="11.19" data-duration="0.4" data-volume="1.2" data-track-index="6"></audio>
      <audio id="sfx-plug" class="clip" src="assets/sfx/click-soft.mp3" data-start="17.14" data-duration="0.37" data-volume="0.4" data-track-index="8"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/pop.mp3" data-start="28.91" data-duration="0.5" data-volume="0.35" data-track-index="9"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
