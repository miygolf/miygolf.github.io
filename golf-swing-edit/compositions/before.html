  <script>
    const tl = gsap.timeline({ paused: true });
    // Swing phases measured from the footage (seconds, local to this scene)
    const T = { takeaway: 0.3, top: 1.2, impact: 2.1, finish: 2.8 };
    const SLOW = [1.5, 2.5];
    const ON = "#f4f1ea";
    const OFF = "rgba(244, 241, 234, 0.72)";

    tl.fromTo("#bf-word", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 0);
    tl.fromTo("#bf-chips", { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.05);
    tl.fromTo("#bf-phases", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.12);

    // Phase strip: each bar fills over its phase, its label lights while it is current
    const phases = [
      ["#bf-f1", "#bf-l1", 0, T.takeaway],
      ["#bf-f2", "#bf-l2", T.takeaway, T.top],
      ["#bf-f3", "#bf-l3", T.top, T.impact],
      ["#bf-f4", "#bf-l4", T.impact, T.finish],
    ];
    phases.forEach(([fill, label, a, b]) => {
      tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: b - a, ease: "none" }, a);
      tl.fromTo(label, { color: OFF }, { color: ON, duration: 0.08, ease: "none" }, a);
    });
    tl.to(["#bf-l1", "#bf-l2", "#bf-l3"], { color: OFF, duration: 0.08, ease: "none", stagger: 0 }, T.finish + 0.01);
    tl.set("#bf-l1", { color: OFF }, T.takeaway);
    tl.set("#bf-l2", { color: OFF }, T.top);
    tl.set("#bf-l3", { color: OFF }, T.impact);

    // Slow-motion window
    tl.fromTo("#bf-rate", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, SLOW[0]);
    tl.to("#bf-rate", { opacity: 0, duration: 0.15, ease: "power2.in" }, SLOW[1] - 0.15);

    // Impact
    tl.fromTo("#bf-flash", { opacity: 0 }, { opacity: 0.3, duration: 0.04, ease: "none" }, T.impact);
    tl.to("#bf-flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, T.impact + 0.04);
    tl.fromTo("#bf-ring1", { scale: 0.15, opacity: 1 }, { scale: 1.9, opacity: 0, duration: 0.7, ease: "expo.out" }, T.impact);
    tl.fromTo("#bf-ring2", { scale: 0.1, opacity: 0.9 }, { scale: 1.3, opacity: 0, duration: 0.55, ease: "expo.out" }, T.impact + 0.06);
    tl.fromTo("#bf-tag", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2.5)" }, T.impact + 0.05);
    tl.to("#bf-tag", { opacity: 0, duration: 0.2, ease: "power2.in" }, T.impact + 0.9);

    

    tl.fromTo("#bf-wipe", { yPercent: 100 }, { yPercent: 0, duration: 0.24, ease: "power3.in" }, 2.86);
    window.__timelines["before"] = tl;
  </script>
