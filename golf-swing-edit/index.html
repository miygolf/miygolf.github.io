<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"hookLine1","type":"string","label":"Hook line 1","default":"SATU ADJUSTMENT."},
    {"id":"hookLine2","type":"string","label":"Hook line 2","default":"TENGOK BEZA DIA."},
    {"id":"brandTag","type":"string","label":"Brand tag","default":"MIY GOLF · SWING LAB"},
    {"id":"ctaLine","type":"string","label":"End question","default":"NAMPAK BEZA?"},
    {"id":"ctaSub","type":"string","label":"End prompt","default":"Komen apa yang berubah ↓"},
    {"id":"signal","type":"color","label":"Signal colour","default":"#D4FF3A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0d0b;
        --ink: #f4f1ea;
        --signal: #d4ff3a;
        --muted: #a7aea9;
        --font-display: "League Gothic", sans-serif;
        --font-data: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }
      .footage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13.4"
      data-width="1080"
      data-height="1920"
    >
      <!-- Footage: hook (after, slow-mo) → before → after. Stills for the end live in the end scene. -->
      <video
        id="hook-video"
        class="clip footage"
        src="assets/footage/hook.mp4"
        data-start="0"
        data-duration="2.1"
        data-track-index="0"
        muted
        playsinline
        style="z-index: 1"
        data-color-grading='{"adjust":{"exposure":0.05,"contrast":0.08,"shadows":0.3,"vibrance":0.25,"temperature":0.05}}'
      ></video>
      <video
        id="before-video"
        class="clip footage"
        src="assets/footage/swing1.mp4"
        data-start="2.1"
        data-duration="3.1"
        data-track-index="0"
        muted
        playsinline
        style="z-index: 2"
        data-color-grading='{"adjust":{"contrast":0.1,"shadows":0.2,"saturation":-0.8,"temperature":-0.08}}'
      ></video>
      <video
        id="after-video"
        class="clip footage"
        src="assets/footage/swing2.mp4"
        data-start="5.2"
        data-duration="4.867"
        data-track-index="0"
        muted
        playsinline
        style="z-index: 3"
        data-color-grading='{"adjust":{"exposure":0.05,"contrast":0.08,"shadows":0.3,"vibrance":0.25,"temperature":0.05}}'
      ></video>

      <!-- Graphics scenes (transparent roots, laid over the footage) -->
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.1"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 10"
      ></div>
      <div
        id="before"
        data-composition-id="before"
        data-composition-src="compositions/before.html"
        data-start="2.1"
        data-duration="3.1"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 11"
      ></div>
      <div
        id="after"
        data-composition-id="after"
        data-composition-src="compositions/after.html"
        data-start="5.2"
        data-duration="4.867"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 12"
      ></div>
      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="10.067"
        data-duration="3.333"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 13"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="13.4"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 20"
      ></div>

      <!-- Sound: the range's own ambience, a music bed ducked under the spoken "Nice.", and SFX on visible hits -->
      <audio
        id="amb-before"
        class="clip"
        src="assets/footage/amb_swing1.wav"
        data-start="2.1"
        data-duration="3.1"
        data-track-index="3"
        data-volume="0.9"
      ></audio>
      <audio
        id="amb-after"
        class="clip"
        src="assets/footage/amb_swing2.wav"
        data-start="5.2"
        data-duration="4.867"
        data-track-index="3"
        data-volume="1"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;highpass&quot;,&quot;id&quot;:&quot;n1&quot;,&quot;label&quot;:&quot;Remove wind rumble&quot;,&quot;params&quot;:{&quot;frequency&quot;:120}},{&quot;type&quot;:&quot;peaking&quot;,&quot;id&quot;:&quot;n2&quot;,&quot;label&quot;:&quot;Voice clarity&quot;,&quot;params&quot;:{&quot;frequency&quot;:3000,&quot;gain&quot;:3,&quot;q&quot;:1}},{&quot;type&quot;:&quot;limiter&quot;,&quot;id&quot;:&quot;n3&quot;,&quot;params&quot;:{&quot;limit&quot;:-1}}]}"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1.2},{"t":3.48,"v":1.2},{"t":3.55,"v":3.2},{"t":4.1,"v":3.2},{"t":4.25,"v":1.2}]}]}'
      ></audio>
      <audio
        id="music"
        class="clip"
        src="assets/bgm/bed.wav"
        data-start="0"
        data-duration="13.4"
        data-track-index="4"
        data-volume="1"
        data-fade-out="1.2"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.85},{"t":8.55,"v":0.85},{"t":8.7,"v":0.25},{"t":9.35,"v":0.25},{"t":9.6,"v":0.85}]}]}'
      ></audio>

      <audio id="sfx-hook-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="1.11" data-duration="2.1" data-track-index="5" data-volume="0.8"></audio>
      <audio id="sfx-cut-before" class="clip" src="assets/sfx/whoosh.mp3" data-start="1.97" data-duration="0.57" data-track-index="6" data-volume="0.55"></audio>
      <audio id="sfx-tick-b-top" class="clip" src="assets/sfx/click-soft.mp3" data-start="3.26" data-duration="0.36" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-before-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="4.16" data-duration="1.0" data-track-index="5" data-volume="0.4" data-fade-out="0.4"></audio>
      <audio id="sfx-tick-b-fin" class="clip" src="assets/sfx/click-soft.mp3" data-start="4.66" data-duration="0.36" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-to-after" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="2.73" data-duration="3.4" data-track-index="8" data-volume="0.45" data-fade-out="0.6"></audio>
      <audio id="sfx-after-hit" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="5.497" data-duration="2.59" data-track-index="9" data-volume="0.85"></audio>
      <audio id="sfx-tick-a-top" class="clip" src="assets/sfx/click-soft.mp3" data-start="6.61" data-duration="0.36" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-after-stamp" class="clip" src="assets/sfx/pop.mp3" data-start="7.47" data-duration="0.72" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-tick-a-fin" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.16" data-duration="0.36" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-to-end" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="9.94" data-duration="0.57" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-end-label" class="clip" src="assets/sfx/pop.mp3" data-start="10.42" data-duration="0.72" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-end-cta" class="clip" src="assets/sfx/ping.mp3" data-start="10.78" data-duration="1.32" data-track-index="8" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
