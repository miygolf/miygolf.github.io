<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Band title","default":"Weight shift."},
    {"id":"ctaLine","type":"string","label":"End question","default":"Nampak beza?"},
    {"id":"ctaSub","type":"string","label":"End prompt","default":"KOMEN KALAU NAK TIPS ↓"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f2ede3;
        --ink: #1b1a17;
        --clay: #c8553d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--paper);
      }
      /* Two prints on paper: BEFORE above the band, AFTER below. Footage is shown at 0.889x so the
         whole golfer fits; each print crops its source to the golfer's vertical range. */
      .print {
        position: absolute;
        left: 60px;
        width: 960px;
        height: 820px;
        overflow: hidden;
        background: #1b1a17;
      }
      #print-top {
        top: 40px;
      }
      #print-bottom {
        top: 1060px;
      }
      .win-top,
      .win-bottom {
        position: absolute;
        left: 0;
        width: 960px;
        height: 1707px;
      }
      .win-top {
        top: -418px;
      }
      .win-bottom {
        top: -382px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10.6"
      data-width="1080"
      data-height="1920"
    >
      <!-- Synced play (both impacts land at 2.10 s), then freeze frames: top, impact, finish -->
      <div id="print-top" class="print">
        <video id="sync-before" class="clip win-top" src="assets/footage/swing1.mp4" data-start="0" data-duration="3.1" data-track-index="0" muted playsinline style="z-index: 1"
          data-color-grading='{"adjust":{"contrast":0.06,"shadows":0.15,"saturation":-0.55,"temperature":0.06}}'></video>
        <img id="fz-top-before" class="clip win-top" src="assets/stills/top1.jpg" alt="Before, top of swing" data-start="3.1" data-duration="1.5" data-track-index="0" style="z-index: 2"
          data-color-grading='{"adjust":{"contrast":0.06,"shadows":0.15,"saturation":-0.55,"temperature":0.06}}' />
        <img id="fz-imp-before" class="clip win-top" src="assets/stills/impact1.jpg" alt="Before, impact" data-start="4.6" data-duration="1.8" data-track-index="0" style="z-index: 3"
          data-color-grading='{"adjust":{"contrast":0.06,"shadows":0.15,"saturation":-0.55,"temperature":0.06}}' />
        <img id="fz-fin-before" class="clip win-top" src="assets/stills/finish1b.jpg" alt="Before, finish" data-start="6.4" data-duration="4.2" data-track-index="0" style="z-index: 4"
          data-color-grading='{"adjust":{"contrast":0.06,"shadows":0.15,"saturation":-0.55,"temperature":0.06}}' />
      </div>
      <div id="print-bottom" class="print">
        <video id="sync-after" class="clip win-bottom" src="assets/footage/swing2.mp4" data-start="0" data-duration="3.1" data-media-start="0.15" data-track-index="2" muted playsinline style="z-index: 1"
          data-color-grading='{"adjust":{"contrast":0.06,"shadows":0.28,"vibrance":0.18,"temperature":0.08}}'></video>
        <img id="fz-top-after" class="clip win-bottom" src="assets/stills/top2.jpg" alt="After, top of swing" data-start="3.1" data-duration="1.5" data-track-index="2" style="z-index: 2"
          data-color-grading='{"adjust":{"contrast":0.06,"shadows":0.28,"vibrance":0.18,"temperature":0.08}}' />
        <img id="fz-imp-after" class="clip win-bottom" src="assets/stills/impact2.jpg" alt="After, impact" data-start="4.6" data-duration="1.8" data-track-index="2" style="z-index: 3"
          data-color-grading='{"adjust":{"contrast":0.06,"shadows":0.28,"vibrance":0.18,"temperature":0.08}}' />
        <img id="fz-fin-after" class="clip win-bottom" src="assets/stills/finish2b.jpg" alt="After, finish" data-start="6.4" data-duration="4.2" data-track-index="2" style="z-index: 4"
          data-color-grading='{"adjust":{"contrast":0.06,"shadows":0.28,"vibrance":0.18,"temperature":0.08}}' />
      </div>

      <div
        id="band"
        data-composition-id="band"
        data-composition-src="compositions/band.html"
        data-start="0"
        data-duration="10.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 10"
      ></div>

      <audio id="music" class="clip" src="assets/bgm/music_full.wav" data-start="0" data-duration="10.6" data-media-start="3.937" data-track-index="3" data-volume="0.9" data-fade-in="0.2" data-fade-out="1.2"></audio>
      <audio id="amb" class="clip" src="assets/footage/amb_swing1.wav" data-start="0" data-duration="3.1" data-track-index="4" data-volume="0.6" data-fade-out="0.3"></audio>
      <audio id="sfx-sync-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.06" data-duration="1.0" data-track-index="5" data-volume="0.6" data-fade-out="0.4"></audio>
      <audio id="sfx-fz-top" class="clip" src="assets/sfx/click.mp3" data-start="3.06" data-duration="0.37" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-fz-top-sw" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.97" data-duration="0.57" data-track-index="7" data-volume="0.4"></audio>
      <audio id="sfx-fz-imp" class="clip" src="assets/sfx/click.mp3" data-start="4.56" data-duration="0.37" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-fz-imp-hit" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="2.647" data-duration="2.59" data-track-index="8" data-volume="0.75"></audio>
      <audio id="sfx-fz-fin" class="clip" src="assets/sfx/click.mp3" data-start="6.36" data-duration="0.37" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-fz-fin-sw" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.27" data-duration="0.57" data-track-index="7" data-volume="0.4"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/ping.mp3" data-start="7.28" data-duration="1.32" data-track-index="5" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
