  <script>
    const tl = gsap.timeline({ paused: true });
    const IMPACT = 2.1;
    const FZ = [3.1, 4.6, 6.4];

    // Frame 0 already reads: both windows, the band and its title. Rules draw in.
    tl.fromTo(["#bd-rule-a", "#bd-rule-b"], { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out", stagger: 0.08 }, 0.05);
    tl.fromTo("#bd-title-main", { scale: 1.06 }, { scale: 1, duration: 0.8, ease: "power3.out" }, 0);

    // Synced impact
    tl.fromTo([".bd-flash"], { opacity: 0 }, { opacity: 0.5, duration: 0.04, ease: "none" }, IMPACT);
    tl.to([".bd-flash"], { opacity: 0, duration: 0.25, ease: "power2.out" }, IMPACT + 0.04);
    tl.fromTo([".bd-ring"], { scale: 0.2, opacity: 1 }, { scale: 1.8, opacity: 0, duration: 0.7, ease: "expo.out" }, IMPACT);

    // Freeze frames: a photo-snap flash on both windows, the band title swaps
    const titles = ["#bd-title-main", "#bd-title-top", "#bd-title-imp", "#bd-title-fin"];
    FZ.forEach((t, i) => {
      tl.fromTo([".bd-flash"], { opacity: 0 }, { opacity: 0.85, duration: 0.03, ease: "none" }, t);
      tl.to([".bd-flash"], { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.03);
      tl.to(titles[i], { y: -24, opacity: 0, duration: 0.16, ease: "power2.in" }, t - 0.12);
      tl.fromTo(titles[i + 1], { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, t + 0.04);
    });

    // Impact freeze names the adjustment on the AFTER window
    tl.fromTo("#bd-tag-shift", { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, FZ[1] + 0.15);

    // End: the band carries the question

    tl.fromTo("#bd-cta", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 7.32);
    tl.fromTo("#bd-cta-title", { scale: 1 }, { scale: 1.04, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 7.8);
    window.__timelines["band"] = tl;
