<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0d0d0d;
        --tape: #f2eee6;
        --ink: #121212;
        --signal: #ff5a1f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <!-- FOOTAGE (muted: source audio is room tone only) -->
      <video id="v-hook" class="clip shot" src="assets/video/0246.mp4" data-start="0" data-duration="2.4" data-media-start="2.6" muted data-track-index="0"></video>
      <!-- one continuous camera move: product reveal, then the bag leaves frame and the empty bed carries the spec card -->
      <video id="v-bed" class="clip shot" src="assets/video/0245.mp4" data-start="2.4" data-duration="7" data-media-start="1.7" muted data-track-index="0"></video>
      <video id="v-logo" class="clip shot" src="assets/video/0256.mp4" data-start="12.6" data-duration="0.8" data-media-start="0" muted data-track-index="0"></video>
      <video id="v-duo" class="clip shot" src="assets/video/0249.mp4" data-start="13.4" data-duration="3.4" data-media-start="0.6" muted data-track-index="0"></video>

      <!-- SCENES (graphics) -->
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2.4" data-track-index="2" data-track-kind="graphics"></div>
      <div id="detail" class="clip" data-composition-id="detail" data-composition-src="compositions/detail.html" data-start="2.4" data-duration="4" data-track-index="2" data-track-kind="graphics"></div>
      <div id="spec" class="clip" data-composition-id="spec" data-composition-src="compositions/spec.html" data-start="6.4" data-duration="3" data-track-index="2" data-track-kind="graphics"></div>
      <!-- interior: official Ulanzi product images (see assets/img/CREDITS.md) -->
      <div id="inside" class="clip" data-composition-id="inside" data-composition-src="compositions/inside.html" data-start="9.4" data-duration="3.2" data-track-index="1" data-track-kind="graphics"></div>
      <div id="focus" class="clip" data-composition-id="focus" data-composition-src="compositions/focus.html" data-start="12.6" data-duration="0.8" data-track-index="2" data-track-kind="graphics"></div>
      <div id="duo" class="clip" data-composition-id="duo" data-composition-src="compositions/duo.html" data-start="13.4" data-duration="3.4" data-track-index="2" data-track-kind="graphics"></div>
      <div id="cta" class="clip" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="16.8" data-duration="3.2" data-track-index="1" data-track-kind="graphics"></div>

      <!-- persistent viewfinder frame + shot counter -->
      <div id="frame" class="clip" data-composition-id="frame" data-composition-src="compositions/frame.html" data-start="0" data-duration="20" data-track-index="3" data-track-kind="graphics"></div>

      <!-- SOUND: each hit placed so its measured peak lands ~1 frame after the picture; repeated whooshes rotate pitch via playback rate -->
      <audio id="sfx-hook" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="2.1" data-volume="0.2" data-fade-out="0.8" data-track-index="5"></audio>
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.37" data-duration="0.57" data-volume="0.45" data-track-index="6"></audio>
      <audio id="sfx-tag1" class="clip" src="assets/sfx/pop.mp3" data-start="2.91" data-duration="0.5" data-volume="0.5" data-track-index="7"></audio>
      <audio id="sfx-tag2" class="clip" src="assets/sfx/click-soft.mp3" data-start="4.84" data-duration="0.37" data-volume="0.7" data-track-index="7"></audio>
      <audio id="sfx-tag3" class="clip" src="assets/sfx/click-soft.mp3" data-start="5.14" data-duration="0.37" data-volume="0.55" data-track-index="8"></audio>
      <audio id="sfx-panel" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.91" data-duration="0.67" data-playback-rate="0.85" data-volume="0.28" data-track-index="6"></audio>
      <audio id="sfx-5l" class="clip" src="assets/sfx/pop.mp3" data-start="7.26" data-duration="0.5" data-volume="0.5" data-track-index="7"></audio>
      <audio id="sfx-row1" class="clip" src="assets/sfx/key-press.mp3" data-start="7.66" data-duration="0.4" data-volume="1.6" data-track-index="8"></audio>
      <audio id="sfx-row2" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.89" data-duration="0.37" data-volume="0.35" data-track-index="9"></audio>
      <audio id="sfx-row3" class="clip" src="assets/sfx/key-press.mp3" data-start="8.06" data-duration="0.4" data-volume="1.6" data-track-index="8"></audio>
      <audio id="sfx-row4" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.29" data-duration="0.37" data-volume="0.35" data-track-index="9"></audio>
      <audio id="sfx-cut2" class="clip" src="assets/sfx/whoosh.mp3" data-start="9.38" data-duration="0.5" data-playback-rate="1.15" data-volume="0.4" data-track-index="6"></audio>
      <audio id="sfx-card1" class="clip" src="assets/sfx/click-soft.mp3" data-start="9.70" data-duration="0.37" data-volume="0.5" data-track-index="7"></audio>
      <audio id="sfx-card2" class="clip" src="assets/sfx/pop.mp3" data-start="10.36" data-duration="0.5" data-volume="0.42" data-track-index="8"></audio>
      <audio id="sfx-card3" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.20" data-duration="0.37" data-volume="0.5" data-track-index="7"></audio>
      <audio id="sfx-focus" class="clip" src="assets/sfx/click.mp3" data-start="12.67" data-duration="0.37" data-volume="0.9" data-track-index="6"></audio>
      <audio id="sfx-cut3" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.37" data-duration="0.57" data-volume="0.35" data-track-index="7"></audio>
      <audio id="sfx-duo" class="clip" src="assets/sfx/pop.mp3" data-start="14.65" data-duration="0.5" data-volume="0.45" data-track-index="8"></audio>
      <audio id="sfx-strap" class="clip" src="assets/sfx/click-soft.mp3" data-start="15.29" data-duration="0.37" data-volume="0.5" data-track-index="9"></audio>
      <audio id="sfx-swell" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="14.38" data-duration="3.2" data-volume="0.28" data-fade-in="0.6" data-fade-out="0.9" data-track-index="10"></audio>
      <audio id="sfx-payoff" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="16.79" data-duration="2.1" data-volume="0.22" data-fade-out="1" data-track-index="5"></audio>
      <audio id="sfx-shine" class="clip" src="assets/sfx/sparkle.mp3" data-start="17.66" data-duration="1.6" data-volume="0.18" data-fade-out="0.6" data-track-index="6"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
