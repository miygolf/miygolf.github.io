    });
    tl.fromTo("#res-word", { scale: 1.6, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.2, ease: "expo.out" }, 49.33);
    tl.fromTo("#res-sub", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.3, ease: "expo.out" }, 49.49);
    tl.to("#res-stamp > *", { opacity: 0, y: -14, filter: "blur(6px)", duration: 0.14, stagger: 0.03, ease: "power2.in" }, 50.66);

    // impact flashes
    ["#flash-0", "#flash-1", "#flash-2", "#flash-3", "#flash-p7"].forEach((sel) => {
      const s = parseFloat(document.querySelector(sel).dataset.start);
      tl.fromTo(sel, { opacity: 0 }, { opacity: 0.4, duration: 0.05, ease: "none" }, s + 0.08);
      tl.to(sel, { opacity: 0, duration: 0.22, ease: "power2.out" }, s + 0.13);
    });

    // shift meters: ball travels KANAN -> KIRI, landing on the word "kiri"
    const meter = (sel, s, land, e) => {
      tl.fromTo(sel + " .meter-panel", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.22, ease: "expo.out" }, s);
      tl.fromTo(sel + " .meter-head, " + sel + " .meter-lbl, " + sel + " .meter-track", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.18, stagger: 0.04, ease: "power3.out" }, s + 0.08);
      tl.fromTo(sel + " .meter-ball", { x: 0 }, { x: 400, duration: land - s - 0.3, ease: "power3.inOut" }, s + 0.3);
      tl.fromTo(sel + " .meter-fill", { scaleX: 0 }, { scaleX: 1, duration: land - s - 0.3, ease: "power3.inOut" }, s + 0.3);
      tl.fromTo(sel + " .meter-lbl.r", { color: "#f6eedd", scale: 1 }, { color: "#ff5b24", scale: 1.15, duration: 0.16, ease: "back.out(2)" }, land);
      tl.to(sel + " > *", { opacity: 0, y: -10, duration: 0.14, ease: "power2.in" }, e - 0.15);
    };
    meter("#meter-1", 12.54, 14.52, 14.97);
    meter("#meter-2", 34.38, 35.34, 35.88);

    // hands-on stamp
    tl.fromTo("#stamp-box", { scale: 1.7, rotation: -14, opacity: 0 }, { scale: 1, rotation: -5, opacity: 1, duration: 0.18, ease: "expo.out" }, 14.97);
    tl.fromTo("#stamp-box", { x: 0 }, { x: 6, duration: 0.04, yoyo: true, repeat: 3, ease: "none" }, 15.03);
    tl.fromTo("#stamp-sub", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.3, ease: "expo.out" }, 15.09);
    tl.to("#stamp > *", { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.16, stagger: 0.03, ease: "power2.in" }, 21.07);

    // swing rep labels
    const rep = (sel, s, e) => {
      tl.fromTo(sel + " .rep-big", { opacity: 0, scaleX: 1.35, filter: "blur(8px)" }, { opacity: 1, scaleX: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, s);
      tl.fromTo(sel + " .rep-sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, s + 0.18);
      tl.to(sel + " > *", { opacity: 0, y: -12, filter: "blur(6px)", duration: 0.15, stagger: 0.03, ease: "power2.in" }, e - 0.2);
    };
    rep("#rep-0", 6.13, 9.40);
    rep("#rep-1", 28.26, 31.27);
    rep("#rep-2", 36.93, 39.85);

    // low-point arc: draw, then the ball lingers through the bottom
    const hot = document.querySelector("#arc-hot");
    const base = document.querySelector("#arc-base");
    const L = hot.getTotalLength();
    const seg = L * 0.3;
    hot.setAttribute("stroke-dasharray", seg + " " + L);
    tl.fromTo(base, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 40.56);
    tl.fromTo(hot, { strokeDashoffset: seg }, { strokeDashoffset: -L * 0.35, duration: 0.45, ease: "power3.out" }, 40.62);
    const ball = document.querySelector("#arc-ball");
    const p = { v: 0 };
    const place = () => {
      const pt = hot.getPointAtLength(p.v * L);
      ball.setAttribute("cx", pt.x);
      ball.setAttribute("cy", pt.y);
    };
    tl.fromTo(p, { v: 0 }, { v: 0.36, duration: 0.3, ease: "power1.in", onUpdate: place, immediateRender: false }, 40.62);
    tl.to(p, { v: 0.64, duration: 0.95, ease: "none", onUpdate: place }, 40.92);
    tl.to(p, { v: 1, duration: 0.28, ease: "power2.in", onUpdate: place }, 41.87);
    tl.fromTo("#arc-label", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 40.80);
    tl.to("#arc > *", { opacity: 0, duration: 0.15, ease: "power2.in" }, 42.08);
    place();

    window.__timelines["fx"] = tl;
  </script>
</template>
