  <script>
    const tl = gsap.timeline({ paused: true });
    document.querySelectorAll("#root .cap").forEach((g) => {
      const s = parseFloat(g.dataset.start);
      const e = s + parseFloat(g.dataset.duration);
      const lines = g.querySelectorAll(".ln");
      lines.forEach((ln, i) => {
        // tape strip unrolls left to right
        tl.fromTo(ln, { scaleX: 0, rotation: i % 2 ? 1.2 : -1.2 }, { scaleX: 1, rotation: i % 2 ? 0.8 : -0.8, duration: 0.2, ease: "expo.out" }, s + i * 0.06);
      });
      g.querySelectorAll(".w").forEach((w) => {
        const t = Math.max(s, parseFloat(w.dataset.t) - 0.05);
        const key = w.classList.contains("k");
        const hot = w.closest(".ln").classList.contains("hot");
        // every word is on the tape from the start as a pale ghost; it inks in as it is spoken
        tl.fromTo(w, { opacity: 0 }, { opacity: 0.22, duration: 0.12, ease: "power2.out" }, s);
        if (key && !hot) {
          tl.fromTo(
            w,
            { opacity: 0.22, scale: 1, backgroundColor: "rgba(255,91,36,0)" },
            { opacity: 1, scale: 1, backgroundColor: "rgba(255,91,36,1)", duration: 0.18, ease: "power3.out" },
            t,
          );
          tl.fromTo(w, { scale: 1.18 }, { scale: 1, duration: 0.24, ease: "back.out(2.2)", immediateRender: false }, t);
        } else {
          tl.fromTo(w, { opacity: 0.22 }, { opacity: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, t);
        }
      });
      tl.to(g, { opacity: 0, y: -14, duration: 0.12, ease: "power2.in" }, e - 0.12);
      tl.set(g, { opacity: 0, visibility: "hidden" }, e);
    });
    window.__timelines["captions"] = tl;
  </script>
