<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[{"id":"series","type":"string","label":"Series label","default":"GOLF LESSON — BERSAMA FAIZ"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* "Yardage book" look: cream paper, navy ink, flag orange. */
      :root {
        --paper: #f6eedd;
        --ink: #0e1e33;
        --flag: #ff5b24;
        --font-display: "League Gothic", sans-serif;
        --font-mono: "Space Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 46%;
      }
      #aroll {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32.08"
      data-width="1080"
      data-height="1920"
    >
      <!-- Edited a-roll (cuts made from the two source clips; voice cleaned and levelled) -->
      <div id="cam">
        <video
          id="aroll"
          class="clip"
          src="assets/video/main.mp4"
          data-start="0"
          data-duration="32.08"
          data-track-index="0"
          data-has-audio="true"
          data-volume="1"
          data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":9.8,"v":1},{"t":9.95,"v":0.3},{"t":13.15,"v":0.3},{"t":13.28,"v":1},{"t":32.08,"v":1}]}]}'
          playsinline
        ></video>
      </div>

      <!-- Graphics scenes -->
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="1.75"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>
      <div
        id="tabs"
        data-composition-id="tabs"
        data-composition-src="compositions/tabs.html"
        data-start="1.7"
        data-duration="27.6"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>
      <div
        id="fx"
        data-composition-id="fx"
        data-composition-src="compositions/fx.html"
        data-start="0"
        data-duration="29.3"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="1.7"
        data-duration="27.6"
        data-track-index="4"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 7"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="29.28"
        data-duration="2.8"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 8"
      ></div>

      <!-- Music bed: "Upbeat Lounge Background" by Soundrider/Dope (Jamendo, CC BY 3.0), ducked under speech -->
      <audio
        id="music"
        class="clip"
        src="assets/music/bed.mp3"
        data-start="0"
        data-duration="32.08"
        data-track-index="10"
        data-volume="1"
        data-fade-out="0.8"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.55},{"t":1.72,"v":0.55},{"t":1.86,"v":0.2},{"t":9.75,"v":0.2},{"t":10.0,"v":0.48},{"t":13.1,"v":0.48},{"t":13.28,"v":0.2},{"t":16.85,"v":0.2},{"t":17.05,"v":0.48},{"t":19.45,"v":0.48},{"t":19.62,"v":0.2},{"t":24.05,"v":0.2},{"t":24.25,"v":0.48},{"t":26.6,"v":0.48},{"t":26.76,"v":0.2},{"t":29.2,"v":0.2},{"t":29.5,"v":0.7},{"t":32.08,"v":0.7}]}]}'
      ></audio>

      <!-- Sound design (peaks land ~1 frame after the picture) -->
      <audio id="sfx-hook-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.02" data-duration="2.11" data-track-index="11" data-volume="0.42"></audio>
      <audio id="sfx-swing0" class="clip" src="assets/sfx/whoosh.mp3" data-start="0.56" data-duration="0.57" data-track-index="12" data-volume="0.38"></audio>
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh-lo.mp3" data-start="1.56" data-duration="0.64" data-track-index="13" data-volume="0.32"></audio>
      <audio id="sfx-pusing" class="clip" src="assets/sfx/pop.mp3" data-start="3.47" data-duration="0.72" data-track-index="14" data-volume="0.34"></audio>
      <audio id="sfx-badan" class="clip" src="assets/sfx/pop-lo.mp3" data-start="4.46" data-duration="0.88" data-track-index="15" data-volume="0.34"></audio>
      <audio id="sfx-tab2" class="clip" src="assets/sfx/whoosh-hi.mp3" data-start="5.26" data-duration="0.48" data-track-index="16" data-volume="0.26"></audio>
      <audio id="sfx-meter1" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.46" data-duration="0.37" data-track-index="17" data-volume="0.5"></audio>
      <audio id="sfx-meter1-land" class="clip" src="assets/sfx/ping.mp3" data-start="9.06" data-duration="1.32" data-track-index="18" data-volume="0.55"></audio>
      <audio id="sfx-handson" class="clip" src="assets/sfx/whoosh-lo.mp3" data-start="9.66" data-duration="0.64" data-track-index="19" data-volume="0.3"></audio>
      <audio id="sfx-tab3" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.15" data-duration="0.57" data-track-index="20" data-volume="0.26"></audio>
      <audio id="sfx-swing1" class="clip" src="assets/sfx/whoosh-hi.mp3" data-start="17.72" data-duration="0.48" data-track-index="21" data-volume="0.36"></audio>
      <audio id="sfx-meter2" class="clip" src="assets/sfx/click-soft.mp3" data-start="21.62" data-duration="0.37" data-track-index="22" data-volume="0.5"></audio>
      <audio id="sfx-betul" class="clip" src="assets/sfx/ping.mp3" data-start="23.2" data-duration="1.32" data-track-index="23" data-volume="0.55"></audio>
      <audio id="sfx-swing2" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="25.5" data-duration="2.11" data-track-index="24" data-volume="0.36"></audio>
      <audio id="sfx-lowpoint" class="clip" src="assets/sfx/sparkle.mp3" data-start="27.62" data-duration="1.8" data-track-index="25" data-volume="0.3"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/whoosh-lo.mp3" data-start="29.16" data-duration="0.64" data-track-index="26" data-volume="0.34"></audio>
      <audio id="sfx-end-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="29.62" data-duration="0.72" data-track-index="27" data-volume="0.26"></audio>
      <audio id="sfx-end-pop2" class="clip" src="assets/sfx/pop-lo.mp3" data-start="29.84" data-duration="0.88" data-track-index="28" data-volume="0.26"></audio>
      <audio id="sfx-end-pop3" class="clip" src="assets/sfx/pop.mp3" data-start="30.06" data-duration="0.72" data-track-index="29" data-volume="0.26"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Punch-ins on each swing impact (camera wrapper, never the video itself)
      [0.7, 17.85, 25.63].forEach((t) => {
        tl.fromTo("#cam", { scale: 1 }, { scale: 1.07, duration: 0.1, ease: "power3.out", immediateRender: false }, t - 0.03);
        tl.to("#cam", { scale: 1, duration: 0.9, ease: "power2.inOut" }, t + 0.12);
      });
      // Slow push on the end-card freeze
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.04, duration: 2.8, ease: "none", immediateRender: false }, 29.28);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
