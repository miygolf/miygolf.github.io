    <style>
      /* "Yardage book" look: cream paper, navy ink, flag orange. */
      :root {
        --paper: #f6eedd;
        --ink: #0e1e33;
        --flag: #ff5b24;
        --font-display: "League Gothic", sans-serif;
        --font-mono: "Space Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 46%;
      }
      #aroll {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Freeze-frame "pause at impact": punch in on the impact, hold through the freeze, release
      [0.7333, 8.4, 29.2, 38.3333, 44.0].forEach((t) => {
        tl.fromTo("#cam", { scale: 1 }, { scale: 1.06, duration: 0.08, ease: "power3.out", immediateRender: false }, t - 0.02);
        tl.to("#cam", { scale: 1, duration: 0.5, ease: "power2.inOut" }, t + 0.6);
      });
      // Slow push on the end-card freeze
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.04, duration: 2.8, ease: "none", immediateRender: false }, 48);
      window.__timelines["main"] = tl;
    </script>
