<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; background: #000; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <!-- Checklist format after the reference: product footage (IMG_0378, voice muted), a ✅ list held on top, music added in the app; SFX below -->
      <video id="vc0" class="clip shot" src="assets/video/c0.mp4" data-start="0" data-duration="2.4" data-media-start="0" muted data-track-index="0"></video>
      <video id="vc1" class="clip shot" src="assets/video/c1.mp4" data-start="2.4" data-duration="2.6" data-media-start="0" muted data-track-index="0"></video>
      <video id="vc2" class="clip shot" src="assets/video/c2.mp4" data-start="5" data-duration="3" data-media-start="0" muted data-track-index="0"></video>
      <video id="vc3" class="clip shot" src="assets/video/c3.mp4" data-start="8" data-duration="2.6" data-media-start="0" muted data-track-index="0"></video>
      <video id="vc5" class="clip shot" src="assets/video/c5.mp4" data-start="10.6" data-duration="3.4" data-media-start="0" muted data-track-index="0"></video>

      <div id="checklist" class="clip" data-composition-id="checklist" data-composition-src="compositions/checklist.html" data-start="0" data-duration="14" data-track-index="1" data-track-kind="graphics"></div>
      <div id="cta" class="clip" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="10.6" data-duration="3.4" data-track-index="2" data-track-kind="graphics"></div>
      <!-- SFX: pop per tick (rising pitch), soft whoosh per cut, the real water pour from the clip, click + chime on the CTA -->
      <audio id="sfx-tick0" class="clip" src="assets/sfx/pop.mp3" data-start="0.113" data-duration="0.5" data-volume="0.45" data-track-index="3"></audio>
      <audio id="sfx-tick1" class="clip" src="assets/sfx/pop.mp3" data-start="0.42" data-duration="0.47" data-volume="0.45" data-playback-rate="1.06" data-track-index="4"></audio>
      <audio id="sfx-tick2" class="clip" src="assets/sfx/pop.mp3" data-start="0.726" data-duration="0.45" data-volume="0.45" data-playback-rate="1.12" data-track-index="3"></audio>
      <audio id="sfx-tick3" class="clip" src="assets/sfx/pop.mp3" data-start="1.032" data-duration="0.42" data-volume="0.45" data-playback-rate="1.19" data-track-index="4"></audio>
      <audio id="sfx-tick4" class="clip" src="assets/sfx/pop.mp3" data-start="1.338" data-duration="0.4" data-volume="0.45" data-playback-rate="1.26" data-track-index="3"></audio>
      <audio id="sfx-cut0" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.271" data-duration="0.57" data-volume="0.3" data-track-index="5"></audio>
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.853" data-duration="0.63" data-volume="0.3" data-playback-rate="0.9" data-track-index="5"></audio>
      <audio id="sfx-cut2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.886" data-duration="0.52" data-volume="0.3" data-playback-rate="1.1" data-track-index="5"></audio>
      <audio id="sfx-cut3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.462" data-duration="0.6" data-volume="0.3" data-playback-rate="0.95" data-track-index="5"></audio>
      <audio id="sfx-pour" class="clip" src="assets/sfx/pour-real.m4a" data-start="6.25" data-duration="1.55" data-volume="1" data-track-index="6"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/click-soft.mp3" data-start="10.86" data-duration="0.37" data-volume="0.6" data-track-index="7"></audio>
      <audio id="sfx-chime" class="clip" src="assets/sfx/chime.mp3" data-start="10.615" data-duration="2.5" data-volume="0.22" data-fade-out="0.8" data-track-index="8"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
